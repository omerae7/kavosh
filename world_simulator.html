}
function resNeed(c, k) {

}
function declareWar(a, b, reason) {

  ra.status = 'war'; rb.status = 'war';
  ra.warSince = W.year; rb.warSince = W.year;
  ra.ally = rb.ally = false; ra.nonAgg = rb.nonAgg = false; ra.defPact = rb.defPact = false;
  ra.tension = rb.tension = 100;

  a.unRep = clamp((a.unRep == null ? 50 : a.unRep) - 6 * (0.4 + W.un.power), 0, 100);

  const soft = isCondemned(b.id) ? 0.35 : 1;

    const r = relOf(o, a.id);

    r.fear = clamp(r.fear + 3 * soft, 0, 100);
  }

        W.requests.push({
          id: (W.reqId = (W.reqId || 0) + 1), type: 'callToArms', from: b.id, about: a.id, y: W.year,
          payload: { enemy: a.id, enemyName: a.name, reason: 'پیمان دفاعی' }
        });

      } else {
        const willing = (relOf(o, b.id).trust / 100) * 0.6 + o.bias.militarism * 0.4 -
          relOf(o, a.id).fear / 180 - (o.warmonger || 0) / 260 - (W.un ? W.un.power * 0.15 : 0);
        if (willing > 0.68 && (r.ally || r.defPact) && RNGX.chance(0.7)) { declareWar(o, a, 'تعهد دفاعی'); }
        else {
          r.defPact = false; r.guarantee = false;
          o.credibility = clamp((o.credibility != null ? o.credibility : 70) - 18, 0, 100);
          news('پیمان شکسته شد', o.name + ' از تعهد دفاعی خود در قبال ' + b.name + ' سر باز زد.', 'diplo', { c: o.id, c2: b.id });
        }

}
function makePeace(a, b) {
  const ra = relOf(a, b.id), rb = relOf(b, a.id);
  ra.status = 'tense'; rb.status = 'tense';
  ra.truce = 12; rb.truce = 12;
  ra.tension = clamp(ra.tension - 35, 0, 100); rb.tension = clamp(rb.tension - 35, 0, 100);
  a.warWeariness = clamp(a.warWeariness - 25, 0, 100);
  b.warWeariness = clamp(b.warWeariness - 25, 0, 100);
  for (const op of W.ops.slice()) {
    if ((op.att === a.id && W.states[op.target - 1].controller === b.id) ||
      (op.att === b.id && W.states[op.target - 1].controller === a.id)) {

/* ---------- ۱۵) شخصیت‌ها، مرگ و جانشینی ---------- */
function killAgent(a, cause) {
  if (!a || !a.alive) return;
  a.alive = false; a.death = Math.floor(W.year); a.cause = cause || 'طبیعی';
  const c = W.countries[a.country];
  if (c && c.alive) {
    for (const kidId of a.children) {
      const kid = W.agents[kidId];
      if (kid && kid.alive) {
        addMemory(kid, { y: W.year, t: cause === 'جنگ' ? 'warDeath' : 'parentDeath', w: cause === 'جنگ' ? 0.95 : 0.6, other: a.lastEnemy || 0 });
        if (cause === 'جنگ' && a.lastEnemy) kid.her.grudge[a.lastEnemy] = clamp((kid.her.grudge[a.lastEnemy] || 0) + 0.5, 0, 1);
      }
    }
    if (c.leader === a.id) succession(c, cause);
    else if (c.heir === a.id) pickHeir(c);
  }
}
function succession(c, cause) {
  const g = GOVS[c.gov];
  const old = W.agents[c.leader];

      news('نابغه علمی', 'دانشمندی برجسته در ' + c.name + ' ظهور کرد.', 'discovery', { c: c.id });
    }
    /* رنسانس فرهنگی */
    if (RNGX.chance(clamp(0.004 + c.stability / 5000, 0, 0.012))) {
      for (const sid of c.owned) W.states[sid - 1].sat = clamp(W.states[sid - 1].sat + RNGX.range(3, 9), 0, 100);
      c.legitimacy = clamp(c.legitimacy + 5, 0, 100);
      news('شکوفایی فرهنگی', 'دوران درخشان هنر و ادب در ' + c.name + ' آغاز شد.', 'culture', { c: c.id });
    }
  }
  /* خشکسالی منطقه‌ای */
  if (RNGX.chance(0.06)) {
    const center = W.states[RNGX.int(0, W.states.length - 1)];
    const affected = [center.id].concat(GEO.neighbors[center.id - 1].map(i => i + 1));
    for (const sid of affected) {
      const st = W.states[sid - 1];
      st.droughtYears = RNGX.int(2, 6);
    }
    news('خشکسالی', 'خشکسالی در پیرامون ایالت ' + faNum(center.id) + ' آغاز شد.', 'crisis', { s: center.id });
  }
  for (const st of W.states) {
    if (st.droughtYears > 0) {
      st.droughtYears--;
      st.agri = clamp(st.agri - 0.6, 0, 100);
      st.sat = clamp(st.sat - 0.6, 0, 100);
    }
  }
  /* مهاجرت به سرزمین‌های آزاد و مرفه */
  if (RNGX.chance(0.25)) {
    const from = W.states[RNGX.int(0, W.states.length - 1)];
    if (from.pop > 60 && (from.sat < 40 || from.unrest > 55)) {
      const nbs = GEO.neighbors[from.id - 1].map(i => W.states[i]).filter(s => s.sat > from.sat + 12);
      if (nbs.length) {
        const to = nbs[Math.floor(RNGX.f() * nbs.length)];
        const move = from.pop * RNGX.range(0.01, 0.05);
        from.pop -= move; to.pop += move;
      }
    }
  }
}

/* ---------- ۳۱) احزاب، جناح‌ها و جنبش‌ها ---------- */
const FACTION_KINDS = [
  { k: 'party', n: 'حزب سیاسی', govs: [4, 5, 3, 10] },
  { k: 'faction', n: 'جناح درباری', govs: [2, 6, 3] },
  { k: 'movement', n: 'جنبش مردمی', govs: [4, 11, 5] },
  { k: 'union', n: 'اتحادیه صنفی', govs: [6, 5, 4] },
  { k: 'rebels', n: 'گروه شورشی', govs: [11, 9, 8] },
  { k: 'military', n: 'جناح نظامی', govs: [8, 9] },
  { k: 'independence', n: 'جنبش استقلال', govs: [1, 2, 11] },
  { k: 'dynasty', n: 'خاندان سیاسی', govs: [2, 3, 6] },
  { k: 'tech', n: 'انجمن دانشوران', govs: [7, 4] }
];
function createFaction(c) {
  const g = GOVS[c.gov];
  const pool = [];
  if (c.education > 25 && g.polFree > 0.3) pool.push('party', 'movement');
  if (c.unrestAvg > 40) pool.push('rebels', 'movement');
  if (g.army > 0.5 || c.army.pay < 70) pool.push('military');
  if (c.knowledge > 40) pool.push('tech');
  if (g.rich > 0.5 || c.bias.trade > 0.6) pool.push('union');
  if (g.central > 0.6) pool.push('faction', 'dynasty');
  const minority = c.owned.map(s => W.states[s - 1]).filter(s => s.eth !== stateEthOwner(s));
  if (minority.length > 1) pool.push('independence');
  if (!pool.length) pool.push('faction');
  const kind = RNGX.pick(pool);
  const def = FACTION_KINDS.find(f => f.k === kind) || FACTION_KINDS[1];
  const cands = Object.values(W.agents).filter(a => a.alive && a.country === c.id && a.id !== c.leader);
  let leader = null, bv = -1;
  for (const a of cands) {
    const v = a.tr[TI.charisma] * 1.2 + a.tr[TI.ambition] + a.tr[TI.organize] * 0.6 + RNGX.f() * 0.5;
    if (v > bv) { bv = v; leader = a; }
  }
  const eth = kind === 'independence' && minority.length ? minority[0].eth : (W.states[c.capital - 1] ? W.states[c.capital - 1].eth : 0);
  const f = {
    id: (W.facId = (W.facId || 0) + 1), kind: kind,
    name: def.n + ' ' + (leader ? ((leader.sur && FA_ORD.indexOf(leader.sur) < 0) ? leader.sur : leader.name) : faNum(W.facId)),
    leader: leader ? leader.id : 0, strength: RNGX.range(0.08, 0.22), eth: eth,
    wantGov: RNGX.pick(def.govs), born: Math.floor(W.year)
  };
  if (leader) leader.role = (kind === 'rebels' || kind === 'independence') ? 'rebel' : (kind === 'military' ? 'general' : 'party');
  c.factions.push(f);
  if (c.isPlayer) news('گروه تازه', 'در ' + c.name + ' «' + f.name + '» شکل گرفت.', 'gov', { c: c.id });
}
function factionsYear(c) {
  const g = GOVS[c.gov];
  for (const f of c.factions) {
    let d = 0;
    const lead = W.agents[f.leader];
    if (!lead || !lead.alive) {
      const cands = Object.values(W.agents).filter(a => a.alive && a.country === c.id && a.id !== c.leader);
      f.leader = cands.length ? RNGX.pick(cands).id : 0;
      d -= 0.03;
    } else d += (lead.tr[TI.charisma] - 0.45) * 0.02 + (lead.tr[TI.organize] - 0.45) * 0.012;
    if (f.kind === 'rebels' || f.kind === 'independence') d += c.unrestAvg / 2600 - g.repress * 0.012;
    if (f.kind === 'military') d += (100 - (c.army.pay || 100)) / 2400 + g.army * 0.006 - c.stability / 9000;
    if (f.kind === 'party' || f.kind === 'movement') d += g.polFree * 0.010 + g.party * 0.008 + c.education / 9000 - c.stability / 12000;
    if (f.kind === 'union' || f.kind === 'tech') d += c.knowledge / 12000 + g.ecoFree * 0.006;
    if (f.kind === 'faction' || f.kind === 'dynasty') d += g.central * 0.008 + c.corruption / 9000;
    if (f.wantGov === c.gov) d -= 0.012;
    d -= 0.004;
    f.strength = clamp(f.strength + d, 0, 1);
  }
  c.factions = c.factions.filter(f => f.strength > 0.04);
  if (c.factions.length < 6 && RNGX.chance(0.035 + c.unrestAvg / 2200 + GOVS[c.gov].polFree * 0.03)) createFaction(c);
}
function strongestFaction(c) {
  let best = null;
  for (const f of c.factions) if (!best || f.strength > best.strength) best = f;
  return best;
}

/* ---------- ۳۲) قراردادهای بلندمدت منابع ---------- */
function contractValue(c, other, res, amount, price, asSeller) {
  const m = W.market[res].price;
  const need = resNeed(c, res);
  const r = relOf(c, other.id);
  let u = 0;
  if (asSeller) {
    u += (price / Math.max(m, 0.05) - 1) * 3.2;
    u -= need * 2.2;
    u += (c.stock[res] > amount * 4 ? 0.8 : -0.6);
  } else {
    u += (1 - price / Math.max(m, 0.05)) * 3.2;
    u += need * 2.0;
  }
  u += r.trust / 90 - r.tension / 80 + (r.ally ? 0.6 : 0);
  if (r.status === 'war' || r.embargo) u = -10;
  return u;
}
function proposeContract(from, to, res, amount, price, cycles, fromIsSeller) {
  const seller = fromIsSeller ? from : to, buyer = fromIsSeller ? to : from;
  const other = fromIsSeller ? to : from;
  if (relOf(from, to.id).status === 'war') return { ok: false, why: 'در وضعیت جنگ قرارداد ممکن نیست.' };
  if (to.isPlayer) {
    W.requests = W.requests || [];
    W.requests.push({ id: (W.reqId = (W.reqId || 0) + 1), type: 'contract', from: from.id, y: W.year, payload: { res, amount, price, cycles, sellerId: seller.id } });
    return { ok: true, pending: true };
  }
  const u = contractValue(to, from, res, amount, price, to.id === seller.id);
  if (noisy(u, aiError(to)) < 0.55) return { ok: true, rejected: true, msg: to.name + ' قرارداد را نپذیرفت.' };
  signContract(seller, buyer, res, amount, price, cycles);
  return { ok: true, msg: to.name + ' قرارداد را پذیرفت.' };
}
function signContract(seller, buyer, res, amount, price, cycles) {
  W.contracts = W.contracts || [];
  W.contracts.push({
    id: (W.ctrId = (W.ctrId || 0) + 1), seller: seller.id, buyer: buyer.id,
    res: res, amount: amount, price: price, left: cycles, started: Math.floor(W.year)
  });
  relOf(seller, buyer.id).trade += amount * price * 0.4;
  relOf(buyer, seller.id).trade += amount * price * 0.4;
  news('قرارداد بلندمدت', seller.name + ' تأمین ' + faNum(amount) + ' واحد ' + RES_NAMES[res] + ' در هر چرخه را به ' + buyer.name + ' تعهد کرد.', 'econ', { c: seller.id, c2: buyer.id });
}
function contractsCycle() {
  if (!W.contracts) W.contracts = [];
  for (const k of W.contracts.slice()) {
    const s = W.countries[k.seller], b = W.countries[k.buyer];
    const idx = W.contracts.indexOf(k);
    if (!s || !b || !s.alive || !b.alive) { W.contracts.splice(idx, 1); continue; }
    if (relOf(s, b.id).status === 'war') {
      W.contracts.splice(idx, 1);
      news('لغو قرارداد', 'جنگ، قرارداد ' + RES_NAMES[k.res] + ' میان ' + s.name + ' و ' + b.name + ' را لغو کرد.', 'econ', { c: s.id, c2: b.id });
      continue;
    }
    const cost = k.amount * k.price;
    if (s.stock[k.res] >= k.amount && b.treasury >= cost) {
      s.stock[k.res] -= k.amount; b.stock[k.res] += k.amount;
      s.treasury += cost; b.treasury -= cost;
      relOf(s, b.id).trust = clamp(relOf(s, b.id).trust + 0.6, 0, 100);
      relOf(b, s.id).trust = clamp(relOf(b, s.id).trust + 0.6, 0, 100);
      k.left--;
      if (k.left <= 0) W.contracts.splice(idx, 1);
    } else {
      /* نقض تعهد */
      W.contracts.splice(idx, 1);
      const breaker = s.stock[k.res] < k.amount ? s : b;
      const other = breaker === s ? b : s;
      relOf(other, breaker.id).trust = clamp(relOf(other, breaker.id).trust - 14, 0, 100);
      addCountryMemory(other, { t: 'betray', other: breaker.id, w: 0.5 });
      news('نقض قرارداد', breaker.name + ' نتوانست به تعهد خود در برابر ' + other.name + ' عمل کند.', 'econ', { c: breaker.id, c2: other.id });
    }
  }
}
function aiContracts(c) {
  if (!RNGX.chance(0.10)) return;
  const partners = Object.keys(c.rel).map(Number).filter(id => {
    const o = W.countries[id], r = c.rel[id];
    return o && o.alive && r.status !== 'war' && !r.embargo && r.trust > 40;
  });
  if (!partners.length) return;
  const o = W.countries[RNGX.pick(partners)];
  const res = RNGX.pick(RES_KEYS);
  const myNeed = resNeed(c, res), theirNeed = resNeed(o, res);
  if (myNeed > 0.4 && theirNeed < 0.25 && o.stock[res] > 60) {
    const amount = Math.round(Math.min(o.stock[res] * 0.15, 60) + 10);
    const price = W.market[res].price * RNGX.range(0.95, 1.15);
    proposeContract(c, o, res, amount, price, RNGX.int(4, 12), false);
  } else if (theirNeed > 0.4 && myNeed < 0.25 && c.stock[res] > 60) {
    const amount = Math.round(Math.min(c.stock[res] * 0.15, 60) + 10);
    const price = W.market[res].price * RNGX.range(0.9, 1.1);
    proposeContract(c, o, res, amount, price, RNGX.int(4, 12), true);
  }
}
/* ---------- ۳۳) درخواست کمک کشورهای AI از بازیکن ---------- */
function aiAskPlayer(c) {
  const pl = W.countries[W.player];
  if (!pl || !pl.alive || c.isPlayer) return;
  const r = relOf(c, pl.id);
  if (r.status === 'war' || r.trust < 45) return;
  const atWar = Object.values(c.rel).some(x => x.status === 'war');
  const broke = c.treasury < avgStateRevenue(c) * c.owned.length * 0.2;
  const hungry = (c.foodShort || 0) > 0.25;
  if (!(atWar || broke || hungry)) return;
  if (r.trust < 55) return;
  if (c.lastAsk != null && W.year - c.lastAsk < 45) return;
  if (!RNGX.chance(0.02)) return;
  W.requests = W.requests || [];
  for (const q of W.requests) if (q.from === c.id && q.type === 'askAid') return;
  c.lastAsk = W.year;
  const kind = hungry ? 'food' : (broke ? 'money' : 'join');
  const amount = kind === 'money' ? Math.round(Math.max(80, avgStateRevenue(pl) * 2)) : (kind === 'food' ? 120 : 0);
  let enemy = 0, enemyName = '';
  if (kind === 'join') {
    for (const oid in c.rel) {
      if (c.rel[oid].status === 'war' && W.countries[oid] && W.countries[oid].alive) { enemy = +oid; enemyName = W.countries[oid].name; break; }
    }
    if (!enemy) return;
  }
  W.requests.push({
    id: (W.reqId = (W.reqId || 0) + 1), type: 'askAid', from: c.id, y: W.year,
    payload: { kind: kind, amount: amount, enemy: enemy, enemyName: enemyName }
  });
  if (kind === 'join') pause('درخواست ورود به جنگ از ' + c.name + ' در برابر ' + enemyName, 'diploReq');
}

/* ---------- ۳۴) سازمان ملل: محکومیت، تحریم، رأی، رشوه و ساید‌بندی ---------- */
const UN_STAGES = [
  { min: 0.00, name: 'شورای ملل', desc: 'انجمنی نوپا از فرستادگان که بیشتر نقش میانجی دارد' },
  { min: 0.22, name: 'مجمع ملل', desc: 'مجمعی که محکومیت‌هایش بر آبروی کشورها اثر می‌گذارد' },
  { min: 0.45, name: 'جامعه ملل', desc: 'نهادی با توان تحریم و فشار اقتصادی' },
  { min: 0.70, name: 'سازمان ملل متحد', desc: 'نهاد جهانی با ابزارهای فشار سیاسی و اقتصادی گسترده' }
];
function unStage() {
  let s = UN_STAGES[0];
  for (const x of UN_STAGES) if (W.un.power >= x.min) s = x;
  return s;
}
function initUN() {
  W.un = {
    power: 0.04, founded: W.year, session: 0,
    resolutions: [], pending: null, log: []
  };
}
function unPowerUpdate() {
  const alive = [];
  for (const cid in W.countries) if (W.countries[cid].alive) alive.push(W.countries[cid]);
  if (!alive.length) return;
  let tech = 0, edu = 0, trade = 0;
  for (const c of alive) {
    tech += c.tech; edu += c.education;
    for (const oid in c.rel) trade += c.rel[oid].trade;
  }
  tech /= alive.length; edu /= alive.length;
  const years = W.year - W.startYear;
  const target = clamp(0.03 + tech / 190 + edu / 320 + clamp(trade / (alive.length * 2600), 0, 0.18) + years / 6000, 0, 1);
  W.un.power = clamp(W.un.power + (target - W.un.power) * 0.25, 0, 1);
}
function unInfluence(c) {
  return 1 + c.owned.length / 6 + c.tech / 40 + (c.diploPower || 0) / 55 + (c.unRep || 0) / 60;
}
function activeRes(targetId, type) {
  for (const r of W.un.resolutions) if (r.target === targetId && (!type || r.type === type)) return r;
  return null;
}
function isCondemned(id) { return !!activeRes(id, 'condemn') || !!activeRes(id, 'sanction'); }
function isSanctioned(id) { return !!activeRes(id, 'sanction'); }
function warmongerAdd(c, amount, targetId) {
  const soft = targetId && isCondemned(targetId) ? 0.4 : 1;
  c.warmonger = clamp((c.warmonger || 0) + amount * soft * (0.6 + 0.8 * W.un.power), 0, 100);
}
function unVoterCount() {
  let n = 0;
  for (const cid in W.countries) if (W.countries[cid].alive) n++;
  return Math.max(1, n - 1);
}
function bribeSwing(voter, pool) {
  if (!pool) return 0;
  const per = pool / unVoterCount();
  return clamp(per / Math.max(18, avgStateRevenue(voter) * 2.2), 0, 2.4);
}
function unVoteValue(voter, prop) {
  const target = W.countries[prop.target];
  const by = W.countries[prop.by];
  if (!target || !target.alive) return -99;
  if (voter.id === prop.target) return -99;
  const rt = relOf(voter, target.id);
  const repeal = prop.type === 'repeal';
  let v = 0;
  /* رأی به محکومیت یا تحریم */
  v += (target.warmonger || 0) / 32;
  v -= rt.trust / 55;
  v += rt.grudge / 45 + rt.tension / 70;
  /* دوستان و متحدان به زیان یکدیگر رأی نمی‌دهند مگر دلیل محکم باشد؛
     چون محکومیت شریک تجاری، درآمد خودشان را هم کم می‌کند */
  if (rt.ally) v -= 2.2;
  else if (rt.friend) v -= 1.5;
  else if (rt.status === 'friendly') v -= 0.6;
  if (rt.trade > 250) v -= clamp(rt.trade / 700, 0, 1.2);
  if (rt.nonAgg) v -= 0.4;
  if (rt.status === 'war') v += 1.2;
  if (by && by.id !== voter.id) {
    const rb = relOf(voter, by.id);
    v += rb.trust / 90 + (rb.ally ? 0.9 : 0) + (rb.friend ? 0.5 : 0) - (rb.status === 'war' ? 1.2 : 0);
  }
  v += W.un.power * 0.7;
  v += voter.bias.diplomacy * 0.3 - voter.bias.militarism * 0.25;
  if (prop.type === 'sanction') v -= 0.5 + (rt.trade / 900);
  if (repeal) {
    /* رأی به تجدیدنظر: هرچه رفتار کشور بهتر شده باشد و دوستان بیشتری داشته باشد، آسان‌تر */
    let rv = -v;
    const res = activeRes(target.id, 'sanction') || activeRes(target.id, 'condemn');
    const behaved = res ? clamp((res.warmongerAt || 60) - (target.warmonger || 0), -40, 60) / 22 : 0;
    rv += behaved;
    rv += clamp((W.year - (res ? res.since : W.year)) / 24, 0, 1.2);
    rv += bribeSwing(voter, prop.pool || 0);
    rv -= bribeSwing(voter, prop.counterPool || 0);
    rv += 0.25;
    return rv;
  }
  v += bribeSwing(voter, prop.pool || 0);
  v -= bribeSwing(voter, prop.counterPool || 0);
  return v;
}
function unRunVote(prop) {
  let yes = 0, no = 0;
  const detail = [];
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive || c.id === prop.target) continue;
    if (c.isPlayer && prop.playerVote != null) {
      const w = unInfluence(c);
      if (prop.playerVote) yes += w; else no += w;
      detail.push({ id: c.id, name: c.name, yes: !!prop.playerVote, w: r3(w) });
      continue;
    }
    const v = noisy(unVoteValue(c, prop), aiError(c));
    const w = unInfluence(c);
    const y = v > 0.55;
    if (y) yes += w; else no += w;
    detail.push({ id: c.id, name: c.name, yes: y, w: r3(w) });
  }
  const passed = yes > no;
  prop.yes = r3(yes); prop.no = r3(no); prop.detail = detail; prop.passed = passed;
  if (passed) unApply(prop);
  const target = W.countries[prop.target];
  const by = W.countries[prop.by];
  W.un.log.unshift({
    y: Math.floor(W.year), type: prop.type, target: target ? target.name : '—',
    by: by ? by.name : 'مجمع', passed: passed, yes: Math.round(yes), no: Math.round(no)
  });
  if (W.un.log.length > 40) W.un.log.length = 40;
  const kindName = prop.type === 'sanction' ? 'تحریم ' : (prop.type === 'repeal' ? 'تجدیدنظر در قطعنامه ' : 'محکومیت ');
  news(unStage().name,
    (passed ? 'قطعنامه ' : 'قطعنامه ناکام ') + kindName +
    (target ? target.name : '') + ' با ' + faNum(yes) + ' رأی موافق و ' + faNum(no) + ' رأی مخالف.',
    'diplo', { c: prop.target });
  if (target && target.isPlayer && prop.type === 'repeal') {
    pause(passed ? 'قطعنامه علیه کشور شما لغو شد' : 'درخواست تجدیدنظر شما رد شد', 'diploReq');
  }
  return passed;
}
function unApply(prop) {
  const target = W.countries[prop.target];
  if (!target || !target.alive) return;
  if (prop.type === 'repeal') {
    /* لغو قطعنامه‌های فعال علیه این کشور */
    for (const r of W.un.resolutions.slice()) {
      if (r.target !== target.id) continue;
      W.un.resolutions.splice(W.un.resolutions.indexOf(r), 1);
      if (r.type === 'sanction') {
        for (const cid in W.countries) {
          const c2 = W.countries[cid];
          if (!c2.alive) continue;
          const rr = relOf(c2, target.id);
          if (rr.embargo && rr.status !== 'war') { rr.embargo = false; relOf(target, c2.id).embargo = false; }
        }
      }
    }
    target.unRep = clamp((target.unRep == null ? 50 : target.unRep) + 14, 0, 100);
    for (const cid in W.countries) {
      const c2 = W.countries[cid];
      if (!c2.alive || c2.id === target.id) continue;
      relOf(c2, target.id).trust = clamp(relOf(c2, target.id).trust + 5, 0, 100);
    }
    return;
  }
  const dur = prop.type === 'sanction' ? 25 : 20;
  W.un.resolutions.push({
    id: (W.un.resId = (W.un.resId || 0) + 1), type: prop.type, target: prop.target,
    until: W.year + dur, by: prop.by, since: Math.floor(W.year),

  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive || c.id === target.id) continue;
    const r = relOf(c, target.id);
    r.trust = clamp(r.trust - (prop.type === 'sanction' ? 14 : 7) * (0.35 + p), 0, 100);
    if (prop.type === 'sanction') {
      const voted = prop.detail && prop.detail.find(d => d.id === c.id);
      if (voted && voted.yes) { r.embargo = true; relOf(target, c.id).embargo = true; }
    }
  }
  target.stability = clamp(target.stability - (prop.type === 'sanction' ? 6 : 3) * (0.4 + p), 0, 100);
  if (target.isPlayer) {

}

        if (r.type === 'sanction') {

function unSession() {

  for (const cid in W.countries) {

    if (!c.alive) continue;
    c.warmonger = clamp((c.warmonger || 0) * 0.92, 0, 100);
    c.unRep = clamp((c.unRep == null ? 50 : c.unRep) + 0.8, 0, 100);
  }
  /* رأی‌گیری روی پیشنهاد در انتظار */
  if (W.un.pending) {
    const prop = W.un.pending;
    W.un.pending = null;
    if (prop.type === 'repeal' ? isCondemned(prop.target) : !activeRes(prop.target, prop.type)) unRunVote(prop);
    return;
  }
  /* درخواست تجدیدنظر کشورهای محکوم */

    const c2 = W.countries[cid];
    if (c2.alive) aiAppeal(c2);
  }

  /* پیشنهاد خودکار مجمع علیه جنگ‌طلب‌ترین کشور */

    const c = W.countries[cid];

    if (!worst || (c.warmonger || 0) > (worst.warmonger || 0)) worst = c;
  }
  if (!worst) return;
  const thr = 58 - W.un.power * 26;
  if ((worst.warmonger || 0) < thr) return;
  const already = activeRes(worst.id, 'condemn');
  const type = (already && (worst.warmonger || 0) > thr + 18 && W.un.power > 0.35) ? 'sanction' : 'condemn';
  if (activeRes(worst.id, type)) return;

/* کشورهای محکوم‌شده رفتار خود را اصلاح می‌کنند و تقاضای تجدیدنظر می‌دهند */
function aiAppeal(c) {

/* ---------- ۳۵) تغییر نوع حکومت به دست بازیکن ---------- */
const GOV_REQ = {

  1: { tech: 0, maxTech: 30, edu: 0, note: 'تنها در جامعه‌های ابتدایی ممکن است' },

function govChangeCheck(c, gov) {
  const req = GOV_REQ[gov];

  if (gov === c.gov) return { ok: false, why: 'هم‌اکنون همین نظام برقرار است.' };
  if (c.govChangedAt != null && W.year - c.govChangedAt < 25) {
    return { ok: false, why: 'تا ' + faNum(Math.ceil(25 - (W.year - c.govChangedAt))) + ' سال دیگر امکان تغییر دوباره نیست.' };
  }
  if (req.tech && c.tech < req.tech) return { ok: false, why: 'نیاز به فناوری ' + faNum(req.tech) + ' (اکنون ' + faNum(c.tech) + ').' };
  if (req.maxTech && c.tech > req.maxTech) return { ok: false, why: 'جامعه از این نظام گذر کرده است.' };
  if (req.edu && c.education < req.edu) return { ok: false, why: 'نیاز به آموزش ' + faNum(req.edu) + ' (اکنون ' + faNum(c.education) + ').' };
  if (req.know && c.knowledge < req.know) return { ok: false, why: 'نیاز به دانش ' + faNum(req.know) + '.' };
  if (req.army && c.army.troops < req.army) return { ok: false, why: 'نیاز به دست‌کم ' + faNum(req.army) + ' سرباز.' };
  if (req.from && req.from.indexOf(c.gov) < 0) return { ok: false, why: req.note };
  const cost = Math.round(Math.max(80, avgStateRevenue(c) * c.owned.length * 0.5) * (1 + GOVS[gov].central));
  if (c.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
  return { ok: true, cost: cost };
}
function playerChangeGov(c, gov) {
  const chk = govChangeCheck(c, gov);
  if (!chk.ok) return chk;
  c.treasury -= chk.cost;
  const old = GOVS[c.gov];
  const nw = GOVS[gov];
  const freer = nw.polFree - old.polFree;
  changeGov(c, gov, 'اصلاحات حاکم');
  c.govChangedAt = W.year;
  /* واکنش مردم: آزادی بیشتر رضایت می‌آورد، سرکوب بیشتر ناآرامی */

    st.sat = clamp(st.sat + freer * 26, 0, 100);

  }

  c.stability = clamp(c.stability - 10, 0, 100);

}

/* سبک رهبر: شخصیت می‌تواند اثر نوع حکومت را جبران یا تشدید کند */
function leaderStyle(c) {

/* ---------- ۳۸) دوستی و اثر دیپلماسی بر درآمد ---------- */
function powerScore(c) {
  return Math.max(1, c.owned.length * 1.0 + c.tech / 6 + Math.pow(Math.max(c.army.troops, 1), 0.5) / 4);
}
function worldAvgPower() {
  if (W._wapY === Math.floor(W.year) && W._wap) return W._wap;
  let s = 0, n = 0;
  for (const cid in W.countries) { const c = W.countries[cid]; if (c.alive) { s += powerScore(c); n++; } }
  W._wap = n ? s / n : 1;
  W._wapY = Math.floor(W.year);
  return W._wap;
}
function diploIncomeParts(c) {
  const avg = worldAvgPower();
  let bonus = 0, malus = 0;
  const list = [];
  for (const oid in c.rel) {
    const o = W.countries[oid];
    if (!o || !o.alive) continue;
    const r = c.rel[oid];
    const strength = clamp(powerScore(o) / Math.max(avg, 0.5), 0.35, 2.4);
    const quality = 0.55 + 0.45 * clamp(r.trust / 100, 0, 1);
    let v = 0;
    if (r.status === 'war') v = -0.022 * strength;
    else if (r.embargo) v = -0.016 * strength;
    else if (r.ally) v = 0.032 * strength * quality;
    else if (r.friend) v = 0.024 * strength * quality;
    else if (r.status === 'friendly') v = 0.008 * strength * quality;
    else if (r.status === 'hostile') v = -0.008 * strength;
    if (v > 0) bonus += v; else malus -= v;
    if (Math.abs(v) > 0.0005) list.push({ id: o.id, name: o.name, color: o.color, pct: r3(v * 100), kind: r.ally ? 'ally' : (r.friend ? 'friend' : r.status) });
  }
  bonus = Math.min(bonus, 0.30);
  malus = Math.min(malus, 0.40);
  list.sort((a, b) => b.pct - a.pct);
  return { bonus, malus, list, factor: clamp(1 + bonus - malus, 0.45, 1.32) };
}
function diploIncomeFactor(c) {
  if (c._difY === W.cycle && c._difF != null) return c._difF;
  const p = diploIncomeParts(c);
  c._difF = p.factor; c._difY = W.cycle;
  c.diploBonus = r3(p.bonus); c.diploMalus = r3(p.malus);
  return p.factor;
}

/* ---------- ۳۹) واگذاری تجارت و دیپلماسی به دولت ---------- */
function autoHandleRequests(pc) {
  const list = W.requests || [];
  for (const req of list.slice()) {
    const from = W.countries[req.from];
    if (!from || !from.alive) { continue; }
    const isTrade = req.type === 'contract';
    if (isTrade && !pc.autoTrade) continue;
    if (!isTrade && !pc.autoDiplo) continue;
    let accept = false;
    if (isTrade) {
      const pl = req.payload;
      accept = contractValue(pc, from, pl.res, pl.amount, pl.price, pl.sellerId === pc.id) > 0.6;
    } else if (req.type === 'askAid') {
      const r = relOf(pc, from.id);
      accept = (r.ally || r.friend) && r.trust > 62 && pc.treasury > avgStateRevenue(pc) * pc.owned.length * 0.8;
      if (req.payload && req.payload.kind === 'join') accept = accept && pc.bias.militarism > 0.5;
    } else if (req.type === 'callToArms') {
      accept = aiAccepts(pc, from, 'callToArms');
    } else {
      accept = aiAccepts(pc, from, req.type, req.payload);
    }
    command('respond', { id: req.id, accept: accept });
  }
}
function playerAutoDiplo(c) {
  if (!c.autoDiplo) return;
  autoHandleRequests(c);
  if (!RNGX.chance(0.35)) return;
  const cands = Object.keys(c.rel).map(Number).filter(oid => W.countries[oid] && W.countries[oid].alive && c.rel[oid].status !== 'war');
  if (!cands.length) return;
  const oid = RNGX.pick(cands);
  const o = W.countries[oid], r = c.rel[oid];
  const err = 0.08;
  const threat = biggestThreat(c);
  const uAlly = r.trust / 45 + c.bias.diplomacy * 1.1 + (threat && threat !== o.id ? 1.0 : 0) - r.grudge / 40;
  if (!r.ally && noisy(uAlly, err) > 2.3) diploOffer(c, o, 'alliance');
  else if (!r.friend && !r.ally && noisy(r.trust / 52 + 0.6, err) > 1.42) diploOffer(c, o, 'friendship');
  else if (!r.nonAgg && noisy(r.trust / 60 + 0.5, err) > 1.05) diploOffer(c, o, 'nonAgg');
  else if (!r.embargo && r.status !== 'hostile' && RNGX.chance(0.4)) diploOffer(c, o, 'trade');
  /* صلح در جنگ‌های فرسوده */
  for (const wid in c.rel) {
    const wr = c.rel[wid];
    if (wr.status !== 'war') continue;
    const since = wr.warSince != null ? W.year - wr.warSince : 0;
    if (since > 20 && c.warWeariness > 45 && RNGX.chance(0.3)) {
      const e = W.countries[wid];
      if (e && e.alive && aiAccepts(e, c, 'peace')) makePeace(c, e);
    }
  }
}
function playerAutoTrade(c) {
  if (!c.autoTrade) return;
  autoHandleRequests(c);
  aiContracts(c);
}

/* ---------- ۴۰) گزارش تغییر مالکیت ایالت و هشدار بازیکن ---------- */
const LOSS_KIND = {
  conquer: 'تصرف نظامی',
  colonize: 'استعمار',
  secede: 'جدایی و تشکیل کشور تازه',
  revolt: 'شورش مردمی',
  independence: 'اعطای استقلال',
  puppet: 'استقلال تحت نفوذ',
  colonyEnd: 'پایان استعمار',
  collapse: 'فروپاشی کشور',
  expand: 'گسترش قلمرو',
  freed: 'آزاد شدن ایالت'
};
function alertPlayer(a) {
  W.alerts = W.alerts || [];
  W.alerts.push(Object.assign({ y: Math.floor(W.year) }, a));
  if (W.alerts.length > 12) W.alerts.shift();
}
/* ثبت هر تغییر مالکیت یا کنترل در تاریخ ایالت و در صورت لزوم هشدار به بازیکن */
function stateChangeLog(st, info) {
  const from = info.from ? W.countries[info.from] : null;
  const to = info.to ? W.countries[info.to] : null;
  const kindName = LOSS_KIND[info.kind] || 'تغییر مالکیت';
  const fromName = from ? from.name : (info.fromName || 'بدون حکومت');
  const toName = to ? to.name : (info.toName || 'بدون حکومت');
  let txt = kindName + ': ';
  if (info.kind === 'conquer') txt += 'ارتش ' + toName + ' پس از نبرد، ایالت را از ' + fromName + ' گرفت.';
  else if (info.kind === 'colonize') txt += toName + ' کنترل ایالت را از ' + fromName + ' به دست گرفت؛ مالکیت رسمی تغییر نکرد.';
  else if (info.kind === 'secede') txt += 'ایالت از ' + fromName + ' جدا شد و به کشور تازه ' + toName + ' پیوست.';
  else if (info.kind === 'revolt') txt += 'شورش مردم ایالت پیروز شد و از ' + fromName + ' جدا شد.';
  else if (info.kind === 'independence') txt += fromName + ' به این ایالت استقلال داد و کشور ' + toName + ' زاده شد.';
  else if (info.kind === 'puppet') txt += fromName + ' این ایالت را مستقل کرد ولی آن را دولتی وابسته نگه داشت.';
  else if (info.kind === 'colonyEnd') txt += 'دوره استعمار ' + fromName + ' پایان یافت و کنترل به ' + toName + ' بازگشت.';
  else if (info.kind === 'collapse') txt += 'با فروپاشی ' + fromName + ' این ایالت بی‌صاحب شد.';
  else if (info.kind === 'expand') txt += toName + ' این سرزمین را به قلمرو خود افزود.';
  else txt += fromName + ' ← ' + toName;
  if (info.reason) txt += ' (' + info.reason + ')';
  stateHist(st, txt);
  logHistory(W.year, 'ایالت ' + faNum(st.id) + ' — ' + txt);
  const pid = W.player;
  const lostByPlayer = info.from === pid && info.to !== pid;
  const gainedByPlayer = info.to === pid && info.from !== pid;
  if (lostByPlayer) {
    alertPlayer({
      type: 'stateLost', state: st.id, kind: info.kind, kindName: kindName,
      other: toName, reason: info.reason || '', detail: info.detail || '',
      pop: Math.round(st.pop), income: Math.round(st.lastInc),
      unrest: Math.round(st.unrest), sat: Math.round(st.sat), wasCapital: !!info.wasCapital
    });
    pause('ایالت ' + faNum(st.id) + ' از کشور شما جدا شد (' + kindName + ')', 'stateLost');
  } else if (gainedByPlayer) {
    alertPlayer({
      type: 'stateGained', state: st.id, kind: info.kind, kindName: kindName,
      other: fromName, reason: info.reason || '', detail: info.detail || '',
      pop: Math.round(st.pop), income: Math.round(st.lastInc)
    });
  }
}
/* شرح علت جدایی بر پایه وضعیت ایالت */
function lossReason(st, c) {
  const bits = [];
  if (st.unrest > 60) bits.push('نارضایتی ' + faNum(st.unrest) + ' درصدی مردم');
  if (st.sat < 40) bits.push('رضایت پایین ' + faNum(st.sat) + ' درصد');
  if (st.integ < 0.5) bits.push('ادغام ناقص در کشور (' + faNum(st.integ * 100) + '٪)');
  if (st.eth !== stateEthOwner(st)) bits.push('تفاوت قومی با حکومت مرکزی');
  if (c && c.taxRate > 0.35) bits.push('مالیات سنگین ' + faNum(c.taxRate * 100) + ' درصدی');
  if (c && c.corruption > 55) bits.push('فساد گسترده دستگاه حکومت');
  if (st.devast > 40) bits.push('ویرانی ' + faNum(st.devast) + ' درصدی از جنگ');
  if (st.sponsor && W.countries[st.sponsor]) bits.push('حمایت خارجی ' + W.countries[st.sponsor].name + ' از شورشیان');
  if (c && c.warWeariness > 55) bits.push('خستگی کشور از جنگ');
  if (!bits.length) bits.push('فشار نظامی دشمن');
  return bits.slice(0, 3).join('، ');
}

/* ---------- ۴۱) آفند و پدافند راهبردی (دوره سلاح پیشرفته و هوشمند) ---------- */
const STRAT_TECH = 60;      /* آستانه فناوری */
const STRAT_MAX = 50;       /* بیشینه سطح */
function stratMaxLevel(c) {
  if (c.tech < STRAT_TECH) return 0;
  return clamp(Math.floor((c.tech - 55) * 1.15), 0, STRAT_MAX);
}
function stratLevelCost(c, current) {
  const base = Math.max(70, avgStateRevenue(c) * 2.0);
  return Math.round(base * Math.pow(1 + current / 8, 1.55));
}
function stratUpkeep(c) {
  const unit = Math.max(2, avgStateRevenue(c) * 0.05);
  return ((c.strike || 0) + (c.shield || 0)) * unit;
}
function buildStrat(c, kind, levels) {
  if (c.tech < STRAT_TECH) return { ok: false, why: 'نیاز به فناوری ' + faNum(STRAT_TECH) + ' (دوره سلاح پیشرفته).' };
  const max = stratMaxLevel(c);
  const cur = kind === 'strike' ? (c.strike || 0) : (c.shield || 0);
  if (cur >= max) return { ok: false, why: 'سقف کنونی با فناوری ' + faNum(c.tech) + ' برابر ' + faNum(max) + ' است.' };
  const want = Math.max(1, Math.min(Math.floor(levels || 1), max - cur));
  let cost = 0;
  for (let i = 0; i < want; i++) cost += stratLevelCost(c, cur + i);
  const extra = resourceNeedFor(c, kind === 'strike' ? 'air' : 'ship', Math.max(1, Math.round(want / 2)));
  cost += extra;
  if (c.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
  c.treasury -= cost;
  if (kind === 'strike') c.strike = cur + want; else c.shield = cur + want;
  return { ok: true, cost: cost, msg: (kind === 'strike' ? 'توان آفندی' : 'توان پدافندی') + ' به ' + faNum(cur + want) + ' رسید.' };
}
function strategicCost(c) {
  return Math.round(Math.max(120, avgStateRevenue(c) * 3.2) * (0.5 + (c.strike || 0) / 26));
}
function canStrategic(c, o) {
  if (c.tech < STRAT_TECH) return { ok: false, why: 'نیاز به فناوری ' + faNum(STRAT_TECH) + '.' };
  if (!(c.strike > 0)) return { ok: false, why: 'توان آفندی راهبردی ندارید.' };
  if (!o || !o.alive) return { ok: false, why: 'کشور هدف معتبر نیست.' };
  const r = relOf(c, o.id);
  if (r.status !== 'war') return { ok: false, why: 'این عملیات فقط در وضعیت جنگ ممکن است.' };
  if (c.lastStrategic != null && W.year - c.lastStrategic < 3) {
    return { ok: false, why: 'تا ' + faNum(Math.ceil(3 - (W.year - c.lastStrategic))) + ' سال دیگر امکان عملیات تازه نیست.' };
  }
  const cost = strategicCost(c);
  if (c.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
  return { ok: true, cost: cost };
}
/* اثر بازدارندگی: پدافند برابر با آفند تا ۸۰٪ از اثر را می‌گیرد */
function stratEffective(strike, shield) {
  const s = Math.max(0, strike || 0), d = Math.max(0, shield || 0);
  if (s <= 0) return 0;
  const block = 0.8 * Math.min(1, d / s);
  return s * (1 - block);
}
const STRAT_TARGETS = [
  { k: 'infra', n: 'زیرساخت' }, { k: 'industry', n: 'صنعت' }, { k: 'trade', n: 'تجارت' },
  { k: 'agri', n: 'کشاورزی' }, { k: 'health', n: 'سلامت' }, { k: 'security', n: 'امنیت' }
];
function strategicStrike(c, o) {
  const chk = canStrategic(c, o);
  if (!chk.ok) return chk;
  c.treasury -= chk.cost;
  c.lastStrategic = W.year;
  const eff = stratEffective(c.strike, o.shield);
  const power = clamp(eff / STRAT_MAX, 0, 1);
  const rand = RNGX.range(0.88, 1.12);
  const p = power * rand;
  /* عقب‌گرد فناوری و دانش */
  const techLoss = (0.25 + 1.6 * p);
  o.tech = clamp(o.tech - techLoss, 0, 100);
  o.knowledge = clamp(o.knowledge - techLoss * 0.6, 0, 100);
  o.education = clamp(o.education - techLoss * 0.45, 0, 100);
  o.healthIdx = clamp(o.healthIdx - techLoss * 0.5, 0, 100);
  /* ارتش */
  o.army.readiness = clamp(o.army.readiness - (5 + 25 * p), 5, 100);
  o.army.morale = clamp(o.army.morale - (3 + 12 * p), 5, 100);
  const troopLoss = o.army.troops * (0.01 + 0.06 * p);
  o.army.troops = Math.max(0, o.army.troops - troopLoss);
  if (o.army.navy > 0 && RNGX.chance(0.25 + p * 0.4)) o.army.navy = Math.max(0, o.army.navy - 1);
  if (o.army.air > 0 && RNGX.chance(0.2 + p * 0.4)) o.army.air = Math.max(0, o.army.air - 1);
  /* تأسیسات ایالت‌ها: از توسعه‌یافته‌ترین‌ها شروع می‌شود */
  const targets = o.owned.slice().sort((a, b) => (W.states[b - 1].infra + W.states[b - 1].industry) - (W.states[a - 1].infra + W.states[a - 1].industry));
  const n = Math.min(targets.length, 2 + Math.round(6 * p));
  const hitList = [];
  const drop = 0.8 + 5 * p;
  for (let i = 0; i < n; i++) {
    const st = W.states[targets[i] - 1];
    for (const t of STRAT_TARGETS) st[t.k] = clamp(st[t.k] - drop * RNGX.range(0.7, 1.3), 0, 100);
    st.devast = clamp(st.devast + (2 + 10 * p), 0, 100);
    st.extractDamage = clamp((st.extractDamage || 0) + (3 + 14 * p), 0, 60);
    st.sat = clamp(st.sat - (1 + 5 * p), 0, 100);
    st.unrest = clamp(st.unrest + (1 + 5 * p), 0, 100);
    st.pop = Math.max(8, st.pop * (1 - (0.002 + 0.012 * p)));
    stateHist(st, 'هدف حمله راهبردی ' + c.name + ' قرار گرفت؛ تأسیسات آسیب دید.');
    hitList.push(st.id);
  }
  /* فرسایش تجهیزات دو طرف */
  c.strike = Math.max(0, (c.strike || 0) - (RNGX.chance(0.35) ? 1 : 0));
  if (o.shield > 0 && RNGX.chance(0.4)) o.shield = Math.max(0, o.shield - 1);
  o.warWeariness = clamp(o.warWeariness + 3 + 6 * p, 0, 100);
  c.warWeariness = clamp(c.warWeariness + 1.5, 0, 100);
  warmongerAdd(c, 4, o.id);
  /* واکنش جهانی */
  for (const cid in W.countries) {
    const x = W.countries[cid];
    if (!x.alive || x.id === c.id) continue;
    const r = relOf(x, c.id);
    r.trust = clamp(r.trust - (0.8 + 2.5 * (W.un ? W.un.power : 0)), 0, 100);
  }
  const blocked = Math.round((1 - (c.strike ? eff / c.strike : 0)) * 100);
  const report = {
    attacker: c.name, defender: o.name, strike: c.strike, shield: o.shield || 0,
    effective: r3(eff), blocked: blocked, techLoss: r3(techLoss), states: hitList,
    troopLoss: Math.round(troopLoss), year: Math.floor(W.year)
  };
  o.lastStrategicHit = report;
  news('حمله راهبردی', c.name + ' با توان آفندی ' + faNum(c.strike) + ' به تأسیسات ' + o.name +
    ' حمله کرد؛ پدافند ' + faNum(blocked) + '٪ از حمله را خنثی کرد. فناوری ' + faDec(techLoss, 1) + ' واحد عقب رفت.',
    'war', { c: c.id, c2: o.id });
  logHistory(W.year, 'حمله راهبردی ' + c.name + ' به ' + o.name);
  if (o.isPlayer) {
    alertPlayer({
      type: 'strategicHit', other: c.name, kindName: 'حمله راهبردی',
      reason: 'پدافند ' + faNum(blocked) + '٪ از حمله را خنثی کرد',
      detail: 'عقب‌گرد فناوری ' + faDec(techLoss, 1) + ' واحد، آسیب به ' + faNum(hitList.length) + ' ایالت، تلفات ' + faNum(Math.round(troopLoss)) + ' سرباز',
      states: hitList
    });
    pause('حمله راهبردی ' + c.name + ' به تأسیسات کشور شما', 'stateLost');
  }
  return { ok: true, msg: 'حمله راهبردی انجام شد؛ ' + faNum(blocked) + '٪ خنثی شد و فناوری هدف ' + faDec(techLoss, 1) + ' واحد عقب رفت.', report: report };
}
/* ساخت و استفاده هوش مصنوعی */
function aiStrategic(c) {
  if (c.isPlayer || c.tech < STRAT_TECH) return;
  const max = stratMaxLevel(c);
  const wantShield = Math.round(max * clamp(0.3 + (1 - c.bias.militarism) * 0.5, 0.2, 0.85));
  const wantStrike = Math.round(max * clamp(0.2 + c.bias.militarism * 0.6, 0.1, 0.85));
  const budget = c.treasury * 0.25;
  if ((c.shield || 0) < wantShield && budget > stratLevelCost(c, c.shield || 0) * 2) buildStrat(c, 'shield', 1);
  else if ((c.strike || 0) < wantStrike && budget > stratLevelCost(c, c.strike || 0) * 2) buildStrat(c, 'strike', 1);
  if ((c.strike || 0) > 0 && RNGX.chance(0.35)) {
    for (const oid in c.rel) {
      const o = W.countries[oid];
      if (!o || !o.alive || c.rel[oid].status !== 'war') continue;
      const chk = canStrategic(c, o);
      if (chk.ok && c.treasury > chk.cost * 2.5) { strategicStrike(c, o); break; }
    }
  }
}

/* ---------- ۲۱) چرخه مالی ۵ ساله ---------- */
function cycleStep() {
  W.cycle++;
  const y1 = Math.floor(W.year);
  const y0 = Math.max(W.startYear, y1 - BAL.CYCLE_YEARS);
  const wp = { food: 0, wood: 0, iron: 0, oil: 0, gold: 0 };
  const wd = { food: 0, wood: 0, iron: 0, oil: 0, gold: 0 };
  const alive = [];
  for (const cid in W.countries) if (W.countries[cid].alive) alive.push(W.countries[cid]);
  worldReserveScan();
  for (const c of alive) {
    const prod = resourceCycle(c);
    for (const k of RES_KEYS) { c.stock[k] += prod[k]; wp[k] += prod[k]; }
    c.lastProd = { food: r3(prod.food), wood: r3(prod.wood), iron: r3(prod.iron), oil: r3(prod.oil), gold: r3(prod.gold) };
    /* نفت مصرف داخلی به سوخت و انرژی تبدیل می‌شود */
    energyCycle(c);
    c.lastProd.energy = r3(c.lastEnergyMade || 0);
    const dem = resDemand(c);
    wd.food += dem.food;
    wd.wood += dem.wood;
    wd.iron += dem.iron;
    wd.oil += dem.oil > 0 ? dem.oil : c.owned.length * 0.5;
    wd.gold += (c.owned.length + c.ctrl.length * 0.5) * 1.2;
  }
  stockMoodCycle();
  marketCycle(wp, wd);
  contractsCycle();
  unSession();
  for (const c of alive) {
    tradeCycle(c);
    const rev = countryRevenue(c);
    /* درآمد بورس جهانی */
    const stockInc = stockCycle(c);
    rev.stock = r3(stockInc);
    rev.revenue += stockInc;
    const costs = countryCosts(c, rev);
    const net = rev.revenue - costs.total;
    c.treasury += net;
    /* کسری بودجه */
    if (c.treasury < 0) {
      c.deficitYears++;
      c.army.pay = clamp(100 + (c.treasury / Math.max(costs.army, 1)) * 60, 0, 100);
      c.army.morale = clamp(c.army.morale - 7, 5, 100);
      c.army.readiness = clamp(c.army.readiness - 6, 5, 100);
      c.stability = clamp(c.stability - 3, 0, 100);
      for (const sid of c.owned) W.states[sid - 1].unrest = clamp(W.states[sid - 1].unrest + 2.2, 0, 100);
      if (c.deficitYears > 2) {
        const cut = Math.floor(c.army.troops * 0.12);
        c.army.troops = Math.max(0, c.army.troops - cut);
        c.treasury += cut * 0.3 * (1 + c.tech / 10);
        if (c.isPlayer) news('کسری بودجه', 'بخشی از ارتش به دلیل ناتوانی در پرداخت حقوق منحل شد.', 'crisis', { c: c.id });
      }
    } else {
      c.deficitYears = 0;
      c.army.pay = clamp(c.army.pay + 12, 0, 100);
    }
    if (!c.isPlayer) aiBudget(c); else playerAutoTrade(c);
    /* سهم تعیین‌شده از درآمد به‌طور خودکار خرج می‌شود؛ باقی در خزانه می‌ماند */
    let pool = c.spendRatio * rev.revenue;
    pool = clamp(pool, 0, Math.max(0, c.treasury));
    c.treasury -= pool;
    const spend = investBudget(c, pool);
    spendArmyFund(c);
    trainingTick(c);
    redistributeGarrison(c);
    /* سربازگیری بیش از حد: کمبود نیروی کار */
    const mm = maxManpower(c);
    if (c.army.troops > mm) {
      const over = (c.army.troops - mm) / Math.max(mm, 1);
      for (const sid of c.owned) {
        const st = W.states[sid - 1];
        st.sat = clamp(st.sat - over * 4, 0, 100);
        st.industry = clamp(st.industry - over * 0.6, 0, 100);
      }
      c.army.troops = Math.max(0, c.army.troops - c.army.troops * clamp(over * 0.25, 0, 0.2));
    }
    c.warWeariness = clamp(c.warWeariness - (Object.values(c.rel).some(r => r.status === 'war') ? 0 : 6), 0, 100);
    c.stability = clamp(c.stability + (avgSat(c) - 50) * 0.06 + GOVS[c.gov].stab * 3 - c.unrestAvg * 0.05 - 1.2 + (c.owned.indexOf(c.capital) >= 0 ? 0.6 : 0), 0, 100);
    c.legitimacy = clamp(c.legitimacy * 0.985 + GOVS[c.gov].legitBase * 1.5 + (avgSat(c) - 50) * 0.03, 0, 100);
    c.corruption = clamp(c.corruption * 0.97 + GOVS[c.gov].corrupt * 3.2 - (c.education / 900) - ((c.lastBudget || c.budget).security || 0) * 4, 2, 92);
    c.lastCycle = {
      y0, y1, revenue: rev.revenue, gross: rev.gross, trade: rev.trade, tribute: rev.tribute, stock: rev.stock || 0,
      costs, net, treasury: c.treasury, pool, spend, tax: c.taxRate
    };
    if (c.isPlayer) {
      news('گزارش مالی ' + faNum(y0) + '–' + faNum(y1),
        'درآمد ' + faNum(rev.revenue) + '، هزینه ' + faNum(costs.total) + '، تغییر خزانه ' +
        (net >= 0 ? '+' : '−') + faNum(Math.abs(net)) + ' میلیون.', 'econ', { c: c.id });
    }
  }
  for (const c of alive) if (!c.owned.length) rebuildLists();
  checkEnd();
}

/* ---------- ۲۲) گام سالانه ---------- */
function yearStep() {
  const y = Math.floor(W.year);
  for (const st of W.states) {
    popYear(st);
    unrestYear(st);
    discoverCheck(st);
    if (st.status === 'tribal' && !st.owner) {
      st.defense = Math.max(st.defense, st.pop * 0.02);
      st.sat = clamp(st.sat + 0.2, 0, 100);
    }
  }
  agentsYear();
  rebuildLists();
  checkEnd();
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    updateRelations(c);
    factionsYear(c);
    revolutionYear(c);
    coupYear(c);
    civilianReturn(c);
    aiAskPlayer(c);
    if (!c.isPlayer) aiContracts(c);
    if (c.credibility == null) c.credibility = 70;
    c.credibility = clamp(c.credibility + 0.6, 0, 100);
    if ((y + c.aiOffset) % 2 === 0) aiDecide(c);
    if (c.isPlayer) playerAutoDiplo(c); else aiStrategic(c);
  }
  /* جنگ‌های بسیار طولانی و بی‌حاصل به صلح سفید می‌رسند */
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    for (const oid in c.rel) {
      const r = c.rel[oid];
      if (r.status !== 'war' || +oid < +cid) continue;
      const o = W.countries[oid];
      if (!o || !o.alive) continue;
      const since = r.warSince != null ? W.year - r.warSince : 0;
      if (since < 25) continue;
      const ops = W.ops.filter(x => (x.att === c.id && W.states[x.target - 1].controller === o.id) ||
        (x.att === o.id && W.states[x.target - 1].controller === c.id)).length;

    }
  }

}

/* ---------- ۲۳) تیک شبیه‌سازی ---------- */
function stepTick() {
  if (W.over) return false;
  const dt = 1 / BAL.TICKS_PER_YEAR;
  const before = Math.floor(W.year);
  W.year = Math.round((W.year + dt) * 1000) / 1000;
  const after = Math.floor(W.year);
  for (const op of W.ops.slice()) {
    if (!opTick(op)) {
      const i = W.ops.indexOf(op);
      if (i >= 0) W.ops.splice(i, 1);
    }
  }
  if (after > before) {
    yearStep();
    if (after % BAL.CYCLE_YEARS === 0) cycleStep();
  }
  return true;
}

/* ---------- ۲۴) اعتبارسنجی ---------- */
function validate() {
  const errs = [];
  if (W.states.length !== BAL.MAX_STATES) errs.push('تعداد ایالت‌ها ' + W.states.length + ' است.');
  const ids = new Set();
  for (const st of W.states) {
    if (ids.has(st.id)) errs.push('شناسه تکراری: ' + st.id);
    ids.add(st.id);
    if (st.owner && (!W.countries[st.owner] || !W.countries[st.owner].alive)) errs.push('مالک نامعتبر در ایالت ' + st.id);
    if (st.controller && (!W.countries[st.controller] || !W.countries[st.controller].alive)) errs.push('کنترل‌کننده نامعتبر در ایالت ' + st.id);
    if (!(st.pop >= 0) || !isFinite(st.pop)) errs.push('جمعیت نامعتبر در ایالت ' + st.id);
    for (const k of ['infra', 'industry', 'agri', 'health', 'security', 'trade', 'sat', 'unrest', 'devast']) {
      if (!isFinite(st[k])) errs.push('مقدار نامعتبر ' + k + ' در ایالت ' + st.id);
    }
    if (st.iron < 0 || st.oil < 0 || st.gold < 0) errs.push('ذخیره منفی در ایالت ' + st.id);
  }
  let owned = 0;
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    if (!isFinite(c.treasury)) errs.push('خزانه نامعتبر در ' + c.name);
    if (!isFinite(c.tech) || c.tech < 0 || c.tech > 100) errs.push('فناوری نامعتبر در ' + c.name);
    if (!isFinite(c.army.troops) || c.army.troops < 0) errs.push('ارتش نامعتبر در ' + c.name);
    if (!c.owned.length) errs.push('کشور بدون ایالت هنوز زنده است: ' + c.name);
    owned += c.owned.length;
    for (const sid of c.owned) if (W.states[sid - 1].owner !== c.id) errs.push('ناسازگاری مالکیت ایالت ' + sid);
  }
  if (!W.countries[W.player] || !W.countries[W.player].alive) {
    if (!W.over) errs.push('کشور بازیکن نامعتبر است.');
  }
  return errs;
}

/* ---------- ۲۵) ذخیره و بارگذاری ---------- */

    factory: r3(c.factory || 0), stockMin: BAL.STOCK_MIN,
    stockValue: r3(c.stockValue || 0), stockIncome: r3(c.stockIncome || 0), stockActive: !!c.stockActive,
    stockParts: stockParts(c),
    stockBoard: (function () {
      const b = [];
      for (const oid in W.countries) {
        const o = W.countries[oid];
        if (!o.alive || (o.factory || 0) < BAL.STOCK_MIN) continue;
        b.push({ name: o.name, color: o.color, factory: r3(o.factory), value: r3(o.stockValue || 0), me: o.id === c.id });
      }
      b.sort((x, y) => y.value - x.value);
      return b.slice(0, 14);
    })(),
    stockMood: r3(W.stockMood == null ? 1 : W.stockMood),
    tradeAccess: r3(c.tradeAccess == null ? 1 : c.tradeAccess),
    resTech: RES_TECH,
    revPressure: c.revPressure, coupRisk: c.coupRisk, credibility: c.credibility,
    vassals: c.vassals.map(v => W.countries[v] ? W.countries[v].name : '').filter(Boolean),
    era: eraOf(c.tech), mem: c.mem.slice(-12).map(m => ({ y: Math.floor(m.y), x: memText({ t: m.t, y: m.y, other: m.other }) })),
    ownedList: c.owned.slice(), ctrlList: c.ctrl.slice(),
    factions: c.factions.map(f => ({
      name: f.name, kind: f.kind, kindName: (FACTION_KINDS.find(x => x.k === f.kind) || {}).n || f.kind,
      strength: r3(f.strength), wantGov: GOVS[f.wantGov] ? GOVS[f.wantGov].name : '—',
      leader: W.agents[f.leader] ? W.agents[f.leader].name : '—', born: f.born
    })).sort((a, b) => b.strength - a.strength),
    contracts: (W.contracts || []).filter(k => k.seller === c.id || k.buyer === c.id).map(k => ({
      id: k.id, res: RES_NAMES[k.res], resKey: k.res, amount: k.amount, price: r3(k.price), left: k.left,
      role: k.seller === c.id ? 'فروشنده' : 'خریدار',
      other: (W.countries[k.seller === c.id ? k.buyer : k.seller] || { name: '—' }).name
    }))
  };
}
function worldRanking() {
  const list = [];
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    list.push(countrySummary(c));
  }
  list.sort((a, b) => (b.owned + b.power / 400 + b.tech / 8) - (a.owned + a.power / 400 + a.tech / 8));
  return list;
}

/* ---------- ۲۸) فرمان‌های بازیکن ---------- */
function command(cmd, a) {
  const pc = W.countries[W.player];
  if (!pc || !pc.alive) return { ok: false, why: 'کشور شما دیگر وجود ندارد.' };
  if (W.over && cmd !== 'validate') return { ok: false, why: 'بازی پایان یافته است.' };
  const st = a && a.state ? W.states[a.state - 1] : null;
  switch (cmd) {
    case 'tax':
      pc.taxRate = clamp(+a.value, 0, GOVS[pc.gov].taxMax);
      return { ok: true, value: pc.taxRate, max: GOVS[pc.gov].taxMax };
    case 'spendRatio': pc.spendRatio = clamp(+a.value, 0.1, 0.95); return { ok: true };
    case 'conscript': pc.conscript = clamp(+a.value, 0.005, 0.09); return { ok: true };
    case 'armyTarget': pc.armyTarget = clamp(+a.value, 0, 1); return { ok: true };
    case 'budget': {
      let tot = 0;
      for (const k of BUDGET_KEYS) tot += Math.max(0, +a.value[k] || 0);
      if (tot <= 0) return { ok: false, why: 'مقادیر بودجه نامعتبر است.' };
      /* مقادیر سهم مطلق از بودجه‌اند؛ اگر جمع از ۱۰۰٪ گذشت نرمال می‌شود */
      const div = tot > 1 ? tot : 1;
      for (const k of BUDGET_KEYS) pc.budget[k] = Math.max(0, +a.value[k] || 0) / div;
      return { ok: true, budget: pc.budget };
    }
    case 'recruit': {
      const n = Math.max(1, Math.floor(+a.n));
      const mm = maxManpower(pc);
      const cur = pc.army.troops + pendingTrain(pc);
      if (cur + n > mm) return { ok: false, why: 'سقف نیروی انسانی ' + faNum(Math.floor(mm)) + ' سرباز است.' };
      const base = BAL.RECRUIT_COST * (1 + pc.tech / 12);
      const extra = resourceNeedFor(pc, 'troops', n);
      const cost = n * base + extra;
      if (pc.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
      pc.treasury -= cost;
      pc.army.training.push({ n, remain: pc.tech > 35 ? 1 : 2 });
      return { ok: true, cost, msg: faNum(n) + ' سرباز به آموزش رفتند.' };
    }
    case 'buildNavy': {
      if (pc.tech < 18) return { ok: false, why: 'نیاز به فناوری ۱۸.' };
      if (!hasCoast(pc)) return { ok: false, why: 'ایالت ساحلی ندارید.' };
      const n = Math.max(1, Math.floor(+a.n || 1));
      const unit = 500 * (0.35 + pc.tech / 60);
      const extra = resourceNeedFor(pc, 'ship', n);
      const cost = unit * n + extra;
      if (pc.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
      pc.treasury -= cost; pc.army.navy += n;
      return { ok: true, cost, msg: faNum(n) + ' ناو ساخته شد.' };
    }
    case 'buildAir': {
      if (pc.tech < 60) return { ok: false, why: 'نیاز به فناوری ۶۰.' };
      const n = Math.max(1, Math.floor(+a.n || 1));
      const unit = 700 * (0.4 + pc.tech / 70);
      const extra = resourceNeedFor(pc, 'air', n);
      const cost = unit * n + extra;
      if (pc.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
      pc.treasury -= cost; pc.army.air += n;
      return { ok: true, cost, msg: faNum(n) + ' یگان هوایی ساخته شد.' };
    }
    case 'disband': {
      const n = Math.min(Math.floor(+a.n), Math.floor(pc.army.troops - committedOf(pc)));
      if (n < 1) return { ok: false, why: 'نیروی آزاد کافی ندارید.' };
      pc.army.troops -= n;
      pc.treasury += n * 0.25 * (1 + pc.tech / 12);
      return { ok: true, msg: faNum(n) + ' سرباز مرخص شدند.' };
    }
    case 'op': {
      if (!st) return { ok: false, why: 'ایالت نامعتبر.' };
      return startOp(pc, st, a.type, a.force);
    }
    case 'investState': {
      if (!st || st.controller !== pc.id) return { ok: false, why: 'این ایالت زیر کنترل شما نیست.' };
      const cost = Math.round(Math.max(60, avgStateRevenue(pc) * 1.2));
      if (pc.treasury < cost) return { ok: false, why: 'خزانه کافی نیست.' };
      pc.treasury -= cost;
      const k = 18 / Math.max(1, indexCost((st.infra + st.industry + st.trade) / 3));
      st.infra = clamp(st.infra + k, 0, 100);
      st.industry = clamp(st.industry + k * 0.8, 0, 100);
      st.trade = clamp(st.trade + k * 0.7, 0, 100);
      st.sat = clamp(st.sat + 2, 0, 100);
      return { ok: true, cost, msg: 'سرمایه‌گذاری در ایالت ' + faNum(st.id) + ' انجام شد.' };
    }
    case 'fortify': {
      if (!st || st.controller !== pc.id) return { ok: false, why: 'این ایالت زیر کنترل شما نیست.' };
      const cost = Math.round(Math.max(40, avgStateRevenue(pc) * 0.8));
      if (pc.treasury < cost) return { ok: false, why: 'خزانه کافی نیست.' };
      pc.treasury -= cost;
      st.fort = clamp(st.fort + 22 / Math.max(1, indexCost(st.fort)), 0, 100);
      st.security = clamp(st.security + 3, 0, 100);
      return { ok: true, cost, msg: 'استحکامات ایالت ' + faNum(st.id) + ' تقویت شد.' };
    }
    case 'garrison': {
      if (!st || st.controller !== pc.id) return { ok: false, why: 'این ایالت زیر کنترل شما نیست.' };
      const n = Math.max(0, Math.floor(+a.n));
      const free = pc.army.troops - committedOf(pc);
      if (n > free) return { ok: false, why: 'نیروی آزاد کافی ندارید.' };
      st.lock = n;
      redistributeGarrison(pc);
      return { ok: true, msg: 'پادگان ایالت ' + faNum(st.id) + ' تعیین شد.' };
    }
    case 'capital': {
      if (!st || st.owner !== pc.id) return { ok: false, why: 'این ایالت متعلق به شما نیست.' };
      const old = W.states[pc.capital - 1];
      if (old) old.capital = false;
      st.capital = true; pc.capital = st.id;
      news('پایتخت تازه', 'پایتخت ' + pc.name + ' به ایالت ' + faNum(st.id) + ' منتقل شد.', 'gov', { c: pc.id, s: st.id });
      return { ok: true, msg: 'پایتخت منتقل شد.' };
    }
    case 'independence': return grantIndependence(pc, st, false);
    case 'puppet': return grantIndependence(pc, st, true);
    case 'market': {
      const k = a.res, amt = Math.max(0, +a.amount);
      if (TRADE_KEYS.indexOf(k) < 0 || !amt) return { ok: false, why: 'درخواست نامعتبر.' };
      if (k === 'energy' && !hasFuelTech(pc)) return { ok: false, why: 'فناوری شما هنوز به سوخت و انرژی نرسیده است (نیاز به فناوری ' + faNum(BAL.ENERGY_TECH) + ').' };
      const price = k === 'energy' ? energyPrice() : W.market[k].price;
      const have = k === 'energy' ? (pc.energy || 0) : pc.stock[k];
      if (a.side === 'buy') {
        const cost = amt * price * 1.08;
        if (pc.treasury < cost) return { ok: false, why: 'خزانه کافی نیست (' + faNum(cost) + ' میلیون).' };
        if (k === 'energy' && have + amt > energyCap(pc)) return { ok: false, why: 'ظرفیت ذخیره سوخت ' + faNum(energyCap(pc)) + ' واحد است.' };
        pc.treasury -= cost;
        if (k === 'energy') pc.energy = have + amt; else pc.stock[k] += amt;
        return { ok: true, msg: 'خرید انجام شد.', cost };
      } else {
        if (have < amt) return { ok: false, why: 'ذخیره کافی ندارید.' };
        if (k === 'energy') pc.energy = have - amt; else pc.stock[k] -= amt;
        const inc = amt * price * 0.92; pc.treasury += inc;
        return { ok: true, msg: 'فروش انجام شد.', income: inc };
      }
    }
    case 'diplo': {
      const o = W.countries[a.target];
      if (!o || !o.alive) return { ok: false, why: 'کشور هدف معتبر نیست.' };
      const r = relOf(pc, o.id);
      const kind = a.kind;
      if (kind === 'war') {
        if (r.status === 'war') return { ok: false, why: 'هم‌اکنون در جنگ هستید.' };
        declareWar(pc, o, 'تصمیم حاکم');
        return { ok: true, msg: 'اعلان جنگ انجام شد.' };
      }
      if (kind === 'embargo' || kind === 'threat') { applyDiplo(pc, o, kind); return { ok: true, msg: 'انجام شد.' }; }
      if (kind === 'gift') {
        const amt = Math.max(1, Math.floor(+a.amount || 0));
        if (pc.treasury < amt) return { ok: false, why: 'خزانه کافی نیست.' };
        applyDiplo(pc, o, 'gift', { amount: amt });
        return { ok: true, msg: 'کمک ارسال شد.' };
      }
      if (kind === 'giftRes') {
        const amt = Math.max(1, Math.floor(+a.amount || 0));
        if ((pc.stock[a.res] || 0) < amt) return { ok: false, why: 'ذخیره کافی ندارید.' };
        applyDiplo(pc, o, 'giftRes', { res: a.res, amount: amt });
        return { ok: true, msg: 'منابع ارسال شد.' };
      }
      if (kind === 'peace') {
        if (r.status !== 'war') return { ok: false, why: 'در جنگ نیستید.' };
        if (aiAccepts(o, pc, 'peace')) { makePeace(pc, o); return { ok: true, msg: o.name + ' صلح را پذیرفت.' }; }
        return { ok: true, msg: o.name + ' پیشنهاد صلح را رد کرد.', rejected: true };
      }
      if (kind === 'askHelp') {
        if (aiAccepts(o, pc, 'callToArms')) {
          const enemies = Object.keys(pc.rel).filter(x => pc.rel[x].status === 'war');
          if (!enemies.length) return { ok: false, why: 'در جنگ نیستید.' };
          applyDiplo(pc, o, 'callToArms', { about: +enemies[0] });
          return { ok: true, msg: o.name + ' به جنگ پیوست.' };
        }
        return { ok: true, msg: o.name + ' درخواست شما را رد کرد.', rejected: true };
      }
      if (kind === 'askMoney') {
        const amt = Math.round(o.treasury * 0.12);
        if (aiAccepts(o, pc, 'gift') && relOf(o, pc.id).trust > 55 && amt > 0) {
          o.treasury -= amt; pc.treasury += amt;
          addCountryMemory(pc, { t: 'help', other: o.id, w: 0.6 });
          return { ok: true, msg: o.name + ' مبلغ ' + faNum(amt) + ' میلیون فرستاد.' };
        }
        return { ok: true, msg: o.name + ' درخواست کمک مالی را رد کرد.', rejected: true };
      }
      if (['alliance', 'nonAgg', 'defPact', 'trade', 'guarantee', 'friendship'].indexOf(kind) >= 0) {
        if (r.status === 'war') return { ok: false, why: 'در وضعیت جنگ ممکن نیست.' };
        if (kind === 'guarantee') { applyDiplo(pc, o, 'guarantee'); return { ok: true, msg: 'تضمین اعلام شد.' }; }
        if (aiAccepts(o, pc, kind)) { applyDiplo(pc, o, kind); return { ok: true, msg: o.name + ' پذیرفت.' }; }
        relOf(o, pc.id).trust = clamp(relOf(o, pc.id).trust - 2, 0, 100);
        return { ok: true, msg: o.name + ' نپذیرفت.', rejected: true };
      }
      return { ok: false, why: 'اقدام ناشناخته.' };
    }
    case 'contract': {
      const o = W.countries[a.target];
      if (!o || !o.alive) return { ok: false, why: 'کشور هدف معتبر نیست.' };
      const amount = Math.max(1, Math.floor(+a.amount || 0));
      const price = Math.max(0.05, +a.price || W.market[a.res].price);
      const cycles = clamp(Math.floor(+a.cycles || 6), 1, 40);
      if (RES_KEYS.indexOf(a.res) < 0) return { ok: false, why: 'منبع نامعتبر.' };
      if (a.side === 'sell' && pc.stock[a.res] < amount) return { ok: false, why: 'ذخیره کافی برای تعهد ندارید.' };
      const r = proposeContract(pc, o, a.res, amount, price, cycles, a.side === 'sell');
      if (r.rejected) return { ok: true, msg: r.msg, rejected: true };
      return r.ok ? { ok: true, msg: r.msg || 'قرارداد بسته شد.' } : r;
    }
    case 'cancelContract': {
      W.contracts = W.contracts || [];
      const i = W.contracts.findIndex(x => x.id === +a.id);
      if (i < 0) return { ok: false, why: 'قرارداد یافت نشد.' };
      const k = W.contracts[i];
      const other = W.countries[k.seller === pc.id ? k.buyer : k.seller];
      W.contracts.splice(i, 1);
      if (other) {
        relOf(other, pc.id).trust = clamp(relOf(other, pc.id).trust - 10, 0, 100);
        addCountryMemory(other, { t: 'betray', other: pc.id, w: 0.4 });
      }
      return { ok: true, msg: 'قرارداد لغو شد؛ اعتماد طرف مقابل کاهش یافت.' };
    }
    case 'respond': {
      const list = W.requests || [];
      const i = list.findIndex(x => x.id === a.id);
      if (i < 0) return { ok: false, why: 'درخواست یافت نشد.' };
      const req = list[i];
      list.splice(i, 1);
      const from = W.countries[req.from];
      if (!from || !from.alive) return { ok: true, msg: 'کشور درخواست‌کننده دیگر وجود ندارد.' };
      if (!a.accept) {
        const r = relOf(from, pc.id);
        r.trust = clamp(r.trust - (req.type === 'callToArms' ? 22 : 6), 0, 100);
        if (req.type === 'callToArms') {
          const rr = relOf(pc, from.id);
          rr.ally = false; rr.defPact = false;
          pc.credibility = clamp((pc.credibility != null ? pc.credibility : 70) - 20, 0, 100);
          return { ok: true, msg: 'شما تعهد دفاعی را رد کردید؛ اعتبار دیپلماتیک کاهش یافت.' };
        }
        return { ok: true, msg: 'درخواست رد شد.' };
      }
      if (req.type === 'peace') { makePeace(pc, from); return { ok: true, msg: 'صلح برقرار شد.' }; }
      if (req.type === 'contract') {
        const pl = req.payload;
        const seller = W.countries[pl.sellerId], buyer = seller.id === pc.id ? from : pc;
        if (seller.id === pc.id && pc.stock[pl.res] < pl.amount) return { ok: false, why: 'ذخیره کافی برای تعهد ندارید.' };
        signContract(seller, buyer, pl.res, pl.amount, pl.price, pl.cycles);
        return { ok: true, msg: 'قرارداد امضا شد.' };
      }
      if (req.type === 'askAid') {
        const pl = req.payload;
        if (pl.kind === 'money') {
          if (pc.treasury < pl.amount) return { ok: false, why: 'خزانه کافی ندارید.' };
          applyDiplo(pc, from, 'gift', { amount: pl.amount });
          return { ok: true, msg: 'کمک مالی ارسال شد.' };
        }
        if (pl.kind === 'food') {
          if ((pc.stock.food || 0) < pl.amount) return { ok: false, why: 'ذخیره غذای کافی ندارید.' };
          applyDiplo(pc, from, 'giftRes', { res: 'food', amount: pl.amount });
          return { ok: true, msg: 'غذا ارسال شد.' };
        }
        const tgt = pl.enemy && W.countries[pl.enemy] && W.countries[pl.enemy].alive ? W.countries[pl.enemy] : null;
        if (tgt) { declareWar(pc, tgt, 'کمک به ' + from.name); return { ok: true, msg: 'شما در برابر ' + tgt.name + ' وارد جنگ شدید.' }; }
        const enemies = Object.keys(from.rel).filter(x => from.rel[x].status === 'war');
        if (enemies.length) { declareWar(pc, W.countries[enemies[0]], 'کمک به ' + from.name); return { ok: true, msg: 'شما وارد جنگ شدید.' }; }
        return { ok: true, msg: 'جنگی برای پیوستن وجود ندارد.' };
      }
      if (req.type === 'callToArms') {
        const enemy = W.countries[req.about];
        if (enemy && enemy.alive) { declareWar(pc, enemy, 'تعهد دفاعی'); return { ok: true, msg: 'شما در برابر ' + enemy.name + ' وارد جنگ شدید.' }; }
        return { ok: true, msg: 'کشور هدف دیگر وجود ندارد.' };
      }
      applyDiplo(from, pc, req.type, req.payload);
      return { ok: true, msg: 'پذیرفته شد.' };
    }
    case 'autoPause': {
      W.settings.autoPause = Object.assign(W.settings.autoPause, a.value || {});
      return { ok: true, settings: W.settings };
    }
    case 'autoTrade': { pc.autoTrade = !!a.value; return { ok: true, autoTrade: pc.autoTrade }; }
    case 'autoDiplo': { pc.autoDiplo = !!a.value; return { ok: true, autoDiplo: pc.autoDiplo }; }
    case 'resPolicy': {
      pc.resPolicy = pc.resPolicy || defaultResPolicy();
      if (a.key && TRADE_KEYS.indexOf(a.key) >= 0) pc.resPolicy[a.key] = clamp(+a.value, 0, 1);
      else if (a.value && typeof a.value === 'object') {
        for (const k of TRADE_KEYS) if (a.value[k] != null) pc.resPolicy[k] = clamp(+a.value[k], 0, 1);
      }
      return { ok: true, resPolicy: pc.resPolicy };
    }
    case 'autoRes': {
      pc.autoRes = pc.autoRes || defaultAutoRes();
      if (a.key && TRADE_KEYS.indexOf(a.key) >= 0) pc.autoRes[a.key] = !!a.value;
      else if (a.value && typeof a.value === 'object') pc.autoRes = Object.assign({}, a.value);
      return { ok: true, autoRes: pc.autoRes };
    }
    case 'buyEnergy': {
      if (!hasFuelTech(pc)) return { ok: false, why: 'فناوری شما هنوز به سوخت و انرژی نرسیده است (نیاز به فناوری ' + faNum(BAL.ENERGY_TECH) + ').' };
      const amt = Math.max(1, Math.floor(+a.amount || 0));
      const room = energyCap(pc) - (pc.energy || 0);
      if (room <= 0) return { ok: false, why: 'ذخیره سوخت پر است.' };
      const n = Math.min(amt, Math.floor(room));
      const access = pc.tradeAccess == null ? 1 : pc.tradeAccess;
      if (access < 0.2) return { ok: false, why: 'با این وضع روابط، فروشنده‌ای برای سوخت پیدا نمی‌شود.' };
      const price = energyPrice() * (1.10 + 0.25 * (1 - clamp(access, 0, 1)));
      const cost = n * price;
      if (pc.treasury < cost) return { ok: false, why: 'هزینه ' + faNum(cost) + ' میلیون است؛ خزانه کافی نیست.' };
      pc.treasury -= cost;
      pc.energy = clamp((pc.energy || 0) + n, 0, energyCap(pc));
      return { ok: true, cost, msg: faNum(n) + ' واحد سوخت و انرژی خریداری شد.' };
    }
    case 'recruitTreasury': {
      const share = clamp(+a.share || 1, 0.05, 1);
      const money = Math.max(0, pc.treasury) * share;
      const mm = maxManpower(pc);
      const cur = pc.army.troops + pendingTrain(pc);
      const gap = Math.max(0, Math.floor(mm - cur));

        break;

function buildBottombar() {
  var h = '<div class="spd">';
  for (var i = 0; i < SPEEDS.length; i++) h += '<button class="sbtn" data-spd="' + SPEEDS[i] + '">' + SPEED_LABEL[SPEEDS[i]] + '</button>';
  h += '</div>';
  for (var m = 0; m < MENUS.length; m++) h += '<button class="mbtn" data-menu="' + MENUS[m].k + '"><span>' + MENUS[m].i + '</span>' + MENUS[m].n + '</button>';
  $('#bottombar').innerHTML = h;
  $$('#bottombar .sbtn').forEach(function (b) { b.onclick = function () { setSpeed(+b.getAttribute('data-spd')); }; });
  $$('#bottombar .mbtn').forEach(function (b) { b.onclick = function () { openModal(b.getAttribute('data-menu')); }; });
  markSpeed();
}
function markSpeed() {
  $$('#bottombar .sbtn').forEach(function (b) {
    b.classList.toggle('on', Math.abs(+b.getAttribute('data-spd') - G.speed) < 1e-6);
  });
}
function setSpeed(v) {
  G.speed = v;
  if (v > 0) G.prevSpeed = v;
  markSpeed();
  if (v > 0) $('#pausebadge').classList.add('hidden');
}
function showPause(reason) {
  setSpeed(0);
  var b = $('#pausebadge');
  b.innerHTML = '<b>توقف خودکار</b><div style="margin-top:4px">' + esc(reason) + '</div>' +
    '<button class="btn sm" id="pbok" style="margin-top:8px">ادامه</button>';
  b.classList.remove('hidden');
  $('#pbok').onclick = function () { b.classList.add('hidden'); setSpeed(G.prevSpeed || 1); };
}

function bindStateActions(d) {

/* ---------- اخبار و درخواست‌ها ---------- */
function newsIsInternal(item) {
  var p = G.snap.player;
  if (!p) return false;
  if (item.c === p.id || item.c2 === p.id) return true;
  if (item.s && G.snap.ctrls[item.s - 1] === p.id) return true;
  return false;
}
function renderNews(force) {
  var n = G.snap.news, h = '';
  var mode = G.newsTab || 'all';
  var shown = 0;
  for (var i = n.length - 1; i >= 0; i--) {
    var it = n[i];
    var inside = newsIsInternal(it);
    if (mode === 'in' && !inside) continue;
    if (mode === 'out' && inside) continue;
    shown++;
    h += '<div class="newsitem ' + it.k + '"><span class="y">سال ' + fa(it.y) + '</span> ' +
      (inside ? '<span class="tag" style="font-size:9.5px;padding:0 4px">داخلی</span> ' : '') +
      '— <b>' + esc(it.t) + '</b>: ' + esc(it.x) + '</div>';
  }
  if (!shown) h = '<div style="color:var(--dim2);padding:6px">خبری در این دسته نیست.</div>';
  var box = $('#newslist');
  if (!box) return;
  if (force || box._n !== n.length || box._mode !== mode || box._last !== (n.length ? n[n.length - 1].x : '')) {
    box.innerHTML = h;
    box._n = n.length;
    box._mode = mode;
    box._last = n.length ? n[n.length - 1].x : '';
  }
}
function buildNewsTabs() {
  var box = $('#newsbox');
  if (!box || box._built) return;
  box._built = true;
  box.innerHTML = '<div id="newstabs">' +
    '<button class="ntab on" data-nt="all">همه</button>' +
    '<button class="ntab" data-nt="in">اخبار داخلی</button>' +
    '<button class="ntab" data-nt="out">اخبار خارجی</button></div>' +
    '<div id="newslist"></div>';
  $$('#newstabs .ntab').forEach(function (b) {
    b.onclick = function () {
      G.newsTab = b.getAttribute('data-nt');
      $$('#newstabs .ntab').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderNews(true);
    };
  });
}
/* جعبه اخبار برای موبایل داخل پنجره باز می‌شود */
function newsBoxHome() {
  var box = $('#newsbox');
  if (box && box.parentNode && box.parentNode.id === 'mbody') {
    box.classList.remove('inmodal');
    $('#sidepanel').appendChild(box);
  }
}
function renderNewsModal() {
  if (!G.modalKind) return;
  $('#mtitle').textContent = 'اخبار جهان';
  var body = $('#mbody');
  buildNewsTabs();
  var box = $('#newsbox');
  if (!box) return;
  if (box.parentNode !== body) {
    body.innerHTML = '';
    box.classList.add('inmodal');
    body.appendChild(box);
  }
  renderNews(true);
}
function renderRequests() {
  var r = G.snap.requests || [], h = '';
  var names = { alliance: 'پیشنهاد اتحاد', nonAgg: 'پیمان عدم تعرض', defPact: 'پیمان دفاعی', trade: 'پیمان تجاری', friendship: 'پیشنهاد دوستی', guarantee: 'تضمین استقلال', peace: 'پیشنهاد صلح', callToArms: 'درخواست ورود به جنگ', gift: 'کمک', contract: 'پیشنهاد قرارداد بلندمدت', askAid: 'درخواست کمک' };
  var aidN = { money: 'کمک مالی', food: 'کمک غذایی', join: 'ورود به جنگ' };
  for (var i = Math.max(0, r.length - 3); i < r.length; i++) {
    var c = G.snap.countries[r[i].from];
    var extra = '';
    var pl = r[i].payload;
    if (r[i].type === 'contract' && pl) extra = '<div style="font-size:11px;color:var(--dim)">' + fa(pl.amount) + ' واحد ' + (G.meta.resNames[pl.res] || pl.res) + ' × ' + fa(pl.cycles) + ' چرخه، قیمت ' + faf(pl.price, 2) + '</div>';
    if (r[i].type === 'askAid' && pl) {
      extra = '<div style="font-size:11px;color:var(--dim)">' + (aidN[pl.kind] || '') + (pl.amount ? ' — ' + fa(pl.amount) : '') +
        (pl.enemyName ? ' در برابر <b>' + esc(pl.enemyName) + '</b>' : '') + '</div>';
    }
    if (r[i].type === 'callToArms') {
      var en = G.snap.countries[r[i].about];
      extra = '<div style="font-size:11px;color:var(--dim)">ورود به جنگ در برابر <b>' + esc(en ? en.name : '—') + '</b></div>';
    }
    h += '<div class="req"><b>' + esc(names[r[i].type] || r[i].type) + '</b> از ' + esc(c ? c.name : '—') + extra +
      '<div class="btns"><button class="btn sm" data-req="' + r[i].id + '" data-acc="1">پذیرش</button>' +
      '<button class="btn sm" data-req="' + r[i].id + '" data-acc="0">رد</button></div></div>';
  }
  var bar = $('#reqbar');
  if (bar._h !== h) { bar.innerHTML = h; bar._h = h; }
  $$('#reqbar [data-req]').forEach(function (b) {
    b.onclick = function () {
      var id = +b.getAttribute('data-req');
      var accept = b.getAttribute('data-acc') === '1';
      var req = null;
      for (var q = 0; q < r.length; q++) if (r[q].id === id) req = r[q];
      var enemyId = req ? (req.about || (req.payload && req.payload.enemy)) : 0;
      if (accept && enemyId) confirmWar(id, req, enemyId);
      else cmd('respond', { id: id, accept: accept });
    };
  });
}
/* تأیید ورود به جنگ با نام کشور هدف و هشدار درباره دوستان */
function confirmWar(reqId, req, enemyId) {
  var from = G.snap.countries[req.from];
  var enemy = G.snap.countries[enemyId];
  ask('country', 0, function (d) {
    var rel = null;
    if (d && d.rels) for (var i = 0; i < d.rels.length; i++) if (d.rels[i].id === enemyId) rel = d.rels[i];
    var warn = '';
    if (rel && (rel.ally || rel.friend || rel.status === 'friendly')) {
      warn = '<div class="card" style="border-color:var(--bad);background:#fdeeea;margin-top:8px">' +
        '<b style="color:var(--bad)">هشدار</b><div style="font-size:12.5px">' +
        esc(enemy ? enemy.name : '') + ' هم‌اکنون ' +
        (rel.ally ? 'متحد شماست' : (rel.friend ? 'با شما پیمان دوستی دارد' : 'رابطه دوستانه با شما دارد')) +
        '. ورود به جنگ با او این پیمان را از بین می‌برد، اعتماد جهانی شما را کم می‌کند و درآمد کشورتان را پایین می‌آورد.</div></div>';
    }
    confirmDialog('ورود به جنگ در برابر ' + (enemy ? enemy.name : '—'),
      '<div style="font-size:13px;line-height:2">' +
      '<b>' + esc(from ? from.name : '—') + '</b> از شما می‌خواهد در برابر <b>' + esc(enemy ? enemy.name : '—') + '</b> وارد جنگ شوید.' +
      (rel ? '<br>وضعیت کنونی شما با ' + esc(enemy ? enemy.name : '') + ': ' + statusTag(rel.status) +
        ' — اعتماد ' + fa(rel.trust) + '، ایالت‌ها ' + fa(rel.owned) + '، توان برآوردی ' + fa(rel.power) : '') +
      '</div>' + warn,
      function () { cmd('respond', { id: reqId, accept: true }); });
  });
}

/* ---------- پنجره‌های اصلی ---------- */
function closeModal() { newsBoxHome(); $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; G.modalKind = null; }
function openModal(kind, tab) {
  newsBoxHome();
  G.modalKind = kind; G.modalTab = tab || null;
  var m = $('#modal');
  m.classList.remove('hidden');
  m.innerHTML = '<div class="mbox"><div class="mhead"><h3 id="mtitle">…</h3>' +
    '<button class="btn sm" id="mclose">بستن</button></div>' +
    '<div class="mbody" id="mbody">در حال بارگذاری…</div></div>';
  $('#mclose').onclick = closeModal;
  m.onclick = function (e) { if (e.target === m) closeModal(); };
  refreshModal();
}
function confirmDialog(title, html, onOk, afterRender) {
  var m = $('#modal');
  newsBoxHome();
  var prev = m.innerHTML, prevKind = G.modalKind;
  m.classList.remove('hidden');
  m.innerHTML = '<div class="mbox" style="max-width:460px"><div class="mhead"><h3>' + esc(title) + '</h3></div>' +
    '<div class="mbody">' + html + '<div class="row" style="margin-top:12px">' +
    '<button class="btn primary" id="dOk">تأیید</button><button class="btn" id="dNo">انصراف</button></div></div></div>';
  function back() {
    if (prevKind) { m.innerHTML = prev; G.modalKind = prevKind; $('#mclose').onclick = closeModal; refreshModal(); }
    else closeModal();
  }
  $('#dOk').onclick = function () { onOk(); back(); };
  $('#dNo').onclick = back;
  if (afterRender) afterRender();
}
function refreshModal() {
  var k = G.modalKind;
  if (!k) return;
  if (k === 'news') { renderNewsModal(); return; }
  if (k === 'res') { ask('country', 0, function (d) { if (d) renderRes(d); }); return; }
  if (k === 'stock') { ask('country', 0, function (d) { if (d) renderStock(d); }); return; }
  if (k === 'help') { renderHelp(); return; }
  if (k === 'save') { renderSave(); return; }
  if (k === 'history') { ask('history', 0, renderHistory); return; }
  if (k === 'un') { ask('un', 0, renderUN); return; }
  if (k === 'people') { ask('people', 0, renderPeople); return; }
  if (k === 'diplo') { ask('country', 0, function (d) { ask('ranking', 0, function (r) { renderDiplo(d, r); }); }); return; }
  ask('country', 0, function (d) {
    if (!d) return;
    if (k === 'country') renderCountry(d);
    else if (k === 'economy') renderEconomy(d);
    else if (k === 'invest') renderInvest(d);
    else if (k === 'army') renderArmy(d);
    else if (k === 'tech') renderTech(d);
    else if (k === 'trade') renderTrade(d);
    else if (k === 'gov') renderGov(d);
  });
}
function setModal(title, html) {
  if (!G.modalKind) return;
  $('#mtitle').textContent = title;
  $('#mbody').innerHTML = html;
}
function traitList(tr, n) {
  var s = tr.slice().sort(function (a, b) { return b.v - a.v; });
  var h = '<div class="grid2">';
  for (var i = 0; i < Math.min(n || 12, s.length); i++) {
    h += '<div class="kv"><span>' + esc(s[i].n) + '</span><b>' + fa(s[i].v * 100) + '</b></div>';
  }
  return h + '</div>';
}
function agentCard(a, title) {
  if (!a) return '<div class="card"><h4>' + title + '</h4><div style="color:var(--dim)">—</div></div>';
  var h = '<div class="card"><h4>' + title + '</h4>';
  h += kv('نام', esc(a.name));
  h += kv('سن', fa(a.age) + ' سال' + (a.alive ? '' : ' (درگذشته)'));
  h += kv('تبار', esc(a.eth));
  h += kv('اعتبار', pc(a.prestige * 100));
  h += kv('خانواده', 'همسر: ' + esc(a.spouse) + ' — فرزندان: ' + fa(a.children));
  h += '<div style="margin-top:6px;color:var(--accent);font-size:12px">برجسته‌ترین ویژگی‌ها</div>';
  h += traitList(a.traits, 12);
  if (a.mem && a.mem.length) {
    h += '<div style="margin-top:6px;color:var(--accent);font-size:12px">خاطرات</div>';
    for (var i = a.mem.length - 1; i >= 0; i--) h += '<div style="font-size:12px;color:var(--dim)">سال ' + fa(a.mem[i].y) + ' — ' + esc(a.mem[i].x) + '</div>';
  }
  if (a.heritage && a.heritage.grudge.length) {
    h += '<div style="margin-top:6px;color:var(--accent);font-size:12px">میراث و کینه‌های نسلی</div>';
    for (var j = 0; j < a.heritage.grudge.length; j++) h += '<div style="font-size:12px;color:var(--dim)">' + esc(a.heritage.grudge[j].c) + ': ' + pc(a.heritage.grudge[j].v * 100) + '</div>';
  }
  return h + '</div>';
}

  }

  var RN = { general: 'ژنرال', minister: 'وزیر', scientist: 'دانشمند', party: 'رهبر حزب', noble: 'اشراف', rebel: 'رهبر مخالف', royal: 'خاندان', consort: 'همسر', chief: 'رئیس قبیله', leader: 'رهبر' };

function renderInvest(d) {
  var keys = G.meta.budgetKeys, names = G.meta.budgetNames, desc = G.meta.budgetDesc || {};
  var auto = d.autoBudget || {}, gov = d.govBudget || {}, eff = d.effBudget || {};
  var h = '<div class="card"><h4>تقسیم بودجه</h4>' +
