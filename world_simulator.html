<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>فرمانروای جهان — World Dynasty</title>
<style>
:root{
  --bg:#0d1219; --panel:#141c28; --panel2:#1b2536; --panel3:#222e42;
  --line:#2b3950; --txt:#e9eff8; --dim:#95a4bd; --dim2:#6b7b96;
  --accent:#e8b339; --accent2:#6aa9ff; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --sea:#0a1b2b; --sea2:#102a42;
  --r:10px; --sh:0 6px 20px rgba(0,0,0,.45);
  --topH:46px; --botH:52px; --sideW:340px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Vazirmatn","IRANSans",Tahoma,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.7; overflow:hidden; overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#31405a;border-radius:8px}
.hidden{display:none !important}

/* ---------- صفحه شروع ---------- */
#start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 50% 30%,#16263c,#0a1017 70%);padding:16px;overflow:auto}
.startbox{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;box-shadow:var(--sh)}
.brand{text-align:center;margin-bottom:14px}
.brand h1{margin:0;font-size:26px;letter-spacing:.5px}
.brand p{margin:6px 0 0;color:var(--dim);font-size:13px}
.field{margin:12px 0}
.field label{display:block;margin-bottom:6px;color:var(--dim);font-size:13px}
.field input{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r);outline:none}
.field input:focus{border-color:var(--accent2)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;
  background:var(--panel3);border:1px solid var(--line);border-radius:var(--r);color:var(--txt);
  transition:.15s;font-weight:600}
.btn:hover{background:#2b3a54}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#e8b339,#c98f1e);color:#221a06;border-color:#a87615}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{color:var(--dim2);font-size:12px;margin-top:4px}

/* ---------- چیدمان اصلی ---------- */
#game{position:fixed;inset:0;display:grid;
  grid-template-rows:var(--topH) 1fr var(--botH);
  grid-template-columns:1fr var(--sideW);
  grid-template-areas:"top top" "map side" "bot bot";}
#topbar{grid-area:top;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.stat{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px 9px;border-left:1px solid var(--line);min-width:64px;line-height:1.25}
.stat:last-child{border-left:0}
.stat b{font-size:13px;font-weight:700}
.stat span{font-size:10px;color:var(--dim2)}
.stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)}

#mapwrap{grid-area:map;position:relative;background:var(--sea);overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.grabbing{cursor:grabbing}
.stpath{stroke:#0b1420;stroke-width:.7;vector-effect:non-scaling-stroke}
#borders path{fill:none;stroke:#05090f;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#coast path{fill:none;stroke:#3d6f9b;stroke-width:1.1;vector-effect:non-scaling-stroke;opacity:.75}
#sel{fill:none;stroke:#fff;stroke-width:2.6;vector-effect:non-scaling-stroke;pointer-events:none}
.clabel{fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000a;stroke-width:3px;
  font-weight:700;pointer-events:none;opacity:.92}
.opmark{pointer-events:none}

#mapctl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
#modes{position:absolute;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:60%;z-index:5}
.chip{padding:4px 9px;border-radius:20px;background:#121b28cc;border:1px solid var(--line);
  font-size:12px;color:var(--dim);backdrop-filter:blur(4px)}
.chip.on{background:var(--accent);color:#22190a;border-color:var(--accent);font-weight:700}
.zbtn{width:34px;height:34px;border-radius:8px;background:#121b28cc;border:1px solid var(--line);
  font-size:17px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#legend{position:absolute;bottom:8px;right:8px;background:#0f1724dd;border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:11px;max-width:46%;z-index:4;line-height:1.6}
.lgrow{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid #0006}

#sidepanel{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#sidehead{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#sidehead h3{margin:0;font-size:15px;flex:1}
#sidebody{flex:1;overflow-y:auto;padding:10px 12px}
#newsbox{border-top:1px solid var(--line);height:118px;overflow-y:auto;padding:6px 10px;font-size:12px;
  background:var(--panel2)}
.newsitem{padding:3px 0;border-bottom:1px dashed #24314790;color:var(--dim)}
.newsitem b{color:var(--txt);font-weight:600}
.newsitem.war b{color:#ff9d9d} .newsitem.gov b{color:#c3a6ff} .newsitem.diplo b{color:#8fd3ff}
.newsitem.econ b{color:#8ff0b0} .newsitem.crisis b{color:#ffbb6b} .newsitem.discovery b{color:#ffe08a}
.newsitem .y{color:var(--dim2);font-size:11px}

#bottombar{grid-area:bot;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--panel);
  border-top:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#bottombar::-webkit-scrollbar{display:none}
.spd{display:flex;gap:3px;align-items:center;padding-left:6px;border-left:1px solid var(--line);margin-left:4px}
.sbtn{min-width:34px;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.sbtn.on{background:var(--accent);color:#22190a;border-color:var(--accent)}
.mbtn{height:32px;padding:0 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.mbtn:hover{background:var(--panel3)}

/* ---------- کارت‌ها و جدول‌ها ---------- */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:9px}
.card h4{margin:0 0 7px;font-size:13px;color:var(--accent);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:12.5px}
.kv span{color:var(--dim)}
.kv b{font-weight:600}
.bar{height:6px;background:#0c141f;border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent2);border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:12px;font-size:11px;background:var(--panel3);
  border:1px solid var(--line);color:var(--dim)}
.tag.war{background:#3b1616;color:#ff9d9d;border-color:#5c2222}
.tag.ally{background:#123024;color:#7ff0b0;border-color:#1d5138}
.tag.friendly{background:#12283a;color:#8fd3ff;border-color:#1d4463}
.tag.tense{background:#3a2f12;color:#ffd98f;border-color:#63501d}
.tag.hostile{background:#37201f;color:#ffb0a0;border-color:#5c322c}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:4px 6px;text-align:right;border-bottom:1px solid #22304660}
th{color:var(--dim);font-weight:600;font-size:11.5px}
tr:hover td{background:#1d283a66}
.scroll{max-height:52vh;overflow-y:auto}

/* ---------- پنجره‌ها ---------- */
#modal{position:fixed;inset:0;z-index:50;background:#05080cd0;display:flex;align-items:center;
  justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mbox{width:min(760px,100%);max-height:90vh;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;display:flex;flex-direction:column;box-shadow:var(--sh);overflow:hidden}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px;flex:1}
.mbody{padding:12px 14px;overflow-y:auto}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}
.tab{padding:5px 11px;border-radius:8px 8px 0 0;background:var(--panel2);border:1px solid var(--line);
  border-bottom:0;font-size:12.5px;color:var(--dim)}
.tab.on{background:var(--panel3);color:var(--txt);font-weight:600}
.slider{display:flex;align-items:center;gap:8px;margin:5px 0}
.slider label{width:92px;font-size:12.5px;color:var(--dim)}
.slider input[type=range]{flex:1;accent-color:var(--accent)}
.slider b{width:52px;text-align:left;font-size:12.5px}
input[type=number],input[type=text],select{padding:6px 9px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;outline:none;width:100%}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.act{display:flex;flex-direction:column;align-items:flex-start;padding:7px 9px;border-radius:9px;
  background:var(--panel3);border:1px solid var(--line);text-align:right;width:100%}
.act b{font-size:12.5px}
.act small{color:var(--dim2);font-size:11px;line-height:1.45}
.act:disabled{opacity:.55}
.act.danger{background:#2c1a1a;border-color:#4a2626}
#toast{position:fixed;bottom:64px;right:50%;transform:translateX(50%);z-index:70;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#1b2738f2;border:1px solid var(--line);border-radius:10px;padding:8px 14px;
  font-size:13px;box-shadow:var(--sh);animation:tin .25s ease}
.toast.bad{border-color:#6b2b2b;background:#2b1a1af2}
.toast.good{border-color:#2b6b45;background:#182b21f2}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#pausebadge{position:absolute;top:50%;right:50%;transform:translate(50%,-50%);z-index:6;
  background:#101a28ee;border:1px solid var(--accent);border-radius:12px;padding:10px 16px;
  text-align:center;max-width:82%;box-shadow:var(--sh)}
#pausebadge b{color:var(--accent)}
#end{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;
  background:#05080ce8;padding:16px}
.endbox{width:min(520px,100%);background:var(--panel);border:2px solid var(--accent);border-radius:16px;
  padding:24px;text-align:center;box-shadow:var(--sh)}
.endbox h2{margin:0 0 8px;font-size:26px}
.endbox.lose{border-color:#a33}
#reqbar{position:absolute;bottom:8px;left:8px;z-index:5;display:flex;flex-direction:column;gap:6px;max-width:62%}
.req{background:#121b28ee;border:1px solid var(--accent);border-radius:10px;padding:7px 10px;font-size:12px}
.req .btns{display:flex;gap:6px;margin-top:5px}

/* ---------- موبایل ---------- */
@media (max-width:860px){
  :root{--topH:42px;--botH:50px}
  #game{grid-template-columns:1fr;grid-template-rows:var(--topH) 1fr var(--botH);
    grid-template-areas:"top" "map" "bot"}
  #sidepanel{position:fixed;left:0;right:0;bottom:var(--botH);top:auto;z-index:40;height:54vh;max-height:420px;
    border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    transform:translateY(140%);transition:transform .22s ease;box-shadow:var(--sh)}
  #sidepanel.open{transform:translateY(0)}
  #bottombar{z-index:41}
  #legend{bottom:6px;left:6px;right:auto}
  #reqbar{left:6px;bottom:96px;max-width:76%}
  #newsbox{height:90px}
  #legend{max-width:60%;font-size:10.5px}
  .mbox{max-height:92vh}
  .slider label{width:76px;font-size:12px}
  #modes{max-width:72%}
}
@media (max-width:420px){
  .stat{min-width:56px;padding:2px 6px}
  .stat b{font-size:12px}
}
</style>
</head>
<body>
<!-- ===================== صفحه ایجاد جهان ===================== -->
<div id="start">
  <div class="startbox">
    <div class="brand">
      <h1>فرمانروای جهان</h1>
      <p>شبیه‌ساز تاریخ، سیاست، اقتصاد و جنگ — کاملاً آفلاین</p>
    </div>
    <div id="startform">
      <h3 style="margin:6px 0 2px;font-size:16px">ایجاد جهان جدید</h3>
      <div class="field">
        <label>نام پادشاه (نخستین فرمانروای شما)</label>
        <input id="inKing" type="text" maxlength="24" placeholder="مثلاً کاوه">
      </div>
      <div class="field">
        <label>نام کشور</label>
        <div class="row">
          <input id="inCountry" type="text" maxlength="24">
          <button class="btn sm" id="btnName" style="flex:0 0 auto">نام دیگر</button>
        </div>
      </div>
      <div class="field">
        <label>Seed (کلید ساخت جهان)</label>
        <div class="row">
          <input id="inSeed" type="text" maxlength="24">
          <button class="btn sm" id="btnSeed" style="flex:0 0 auto">تصادفی</button>
        </div>
        <div class="hint">Seed شکل جهان، منابع، جایگاه کشورها، جمعیت، رهبران و ژنتیک اولیه را تعیین می‌کند.</div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="btnStart">آغاز بازی</button>
        <button class="btn" id="btnLoadFile">بارگذاری ذخیره</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="btnContinue">ادامه آخرین بازی</button>
        <button class="btn ghost" id="btnHelpStart">راهنما</button>
      </div>
      <div class="hint" id="engmode" style="text-align:center;margin-top:10px"></div>
    </div>
  </div>
</div>

<!-- ===================== بازی ===================== -->
<div id="game" class="hidden">
  <div id="topbar"></div>

  <div id="mapwrap">
    <svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="8" height="8" fill="none"/>
          <line x1="0" y1="0" x2="0" y2="8" stroke="#fff" stroke-width="3" stroke-opacity=".42"/>
        </pattern>
        <radialGradient id="seagrad" cx="50%" cy="50%" r="62%">
          <stop offset="0%" stop-color="#123047"/><stop offset="100%" stop-color="#08131f"/>
        </radialGradient>
      </defs>
      <rect id="seabg" x="-400" y="-400" width="2400" height="1800" fill="url(#seagrad)"/>
      <g id="vp">
        <g id="states"></g>
        <g id="colonies"></g>
        <g id="coast"></g>
        <g id="borders"></g>
        <path id="sel" d=""></path>
        <g id="marks"></g>
        <g id="labels"></g>
      </g>
    </svg>
    <div id="mapctl">
      <button class="zbtn" id="zin">+</button>
      <button class="zbtn" id="zout">−</button>
      <button class="zbtn" id="zfit" title="نمای کامل">⤢</button>
      <button class="zbtn" id="zhome" title="کشور من">⌂</button>
    </div>
    <div id="modes"></div>
    <div id="legend"></div>
    <div id="reqbar"></div>
    <div id="pausebadge" class="hidden"></div>
  </div>

  <div id="sidepanel">
    <div id="sidehead">
      <h3 id="sidetitle">ایالت</h3>
      <button class="btn sm" id="sideclose">بستن</button>
    </div>
    <div id="sidebody"></div>
    <div id="newsbox"></div>
  </div>

  <div id="bottombar"></div>
</div>

<div id="modal" class="hidden"></div>
<div id="toast"></div>
<div id="end" class="hidden"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<script>
/* موتور شبیه‌سازی: در Web Worker یا نخ اصلی اجرا می‌شود */
function KV_ENGINE_MAIN(){
/*ENGINE-START*/
/* ============================================================
   موتور شبیه‌سازی — World Dynasty / فرمانروای جهان
   کاملاً آفلاین، بدون وابستگی خارجی
   ============================================================ */

/* ---------- ۱) مولد اعداد تصادفی قابل‌ذخیره (xoshiro128**) ---------- */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function rotl32(x, k) { return ((x << k) | (x >>> (32 - k))) >>> 0; }

function RNG(seed) {
  if (Array.isArray(seed)) { this.s = seed.slice(0, 4); }
  else {
    const h = xmur3(String(seed));
    this.s = [h(), h(), h(), h()];
    if ((this.s[0] | this.s[1] | this.s[2] | this.s[3]) === 0) this.s = [1, 2, 3, 4];
  }
}
RNG.prototype.u32 = function () {
  const s = this.s;
  const result = Math.imul(rotl32(Math.imul(s[1], 5) >>> 0, 7), 9) >>> 0;
  const t = (s[1] << 9) >>> 0;
  s[2] = (s[2] ^ s[0]) >>> 0;
  s[3] = (s[3] ^ s[1]) >>> 0;
  s[1] = (s[1] ^ s[2]) >>> 0;
  s[0] = (s[0] ^ s[3]) >>> 0;
  s[2] = (s[2] ^ t) >>> 0;
  s[3] = rotl32(s[3], 11);
  return result;
};
RNG.prototype.f = function () { return this.u32() / 4294967296; };
RNG.prototype.range = function (a, b) { return a + (b - a) * this.f(); };
RNG.prototype.int = function (a, b) { return a + Math.floor(this.f() * (b - a + 1)); };
RNG.prototype.pick = function (arr) { return arr[Math.floor(this.f() * arr.length)]; };
RNG.prototype.chance = function (p) { return this.f() < p; };
RNG.prototype.gauss = function () {
  let u = 0, v = 0;
  while (u === 0) u = this.f();
  while (v === 0) v = this.f();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v);
};
RNG.prototype.shuffle = function (arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(this.f() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
};
RNG.prototype.save = function () { return this.s.slice(); };

/* ---------- ۲) ابزارهای عددی ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function safe(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : (d || 0); }
function r3(v) { return Math.round(v * 1000) / 1000; }

/* ---------- ۳) جدول‌های داده ---------- */
const TRAITS = [
  'شجاعت', 'اضطراب', 'جاه‌طلبی', 'ریسک‌پذیری', 'پرخاشگری', 'آرامش',
  'وفاداری', 'همدلی', 'حسادت', 'اعتماد', 'انتقام‌جویی', 'اجتماعی بودن',
  'هوش', 'حافظه', 'خلاقیت', 'کنجکاوی', 'قدرت یادگیری', 'سخت‌کوشی',

/* ---------- ۵) نویز و ساخت هندسه نقشه ---------- */
function makeNoise(rng) {
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng.f() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  function val(ix, iy) { return (perm[(perm[ix & 255] + (iy & 255)) & 255] / 255) * 2 - 1; }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise2(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = smooth(x - x0), fy = smooth(y - y0);
    const v00 = val(x0, y0), v10 = val(x0 + 1, y0), v01 = val(x0, y0 + 1), v11 = val(x0 + 1, y0 + 1);
    return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
  }
  return function fbm(x, y, oct, scale) {
    let amp = 1, f = scale || 1, sum = 0, norm = 0;
    for (let i = 0; i < (oct || 3); i++) { sum += noise2(x * f, y * f) * amp; norm += amp; amp *= 0.5; f *= 2.05; }
    return sum / norm;
  };
}

const MAPW = 1600, MAPH = 1000, COLS = 48, ROWS = 30;

function buildGeo(seedStr) {
  const rng = new RNG(seedStr + '|geo');
  const cw = MAPW / COLS, ch = MAPH / ROWS;
  const nz = makeNoise(rng);
  const nz2 = makeNoise(rng);
  const nz3 = makeNoise(rng);

  /* گوشه‌های شبکه با جابه‌جایی تصادفی برای مرزهای طبیعی */
  const cor = [];
  for (let r = 0; r <= ROWS; r++) {
    cor.push([]);
    for (let c = 0; c <= COLS; c++) {
      const jx = (rng.f() - 0.5) * cw * 0.62 + nz(c * 0.35, r * 0.35, 2, 1) * cw * 0.25;
      const jy = (rng.f() - 0.5) * ch * 0.62 + nz2(c * 0.35, r * 0.35, 2, 1) * ch * 0.25;
      cor[r].push([r3(c * cw + jx), r3(r * ch + jy)]);
    }
  }
  /* نقاط میانی هر یال (مشترک بین دو ایالت ⇒ بدون شکاف) */
  function mids(a, b, k) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const o1 = (rng.f() - 0.5) * len * 0.30, o2 = (rng.f() - 0.5) * len * 0.30;
    return [
      [r3(a[0] + dx / 3 + nx * o1), r3(a[1] + dy / 3 + ny * o1)],
      [r3(a[0] + dx * 2 / 3 + nx * o2), r3(a[1] + dy * 2 / 3 + ny * o2)]
    ];
  }
  const hMid = [], vMid = [];
  for (let r = 0; r <= ROWS; r++) {
    hMid.push([]); vMid.push([]);
    for (let c = 0; c <= COLS; c++) {
      hMid[r].push(c < COLS ? mids(cor[r][c], cor[r][c + 1]) : null);
      vMid[r].push(r < ROWS ? mids(cor[r][c], cor[r + 1][c]) : null);
    }
  }

  /* میدان خشکی: اقیانوس بزرگ در مرکز، خشکی‌ها پیرامون آن */
  const pot = new Float32Array(COLS * ROWS);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = (c + 0.5) / COLS, y = (r + 0.5) / ROWS;
      const dx = (x - 0.5) / 0.5, dy = (y - 0.5) / 0.5;
      const d = Math.sqrt(dx * dx + dy * dy * 1.05);
      const ring = 1 - Math.abs(d - 0.70) / 0.34;
      const n = nz(c * 0.16, r * 0.16, 4, 1) * 0.95 + nz2(c * 0.42, r * 0.42, 2, 1) * 0.35;
      pot[r * COLS + c] = ring + n * 0.75;
    }
  }
  const idx = (c, r) => r * COLS + c;
  const inGrid = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;

  /* رشد چند قاره از هسته‌های پراکنده */
  const land = new Uint8Array(COLS * ROWS);
  const TARGET = BAL.MAX_STATES;
  const nCont = rng.int(3, 5);
  const seeds = [];
  for (let i = 0; i < nCont; i++) {
    const ang = (i / nCont) * 6.283 + rng.range(-0.5, 0.5);
    const rad = rng.range(0.60, 0.80);
    const c = clamp(Math.round((0.5 + Math.cos(ang) * rad * 0.5) * COLS), 1, COLS - 2);
    const r = clamp(Math.round((0.5 + Math.sin(ang) * rad * 0.5) * ROWS), 1, ROWS - 2);
    seeds.push({ c, r });
  }
  const frontier = seeds.map(s => { land[idx(s.c, s.r)] = 1; return [[s.c, s.r]]; });
  let count = seeds.length;
  const islandBudget = rng.int(6, 16);
  const mainTarget = TARGET - islandBudget;
  let guard = 0;
  while (count < mainTarget && guard++ < 60000) {
    let ci = Math.floor(rng.f() * frontier.length);
    let tries = 0;
    while (frontier[ci].length === 0 && tries++ < frontier.length * 2) ci = (ci + 1) % frontier.length;
    const fr = frontier[ci];
    if (!fr.length) break;
    /* انتخاب بهترین همسایه با کمی تصادف */
    let best = null, bestV = -1e9, bestFi = -1;
    const sampleN = Math.min(fr.length, 14);
    for (let s = 0; s < sampleN; s++) {
      const fi = Math.floor(rng.f() * fr.length);
      const [fc, frr] = fr[fi];
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (const [dc, dr] of dirs) {
        const nc = fc + dc, nr = frr + dr;
        if (!inGrid(nc, nr) || land[idx(nc, nr)]) continue;
        if (nc === 0 || nr === 0 || nc === COLS - 1 || nr === ROWS - 1) continue;
        const v = pot[idx(nc, nr)] + rng.f() * 0.55;
        if (v > bestV) { bestV = v; best = [nc, nr]; bestFi = fi; }
      }
    }
    if (!best) { fr.length = Math.max(0, fr.length - 3); continue; }
    if (bestV < -0.55) { if (fr.length > 2) fr.splice(bestFi, 1); continue; }
    land[idx(best[0], best[1])] = 1; count++;
    fr.push(best);
    if (fr.length > 220) fr.splice(0, 60);
  }
  /* جزایر پراکنده در اقیانوس */
  let tries = 0;
  while (count < TARGET && tries++ < 40000) {
    const c = rng.int(2, COLS - 3), r = rng.int(2, ROWS - 3);
    if (land[idx(c, r)]) continue;
    let touch = false;
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
      if (inGrid(c + dc, r + dr) && land[idx(c + dc, r + dr)]) touch = true;
    }
    if (touch) continue;
    const size = Math.min(rng.int(1, 4), TARGET - count);
    const q = [[c, r]];
    land[idx(c, r)] = 1; count++;
    let placed = 1;
    while (placed < size && q.length) {
      const [qc, qr] = q[Math.floor(rng.f() * q.length)];
      const d = rng.pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
      const nc = qc + d[0], nr = qr + d[1];
      if (!inGrid(nc, nr) || land[idx(nc, nr)] || nc < 2 || nr < 2 || nc > COLS - 3 || nr > ROWS - 3) { if (q.length > 3) q.pop(); continue; }
      land[idx(nc, nr)] = 1; count++; placed++; q.push([nc, nr]);
    }
  }
  /* تضمین دقیق ۳۰۰ ایالت */
  while (count < TARGET) {
    let bestI = -1, bestV = -1e9;
    for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
      const i = idx(c, r); if (land[i]) continue;
      let adj = 0;
      if (land[idx(c + 1, r)]) adj++; if (land[idx(c - 1, r)]) adj++;
      if (land[idx(c, r + 1)]) adj++; if (land[idx(c, r - 1)]) adj++;
      const v = pot[i] + adj * 0.4;
      if (v > bestV) { bestV = v; bestI = i; }
    }
    if (bestI < 0) break;
    land[bestI] = 1; count++;
  }

  /* ساخت فهرست ایالت‌ها با شماره ثابت */
  const cells = [], cellAt = new Int16Array(COLS * ROWS).fill(-1);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!land[idx(c, r)]) continue;
    cellAt[idx(c, r)] = cells.length;
    cells.push({ c, r });
  }
  const N = cells.length;

  /* چندضلعی هر ایالت و مرکز آن */
  const polys = [], centers = [];
  for (let i = 0; i < N; i++) {
    const { c, r } = cells[i];
    const pts = [];
    pts.push(cor[r][c]); pts.push(hMid[r][c][0]); pts.push(hMid[r][c][1]);
    pts.push(cor[r][c + 1]); pts.push(vMid[r][c + 1][0]); pts.push(vMid[r][c + 1][1]);
    pts.push(cor[r + 1][c + 1]); pts.push(hMid[r + 1][c][1]); pts.push(hMid[r + 1][c][0]);
    pts.push(cor[r + 1][c]); pts.push(vMid[r][c][1]); pts.push(vMid[r][c][0]);
    polys.push(pts);
    let sx = 0, sy = 0;
    for (const p of pts) { sx += p[0]; sy += p[1]; }
    centers.push([r3(sx / pts.length), r3(sy / pts.length)]);
  }

  /* همسایگی چهارجهته (مرز قطری مرز محسوب نمی‌شود) */
  const neighbors = [], coastal = new Uint8Array(N), edges = [];
  for (let i = 0; i < N; i++) {
    const { c, r } = cells[i];
    const nb = [];
    let sea = 0;
    const sides = [
      { dc: 1, dr: 0, ep: [cor[r][c + 1], vMid[r][c + 1][0], vMid[r][c + 1][1], cor[r + 1][c + 1]] },
      { dc: -1, dr: 0, ep: [cor[r][c], vMid[r][c][0], vMid[r][c][1], cor[r + 1][c]] },
      { dc: 0, dr: 1, ep: [cor[r + 1][c], hMid[r + 1][c][0], hMid[r + 1][c][1], cor[r + 1][c + 1]] },
      { dc: 0, dr: -1, ep: [cor[r][c], hMid[r][c][0], hMid[r][c][1], cor[r][c + 1]] }
    ];
    for (const s of sides) {
      const nc = c + s.dc, nr = r + s.dr;
      const j = inGrid(nc, nr) ? cellAt[idx(nc, nr)] : -1;
      if (j >= 0) { nb.push(j); if (i < j) edges.push({ a: i, b: j, p: s.ep }); }
      else { sea++; edges.push({ a: i, b: -1, p: s.ep }); }
    }
    neighbors.push(nb);
    coastal[i] = sea > 0 ? 1 : 0;
  }

  /* زمین و اقلیم */
  const terrain = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const { c, r } = cells[i];
    const elev = nz(c * 0.22 + 11, r * 0.22 + 7, 3, 1);
    const moist = nz3(c * 0.19 + 40, r * 0.19 + 90, 3, 1);
    const lat = Math.abs((r + 0.5) / ROWS - 0.5) * 2;
    let t;
    if (elev > 0.42) t = 2;
    else if (elev > 0.20) t = 1;
    else if (lat > 0.80) t = 5;
    else if (moist < -0.34) t = 4;
    else if (moist > 0.34) t = 3;
    else if (moist > 0.15 && elev < -0.25) t = 6;
    else t = 0;
    if (coastal[i] && t === 0 && moist > -0.1) t = 7;
    terrain[i] = t;
  }

  /* اجزای متصل خشکی (برای قاره‌ها و پشتیبانی) */
  const comp = new Int16Array(N).fill(-1);
  let ncomp = 0;
  for (let i = 0; i < N; i++) {
    if (comp[i] >= 0) continue;
    const q = [i]; comp[i] = ncomp;
    while (q.length) {
      const v = q.pop();
      for (const nb of neighbors[v]) if (comp[nb] < 0) { comp[nb] = ncomp; q.push(nb); }
    }
    ncomp++;
  }
  return { cells, polys, centers, neighbors, coastal, terrain, comp, ncomp, edges, N, cellAt, COLS, ROWS, W: MAPW, H: MAPH };
}

/* ---------- ۶) ساخت جهان ---------- */
let GEO = null;   /* هندسه نقشه — از Seed بازتولید می‌شود و در Save ذخیره نمی‌شود */
let W = null;     /* وضعیت جهان */
let RNGX = null;  /* مولد تصادفی اصلی شبیه‌سازی */

function newAgent(opts) {
  const id = W.nextAgent++;
  const sex = opts.sex || (RNGX.chance(0.5) ? 'm' : 'f');
  const traits = [];
  if (opts.father && opts.mother) {
    const f = W.agents[opts.father], m = W.agents[opts.mother];
    for (let i = 0; i < TRAITS.length; i++) {
      if (GENETIC.indexOf(i) >= 0 && f && m) {
        const base = 0.45 * f.tr[i] + 0.45 * m.tr[i] + 0.10 * RNGX.f();
        traits.push(clamp(base + RNGX.gauss() * 0.09, 0.02, 0.99));
      } else {
        /* اکتسابی: تأثیر خانواده کم، جامعه و شرایط زیاد */
        const fam = f && m ? (f.tr[i] + m.tr[i]) / 2 : 0.5;
        traits.push(clamp(0.30 * fam + 0.70 * RNGX.f(), 0.02, 0.99));
      }
    }
  } else {
    for (let i = 0; i < TRAITS.length; i++) traits.push(clamp(0.5 + RNGX.gauss() * 0.2, 0.02, 0.99));
  }
  const a = {
    id, name: opts.name || (sex === 'm' ? RNGX.pick(MALE_NAMES) : RNGX.pick(FEMALE_NAMES)),
    sur: opts.sur || RNGX.pick(DYNASTY_NAMES),
    sex, eth: opts.eth != null ? opts.eth : RNGX.int(0, 7),
    birth: opts.birth != null ? opts.birth : W.year,
    alive: true, death: null,
    tr: traits,
    mem: [], her: opts.her ? JSON.parse(JSON.stringify(opts.her)) : { grudge: {}, famine: 0, respect: {} },
    country: opts.country || 0, role: opts.role || 'noble',
    father: opts.father || 0, mother: opts.mother || 0, spouse: 0, children: [],
    prestige: opts.prestige != null ? opts.prestige : clamp(0.3 + RNGX.f() * 0.3, 0, 1),
    loyal: clamp(0.45 + RNGX.f() * 0.4, 0, 1),
    lifespan: 0
  };
  a.lifespan = lifeSpanFor(a, opts.country ? W.countries[opts.country] : null);
  W.agents[id] = a;
  return a;
}
function lifeSpanFor(a, c) {
  const health = c ? c.healthIdx : 12;
  const base = 50 + (a.tr[TI.endurance] * 22);
  const med = (health / 100) * 26;
  return clamp(base + med + RNGX.gauss() * 7, 18, 105);
}
function addMemory(a, m) {
  if (!a) return;
  a.mem.push(m);
  if (a.mem.length > 20) {
    a.mem.sort((x, y) => (y.w * (1 - (W.year - y.y) / 400)) - (x.w * (1 - (W.year - x.y) / 400)));
    a.mem.length = 20;
  }
}
function memText(m) {
  const other = m.other && W.countries[m.other] ? W.countries[m.other].name : 'بیگانگان';
  switch (m.t) {
    case 'warDeath': return 'پدرم در جنگ با کشور ' + other + ' کشته شد.';
    case 'famine': return 'قحطی بزرگ سال ' + Math.floor(m.y) + ' را به یاد دارم.';
    case 'war': return 'جنگ با ' + other + ' در سال ' + Math.floor(m.y) + '.';
    case 'lostState': return 'از دست رفتن ایالت در برابر ' + other + '.';
    case 'wonState': return 'فتح ایالت از ' + other + '.';
    case 'betray': return 'خیانت ' + other + ' را فراموش نمی‌کنم.';
    case 'help': return 'کمک ' + other + ' در روز سخت.';
    case 'coup': return 'کودتای سال ' + Math.floor(m.y) + '.';
    case 'revolt': return 'انقلاب سال ' + Math.floor(m.y) + '.';
    case 'crown': return 'در سال ' + Math.floor(m.y) + ' به قدرت رسیدم.';
    case 'parentDeath': return 'مرگ پدر/مادرم در سال ' + Math.floor(m.y) + '.';
    default: return 'خاطره‌ای از سال ' + Math.floor(m.y);
  }
}

function baseCountry(id, name, color, capital) {
  const gov = RNGX.chance(0.45) ? 0 : (RNGX.chance(0.6) ? 1 : 2);
  const c = {
    id, name, color, alive: true, founded: W.year, gov,
    leader: 0, heir: 0, capital,
    treasury: 0, taxRate: 0.22, spendRatio: 0.55,
    budget: {}, tech: 0, knowledge: 0, education: 0, healthIdx: 0,
    stability: 55, legitimacy: 65, corruption: 0, warWeariness: 0,
    army: { troops: 0, morale: 70, readiness: 70, navy: 0, air: 0, training: [], pay: 100 },
    stock: { food: 0, wood: 0, iron: 0, oil: 0, gold: 0 },
    bias: { militarism: 0.5, trade: 0.5, science: 0.5, welfare: 0.5, expansion: 0.5, diplomacy: 0.5, authoritarian: 0.5, risk: 0.5 },
    goals: [], rel: {}, mem: [],
    revPressure: 0, coupRisk: 0, unrestAvg: 0,
    owned: [], ctrl: [], vassalOf: 0, vassals: [],
    lastCycle: null, aiOffset: id % 3, isPlayer: false,
    intel: {}, factions: [], deficitYears: 0, dynasty: ''
  };
  const bs = BUDGET_KEYS.length;
  BUDGET_KEYS.forEach(k => { c.budget[k] = 1 / bs; });
  return c;
}

function distributeResources(rng) {
  const N = GEO.N;
  const nzA = makeNoise(rng), nzB = makeNoise(rng), nzC = makeNoise(rng);
  for (let i = 0; i < N; i++) {
    const st = W.states[i];
    const { c, r } = GEO.cells[i];
    const t = TERRAINS[GEO.terrain[i]];
    const nx = (c + 0.5) / COLS, ny = (r + 0.5) / ROWS;
    /* گرایش‌های منطقه‌ای — نه مطلق */
    const north = clamp(1 - ny * 2.0, 0, 1);
    const south = clamp((ny - 0.5) * 2.0, 0, 1);
    const east = clamp((nx - 0.5) * 2.0, 0, 1);
    const west = clamp(1 - nx * 2.0, 0, 1);
    const nA = nzA(c * 0.3, r * 0.3, 3, 1), nB = nzB(c * 0.3 + 20, r * 0.3 + 20, 3, 1), nC = nzC(c * 0.3 + 60, r * 0.3 + 60, 3, 1);
    st.foodBase = clamp(t.food * (0.75 + 0.45 * (west * 0.5 + north * 0.35) + nA * 0.35), 0.15, 2.2);
    st.forest = clamp(100 * (t.wood * (0.55 + 0.45 * north + 0.3 * west) + nB * 0.25), 0, 100);
    st.forestCap = st.forest;
    const ironP = clamp(0.25 + east * 0.55 + nC * 0.5 + (GEO.terrain[i] === 2 ? 0.35 : 0) + (GEO.terrain[i] === 1 ? 0.15 : 0), 0, 1.6);
    const oilP = clamp(0.15 + south * 0.60 + nA * 0.55 + (GEO.terrain[i] === 4 ? 0.30 : 0) + (GEO.coastal[i] ? 0.10 : 0), 0, 1.6);
    const goldP = clamp(0.10 + (south * 0.35 + east * 0.35) + nB * 0.55 + (GEO.terrain[i] === 2 ? 0.25 : 0), 0, 1.5);
    st.iron = rng.chance(clamp(ironP * 0.55, 0.03, 0.85)) ? Math.round(rng.range(180, 1500) * ironP) : 0;
    st.oil = rng.chance(clamp(oilP * 0.40, 0.02, 0.6)) ? Math.round(rng.range(300, 2600) * oilP) : 0;
    st.gold = rng.chance(clamp(goldP * 0.30, 0.02, 0.45)) ? Math.round(rng.range(60, 520) * goldP) : 0;
    st.ironMax = st.iron; st.oilMax = st.oil; st.goldMax = st.gold;
    st.known = { food: true, wood: true, gold: st.gold > 0 ? rng.chance(0.6) : true, iron: false, oil: false };
  }
}

function rebalanceResources(rng) {
  /* جلوگیری از Seed ناعادلانه: هیچ کشور اولیه‌ای سهم غیرمنصفانه از یک منبع حیاتی نداشته باشد */
  const keys = ['iron', 'oil', 'gold'];
  for (let pass = 0; pass < 6; pass++) {
    let fixed = false;
    for (const k of keys) {
      let total = 0;
      const byC = {};
      for (const st of W.states) {
        total += st[k];
        if (st.owner) byC[st.owner] = (byC[st.owner] || 0) + st[k];
      }
      if (total <= 0) continue;
      for (const cid in byC) {
        const share = byC[cid] / total;
        if (share > 0.24) {
          /* انتقال بخشی از ذخایر به ایالت‌های بدون مالک */
          const mine = W.states.filter(s => s.owner === +cid && s[k] > 0).sort((a, b) => b[k] - a[k]);
          const free = W.states.filter(s => !s.owner);
          let move = (share - 0.20) * total;
          for (const st of mine) {
            if (move <= 0) break;
            const take = Math.min(st[k] * 0.6, move);
            st[k] -= take; st[k + 'Max'] = st[k];
            const tgt = free[Math.floor(rng.f() * free.length)];
            if (tgt) { tgt[k] += take; tgt[k + 'Max'] = tgt[k]; }
            move -= take; fixed = true;
          }
        }
      }
    }
    if (!fixed) break;
  }
}

function generateWorld(opts) {
  const seed = String(opts.seed || 'kavosh');
  GEO = buildGeo(seed);
  RNGX = new RNG(seed + '|sim');
  const rng = RNGX;
  W = {
    version: 3, seed, year: 1, startYear: 1, tick: 0, cycle: 0,
    states: [], countries: {}, agents: {}, nextAgent: 1, nextCountry: 1,
    player: 0, ops: [], news: [], history: [], market: {}, trades: [],
    over: null, pendingPause: null, namesUsed: [], stats: { wars: 0, revs: 0, coups: 0, born: 0 },
    settings: { autoPause: { leaderDeath: true, govChange: true, warDec: true, stateLost: true, revolution: true, coup: true, diploReq: true, peace: true, newCountry: true } }
  };
  /* ایالت‌ها */
  const ethNoise = makeNoise(rng);
  for (let i = 0; i < GEO.N; i++) {
    const t = GEO.terrain[i];
    const { c, r } = GEO.cells[i];
    const ang = Math.atan2((r + 0.5) / ROWS - 0.5, (c + 0.5) / COLS - 0.5);
    let eth = Math.floor(((ang + Math.PI) / (2 * Math.PI)) * 8 + ethNoise(c * 0.25, r * 0.25, 2, 1) * 1.4);
    eth = ((eth % 8) + 8) % 8;
    const st = {
      id: i + 1, owner: 0, controller: 0, status: 'free',
      pop: 0, eth, minority: (eth + rng.int(1, 7)) % 8, minShare: rng.range(0.02, 0.3),
      infra: 0, industry: 0, agri: 0, health: 0, security: 0, trade: 0,
      sat: 55, unrest: 0, devast: 0, integ: 1, defense: 0, fort: 0,
      foodBase: 1, forest: 30, forestCap: 30, iron: 0, oil: 0, gold: 0,
      ironMax: 0, oilMax: 0, goldMax: 0, known: null,
      hist: [], lastInc: 0, lastOut: 0, rebel: 0, siege: 0, capital: false
    };
    st.pop = Math.round(clamp(TERRAINS[t].food * rng.range(45, 150), 15, 260));
    st.infra = rng.range(3, 10); st.industry = rng.range(1, 6); st.agri = rng.range(5, 16);
    st.health = rng.range(3, 10); st.security = rng.range(5, 20); st.trade = rng.range(2, 10);
    W.states.push(st);
  }
  distributeResources(rng);

  /* انتخاب هسته ۲۰ کشور با فاصله مناسب */
  const compSize = {};
  for (let i = 0; i < GEO.N; i++) compSize[GEO.comp[i]] = (compSize[GEO.comp[i]] || 0) + 1;
  const cand = [];
  for (let i = 0; i < GEO.N; i++) if (compSize[GEO.comp[i]] >= 6) cand.push(i);
  const seeds = [];
  const first = cand[Math.floor(rng.f() * cand.length)];
  seeds.push(first);
  while (seeds.length < 20) {
    let best = -1, bestD = -1;
    for (const i of cand) {
      if (seeds.indexOf(i) >= 0) continue;
      let dmin = 1e9;
      for (const s of seeds) {
        const dx = GEO.centers[i][0] - GEO.centers[s][0], dy = GEO.centers[i][1] - GEO.centers[s][1];
        dmin = Math.min(dmin, dx * dx + dy * dy);
      }
      const v = dmin * (0.85 + rng.f() * 0.3);
      if (v > bestD) { bestD = v; best = i; }
    }
    if (best < 0) break;
    seeds.push(best);
  }

  /* ساخت کشورها */
  const names = rng.shuffle(COUNTRY_NAMES.slice());
  const totalStart = rng.int(120, 180);
  const per = Math.max(3, Math.floor(totalStart / seeds.length));
  for (let k = 0; k < seeds.length; k++) {
    const id = W.nextCountry++;
    const hue = Math.round((k * 137.508 + rng.range(-8, 8)) % 360);
    const col = 'hsl(' + hue + ',' + Math.round(rng.range(52, 74)) + '%,' + Math.round(rng.range(44, 60)) + '%)';
    const name = names[k] || ('کشور ' + id);
    W.namesUsed.push(name);
    const c = baseCountry(id, name, col, seeds[k] + 1);
    c.tech = rng.range(0.5, 3.5);
    c.knowledge = rng.range(2, 8);
    c.education = rng.range(3, 10);
    c.healthIdx = rng.range(5, 14);
    c.stability = rng.range(48, 66);
    c.legitimacy = rng.range(55, 78);
    c.corruption = clamp(GOVS[c.gov].corrupt * 100 + rng.range(-8, 8), 5, 80);
    c.treasury = rng.range(900, 1500);
    c.taxRate = rng.range(0.16, 0.28);
    c.bias = {
      militarism: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95), trade: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95),
      science: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95), welfare: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95),
      expansion: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95), diplomacy: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95),
      authoritarian: clamp(GOVS[c.gov].central + rng.gauss() * 0.15, 0.05, 0.95), risk: clamp(0.5 + rng.gauss() * 0.2, 0.05, 0.95)
    };
    c.aiOffset = k % 2;
    W.countries[id] = c;
  }
  /* گسترش اولیه قلمرو */
  const claimed = new Set();
  const fronts = {};
  for (const cid in W.countries) {
    const c = W.countries[cid];
    const s0 = c.capital - 1;
    W.states[s0].owner = c.id; W.states[s0].controller = c.id; W.states[s0].status = 'owned'; W.states[s0].capital = true;
    c.owned.push(c.capital); claimed.add(s0);
    fronts[cid] = [s0];
  }
  let assigned = seeds.length;
  let guard2 = 0;
  while (assigned < totalStart && guard2++ < 5000) {
    let any = false;
    for (const cid in W.countries) {
      const c = W.countries[cid];
      if (c.owned.length >= per + (rng.chance(0.4) ? 2 : 0)) continue;
      if (assigned >= totalStart) break;
      const fr = fronts[cid];
      let placed = false;
      rng.shuffle(fr);
      for (let a = 0; a < fr.length && !placed; a++) {
        const nbs = GEO.neighbors[fr[a]].slice();
        rng.shuffle(nbs);
        for (const nb of nbs) {
          if (claimed.has(nb)) continue;
          const st = W.states[nb];
          st.owner = c.id; st.controller = c.id; st.status = 'owned';
          c.owned.push(st.id); claimed.add(nb); fr.push(nb);
          assigned++; placed = true; any = true; break;
        }
      }
    }
    if (!any) break;
  }
  /* ایالت‌های آزاد و قبیله‌ای */
  for (const st of W.states) {
    if (st.owner) continue;
    st.status = rng.chance(0.55) ? 'tribal' : 'free';
    if (st.status === 'tribal') {
      st.defense = Math.round(st.pop * rng.range(0.02, 0.05));
      st.sat = rng.range(50, 70);
    } else {
      st.pop = Math.round(st.pop * rng.range(0.35, 0.8));
      st.defense = Math.round(st.pop * rng.range(0.005, 0.02));
    }
  }
  rebalanceResources(rng);
  /* ارتش اولیه هر کشور متناسب با جمعیت */
  for (const cid in W.countries) {
    const c = W.countries[cid];
    c.army.troops = Math.max(6, Math.round(countryPop(c) * rng.range(0.018, 0.032)));
    c.army.morale = rng.range(62, 80);
    c.army.readiness = rng.range(60, 80);
    c.conscript = rng.range(0.02, 0.05);
    c.armyTarget = 0.9;
    redistributeGarrison(c);
  }

  /* رهبران، وارثان و شخصیت‌های مهم */
  for (const cid in W.countries) {
    const c = W.countries[cid];
    const capEth = W.states[c.capital - 1].eth;
    c.dynasty = rng.pick(DYNASTY_NAMES);
    const king = newAgent({ sex: 'm', eth: capEth, country: c.id, role: 'leader', sur: c.dynasty, birth: W.year - rng.int(26, 46), prestige: rng.range(0.5, 0.85) });
    c.leader = king.id;
    addMemory(king, { y: W.year, t: 'crown', w: 0.9, other: 0 });
    const queen = newAgent({ sex: 'f', eth: capEth, country: c.id, role: 'consort', birth: W.year - rng.int(22, 40) });
    king.spouse = queen.id; queen.spouse = king.id;
    const nkids = rng.int(1, 4);
    for (let i = 0; i < nkids; i++) {
      const kid = newAgent({ eth: capEth, country: c.id, role: 'royal', sur: c.dynasty, father: king.id, mother: queen.id, birth: W.year - rng.int(0, 22) });
      king.children.push(kid.id); queen.children.push(kid.id);
    }
    pickHeir(c);
    const roles = ['general', 'general', 'minister', 'minister', 'scientist', 'party', 'noble', 'noble', 'rebel'];
    for (let i = 0; i < 38; i++) {
      newAgent({ eth: rng.chance(0.75) ? capEth : rng.int(0, 7), country: c.id, role: rng.pick(roles), birth: W.year - rng.int(20, 55) });
    }
  }
  /* رهبران قبایل مستقل */
  const tribes = W.states.filter(s => s.status === 'tribal');
  for (let i = 0; i < Math.min(tribes.length, 90); i++) {
    newAgent({ eth: tribes[i].eth, country: 0, role: 'chief', birth: W.year - rng.int(22, 50) });
  }

  /* بازار جهانی */
  RES_KEYS.forEach(k => {
    W.market[k] = { price: k === 'gold' ? 6.0 : (k === 'oil' ? 2.2 : (k === 'iron' ? 1.8 : (k === 'wood' ? 0.9 : 1.0))), supply: 0, demand: 0, hist: [] };
  });

  /* روابط اولیه */
  const ids = Object.keys(W.countries).map(Number);
  for (const a of ids) for (const b of ids) {
    if (a === b) continue;
    W.countries[a].rel[b] = {
      trust: rng.range(35, 60), fear: rng.range(10, 30), tension: rng.range(5, 25),
      trade: 0, grudge: 0, status: 'neutral', truce: 0, ally: false, defPact: false, nonAgg: false, guarantee: false, embargo: false
    };
  }
  /* کشور بازیکن */
  const playerId = ids[Math.floor(rng.f() * ids.length)];
  const pc = W.countries[playerId];
  W.player = playerId;
  pc.isPlayer = true;
  if (opts.countryName) { pc.name = String(opts.countryName).slice(0, 24); }
  if (opts.kingName) {
    const lead = W.agents[pc.leader];
    lead.name = String(opts.kingName).slice(0, 24);
    lead.sur = '';
  }
  assignGoals();
  logHistory(W.year, 'جهان با ' + faNum(ids.length) + ' کشور و ' + faNum(GEO.N) + ' ایالت آغاز شد.');
  news('آغاز', 'تمدن‌های نخستین در کرانه اقیانوس بزرگ شکل گرفتند.', 'world');
  return W;
}

function pickHeir(c) {
  const lead = W.agents[c.leader];
  if (!lead) { c.heir = 0; return; }
  const g = GOVS[c.gov];
  if (g.succ === 'heir' || g.succ === 'tribe') {
    const kids = lead.children.map(i => W.agents[i]).filter(a => a && a.alive);
    kids.sort((a, b) => a.birth - b.birth);
    const male = kids.filter(k => k.sex === 'm');
    const pick = male.length ? male[0] : (kids.length ? kids[0] : null);
    c.heir = pick ? pick.id : 0;
  } else {
    const pool = Object.values(W.agents).filter(a => a.alive && a.country === c.id && a.id !== c.leader && (W.year - a.birth) > 28 && (W.year - a.birth) < 70);
    if (!pool.length) { c.heir = 0; return; }
    let best = null, bv = -1;
    for (const a of pool) {
      let v = a.prestige * 1.2 + a.tr[TI.charisma] + a.tr[TI.organize] * 0.8;
      if (GOVS[c.gov].succ === 'army' && a.role === 'general') v += 1.2;
      if (GOVS[c.gov].succ === 'party' && a.role === 'party') v += 1.2;
      if (v > bv) { bv = v; best = a; }
    }
    c.heir = best ? best.id : 0;
  }
}

/* ---------- ۷) ابزارهای متنی و رویدادنگاری ---------- */
const FA_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
function faNum(n) {
  if (!isFinite(n)) n = 0;
  let s = String(Math.round(n));
  let neg = s[0] === '-'; if (neg) s = s.slice(1);
  let out = '';
  for (let i = 0; i < s.length; i++) {
    out += FA_DIGITS[+s[i]];
    const rem = s.length - i - 1;
    if (rem > 0 && rem % 3 === 0) out += '٬';
  }
  return (neg ? '−' : '') + out;
}
function news(title, text, kind, extra) {
  W.news.push(Object.assign({ y: Math.floor(W.year), t: title, x: text, k: kind || 'info' }, extra || {}));
  if (W.news.length > 400) W.news.splice(0, W.news.length - 400);
}
function logHistory(y, text, kind) {
  W.history.push({ y: Math.floor(y), x: text, k: kind || 'event' });
  if (W.history.length > 1200) W.history.splice(0, 200);
}
function stateHist(st, text) {
  st.hist.push({ y: Math.floor(W.year), x: text });
  if (st.hist.length > 14) st.hist.shift();
}
function pause(reason, kind) {
  if (!W.settings.autoPause[kind]) return;
  W.pendingPause = { r: reason, k: kind };
}

/* ---------- ۸) اقتصاد ---------- */
function resScore(st) {
  let s = 0;
  s += clamp(st.foodBase / 2.2, 0, 1) * 0.30;
  s += clamp(st.forest / 100, 0, 1) * 0.15;
  if (st.known.iron) s += clamp(st.iron / 1200, 0, 1) * 0.20;
  if (st.known.gold) s += clamp(st.gold / 400, 0, 1) * 0.15;
  if (st.known.oil) s += clamp(st.oil / 2000, 0, 1) * 0.30;
  return clamp(s, 0, 1.1);
}
function stateOutput(st) {
  const c = st.controller ? W.countries[st.controller] : null;
  const tech = c ? c.tech : 1.5;
  const popF = Math.pow(Math.max(st.pop, 1) / BAL.POP_REF, BAL.POP_EXP);
  const dev = (0.30 * tech + 0.20 * st.infra + 0.16 * st.industry + 0.12 * st.trade + 0.10 * st.agri + 0.12 * st.health) / 100;
  const prod = 0.25 + 1.75 * clamp(dev, 0, 1.1);
  const cond = 0.45 + 0.55 * (0.45 * st.sat / 100 + 0.30 * st.security / 100 + 0.25 * st.health / 100);
  const resB = 1 + 0.35 * resScore(st);
  const ecoFree = c ? (0.88 + 0.24 * GOVS[c.gov].ecoFree) : 1;
  const warF = (1 - 0.7 * st.devast / 100) * (0.60 + 0.40 * st.integ) * (st.siege > 0 ? 0.55 : 1);
  const capF = st.capital ? 1.15 : 1;
  return BAL.ECON_REF * popF * prod * cond * resB * warF * capF * ecoFree;
}
function taxCollect(c) {
  const g = GOVS[c.gov];
  const t = c.taxRate;
  const laffer = 1 - 0.55 * Math.pow(clamp(t / 0.62, 0, 1.4), 1.8);
  const eff = (0.55 + 0.45 * g.effic) * (1 - c.corruption / 220);
  return clamp(t * laffer * eff, 0.01, 0.6);
}
function avgStateRevenue(c) {
  const n = c.owned.length + c.ctrl.length;
  if (!n) return 10;
  let s = 0;
  for (const sid of c.owned) s += W.states[sid - 1].lastInc;
  for (const sid of c.ctrl) s += W.states[sid - 1].lastInc;
  return Math.max(6, s / n);
}
function countryRevenue(c) {
  const rate = taxCollect(c);
  let sum = 0, gross = 0;
  for (const sid of c.owned) {
    const st = W.states[sid - 1];
    const E = stateOutput(st);
    st.lastOut = E;
    const inc = E * rate;
    st.lastInc = inc;
    gross += E; sum += inc;
  }
  for (const sid of c.ctrl) {
    const st = W.states[sid - 1];
    const E = stateOutput(st);
    st.lastOut = E;
    /* استعمار: حداکثر ۵۰٪ درآمد ناخالص، کاهش با مقاومت */
    const take = BAL.COLONY_TAKE * clamp(1 - st.unrest / 130, 0.25, 1);
    const inc = E * take * rate / Math.max(rate, 0.18) * 0.5;
    st.lastInc = E * take * 0.5;
    gross += E; sum += st.lastInc;
  }
  /* درآمد تجارت خارجی و باج دولت‌های وابسته */
  let trade = 0;
  for (const oid in c.rel) {
    const r = c.rel[oid];
    const o = W.countries[oid];
    if (!o || !o.alive || r.status === 'war' || r.embargo) continue;
    trade += r.trade * 0.06;
  }
  let tribute = 0;
  for (const vid of c.vassals) {
    const v = W.countries[vid];
    if (v && v.alive) tribute += v.lastCycle ? v.lastCycle.revenue * 0.18 : 0;
  }
  return { revenue: sum + trade + tribute, gross, trade, tribute };
}
function countryCosts(c, rev) {
  const n = c.owned.length + c.ctrl.length;
  const avg = Math.max(6, rev.revenue / Math.max(1, n));
  const adminUnit = Math.max(2.2, 0.105 * avg);
  let admin = adminUnit * Math.pow(Math.max(n, 1), BAL.ADMIN_EXP) * (1 + c.corruption / 190);
  admin *= (1 - 0.20 * GOVS[c.gov].effic);
  if (c.owned.indexOf(c.capital) >= 0) admin *= 0.94; /* پاداش اداری پایتخت */
  const soldierCost = 0.30 * (1 + c.tech / 10);
  let army = c.army.troops * soldierCost;
  army += c.army.navy * BAL.NAVY_UPKEEP * (1 + c.tech / 12);
  army += c.army.air * BAL.AIR_UPKEEP * (1 + c.tech / 14);
  let infra = 0;
  for (const sid of c.owned) infra += W.states[sid - 1].infra * 0.0023 * avg;
  let colony = 0;
  for (const sid of c.ctrl) {
    const st = W.states[sid - 1];
    colony += st.lastOut * (0.14 + st.unrest / 320);
  }
  let war = 0;
  for (const op of W.ops) {
    if (op.att === c.id) war += op.force * soldierCost * 0.55 + 12;
    if (op.def === c.id) war += 8;
  }
  const gov = rev.revenue * (0.06 + 0.05 * GOVS[c.gov].central);
  return { admin, army, infra, colony, war, gov, total: admin + army + infra + colony + war + gov };
}
function indexCost(level) { return Math.exp(clamp(level, 0, 100) / BAL.INDEX_COST); }

function investBudget(c, pool) {
  const n = Math.max(1, c.owned.length);
  const scale = Math.max(6, avgStateRevenue(c)) * n;
  const b = c.budget;
  const spend = {};
  BUDGET_KEYS.forEach(k => { spend[k] = pool * (b[k] || 0); });
  const eff = (0.55 + 0.45 * GOVS[c.gov].effic) * (1 - c.corruption / 200);
  const rel = k => (spend[k] / scale) * eff;

  /* دانش و فناوری */
  const kq = rel('science') + rel('education') * 0.4;
  c.knowledge = clamp(c.knowledge + kq * BAL.KNOW_K / indexCost(c.knowledge), 0, 100);
  c.education = clamp(c.education + rel('education') * BAL.EDU_K / indexCost(c.education), 0, 100);
  c.healthIdx = clamp(c.healthIdx + rel('health') * BAL.HEALTH_K / indexCost(c.healthIdx), 0, 100);
  /* فناوری: پول ← آموزش/دانش ← تحقیق ← فناوری */
  const q = clamp(0.06 + 0.94 * Math.pow(c.knowledge / 100, 1.5), 0.02, 1.1) *
    (0.5 + 0.5 * c.education / 100) * (0.6 + 0.4 * c.stability / 100);
  const diffusion = techDiffusion(c);
  const research = rel('tech') + rel('science') * 0.35;
  let dTech = BAL.TECH_K * research * q / Math.pow(BAL.TECH_BASE + c.tech / BAL.TECH_DIV, BAL.TECH_POW);
  dTech *= (1 - 0.35 * clamp(c.warWeariness / 100, 0, 1));
  const ceiling = Math.min(100, c.knowledge * 1.25 + 8);
  c.tech = clamp(c.tech + Math.max(0, dTech) + diffusion, 0, ceiling);

  /* شاخص‌های ایالتی */
  const perState = k => (spend[k] / (scale)) * eff * BAL.STATE_K;
  const gInfra = perState('infra'), gInd = perState('industry'), gTrade = perState('trade');
  const gAgri = perState('agri'), gSec = perState('security'), gHouse = perState('housing');
  const gHealth = perState('health'), gCult = perState('culture');
  const taxDrag = 1 - 0.85 * Math.pow(clamp(c.taxRate / 0.62, 0, 1.3), 2);
  const ecoF = 0.70 + 0.60 * GOVS[c.gov].ecoFree;  /* آزادی اقتصادی */
  for (const sid of c.owned) {
    const st = W.states[sid - 1];
    st.infra = clamp(st.infra + gInfra * taxDrag / indexCost(st.infra), 0, 100);
    st.industry = clamp(st.industry + gInd * taxDrag * ecoF * (0.4 + 0.6 * c.tech / 60) / indexCost(st.industry), 0, 100);
    st.trade = clamp(st.trade + gTrade * taxDrag * ecoF * (st.coastalB ? 1.2 : 1) / indexCost(st.trade), 0, 100);
    st.agri = clamp(st.agri + gAgri / indexCost(st.agri), 0, 100);
    st.security = clamp(st.security + gSec / indexCost(st.security), 0, 100);
    st.health = clamp(st.health + (gHealth * 0.6 + c.healthIdx * 0.02) / indexCost(st.health), 0, 100);
    st.sat = clamp(st.sat + gHouse * 0.5 + gCult * 0.4, 0, 100);
  }
  /* ارتش: تجهیز و آموزش نیرو */
  c.pendingArmyFund = (c.pendingArmyFund || 0) + spend['army'];
  /* دیپلماسی و اطلاعات */
  const dip = rel('diplomacy');
  for (const oid in c.rel) {
    const r = c.rel[oid];
    if (W.countries[oid] && W.countries[oid].alive) r.trust = clamp(r.trust + dip * 3.5, 0, 100);
  }
  c.intelLevel = clamp((c.intelLevel || 0) * 0.9 + rel('intel') * 45, 0, 100);
  /* غذا و رفاه */
  c.foodSubsidy = rel('food');
  return spend;
}
function techDiffusion(c) {
  let best = 0, link = 0;
  for (const oid in c.rel) {
    const o = W.countries[oid];
    if (!o || !o.alive) continue;
    const r = c.rel[oid];
    if (r.status === 'war' || r.embargo) continue;
    const contact = clamp(r.trade / 900 + (r.ally ? 0.4 : 0) + (r.status === 'friendly' ? 0.2 : 0) + (bordersCountry(c, o) ? 0.25 : 0), 0, 1);
    if (o.tech > c.tech) {
      const gap = o.tech - c.tech;
      const v = gap * contact;
      if (v > best) best = v;
      link += contact;
    }
  }
  return clamp(best * 0.035 * clamp(0.4 + c.education / 120, 0.3, 1.2), 0, 0.9);
}
function bordersCountry(a, b) {
  for (const sid of a.owned) {
    for (const nb of GEO.neighbors[sid - 1]) {
      const st = W.states[nb];
      if (st.controller === b.id) return true;
    }
  }
  return false;
}

/* ---------- ۹) جمعیت و منابع ---------- */
function foodProduction(st, techOverride) {
  const c = st.controller ? W.countries[st.controller] : null;
  const tech = techOverride != null ? techOverride : (c ? c.tech : 1.5);
  const damp = (1 - st.devast / 150) * (st.siege > 0 ? 0.55 : 1) * (st.droughtYears > 0 ? 0.7 : 1);
  return st.foodBase * (80 + st.agri * 2.6 + Math.pow(Math.max(tech, 1), 1.45) * 2.6) * damp;
}
function popCapacity(st) {
  /* ظرفیت جمعیت از توان تولید غذا می‌آید */
  return Math.max(30, foodProduction(st) / 0.5);
}
function popYear(st) {
  const c = st.controller ? W.countries[st.controller] : null;
  const K = popCapacity(st);
  st.popCap = K;
  const health = st.health / 100, sat = st.sat / 100;
  let r = 0.004 + 0.011 * health + 0.004 * sat;
  if (c && c.foodShort) r -= 0.012 * c.foodShort;
  if (st.devast > 30) r -= 0.006 * (st.devast / 100);
  if (st.siege > 0) r -= 0.010;
  const growth = st.pop * r * (1 - st.pop / K);
  st.pop = Math.max(8, st.pop + growth);
  if (st.pop > K * 1.12) st.unrest = clamp(st.unrest + 0.8, 0, 100);
}
function resourceCycle(c) {
  const prod = { food: 0, wood: 0, iron: 0, oil: 0, gold: 0 };
  const all = c.owned.concat(c.ctrl);
  for (const sid of all) {
    const st = W.states[sid - 1];
    const own = st.owner === c.id;
    const share = own ? 1 : BAL.COLONY_TAKE;
    const damp = (1 - st.devast / 140) * (st.siege > 0 ? 0.5 : 1) * (1 - (st.extractDamage || 0) / 110);
    prod.food += foodProduction(st, c.tech) * share;
    const cut = Math.min(st.forest * 0.055 * (0.6 + c.tech / 90), st.forest);
    st.forest = clamp(st.forest - cut + (st.forestCap - st.forest) * 0.09, 0, st.forestCap);
    prod.wood += cut * 2.2 * damp * share;
    if (st.known.iron && st.iron > 0) {
      const ex = Math.min(st.iron, st.iron * 0.016 * (0.4 + c.tech / 70) + 2);
      st.iron = Math.max(0, st.iron - ex); prod.iron += ex * damp * share;
      if (st.iron <= 0) { stateHist(st, 'ذخایر آهن به پایان رسید.'); }
    }
    if (st.known.oil && st.oil > 0 && c.tech >= 40) {
      const ex = Math.min(st.oil, st.oil * 0.020 * (0.3 + c.tech / 60) + 3);
      st.oil = Math.max(0, st.oil - ex); prod.oil += ex * damp * share;
      if (st.oil <= 0) { stateHist(st, 'میدان نفتی خشک شد.'); }
    }
    if (st.known.gold && st.gold > 0) {
      const ex = Math.min(st.gold, st.gold * 0.013 * (0.5 + c.tech / 80) + 0.8);
      st.gold = Math.max(0, st.gold - ex); prod.gold += ex * damp * share;
    }
  }
  return prod;
}
function discoverCheck(st) {
  const c = st.controller ? W.countries[st.controller] : null;
  const tech = c ? c.tech : 1;
  if (!st.known.gold && st.gold > 0 && RNGX.chance(0.02 + tech / 900)) {
    st.known.gold = true; stateHist(st, 'معدن طلا کشف شد.');
    if (c) news('کشف معدن', 'در ایالت ' + faNum(st.id) + ' معدن طلا کشف شد.', 'discovery', { c: c.id, s: st.id });
  }
  if (!st.known.iron && st.iron > 0 && tech > 12 && RNGX.chance(0.010 + (tech - 12) / 1400)) {
    st.known.iron = true; stateHist(st, 'ذخایر آهن کشف شد.');
    if (c) news('کشف آهن', 'ذخایر آهن در ایالت ' + faNum(st.id) + ' شناسایی شد.', 'discovery', { c: c.id, s: st.id });
  }
  if (!st.known.oil && st.oil > 0 && tech > 38 && RNGX.chance(0.012 + (tech - 38) / 1200)) {
    st.known.oil = true; stateHist(st, 'میدان نفتی کشف شد.');
    if (c) news('کشف نفت', 'میدان نفتی بزرگی در ایالت ' + faNum(st.id) + ' کشف شد؛ ارزش این سرزمین دگرگون شد.', 'discovery', { c: c.id, s: st.id });
  }
}

/* ---------- ۱۰) بازار جهانی ---------- */
function marketCycle(worldProd, worldDemand) {
  for (const k of RES_KEYS) {
    const m = W.market[k];
    const sup = Math.max(1, worldProd[k]), dem = Math.max(1, worldDemand[k]);
    const target = clamp(dem / sup, 0.35, 3.2);
    const desired = m.price * target;
    let crisis = W.crisis && W.crisis[k] ? 1 : 0;
    const lim = crisis ? 0.28 : 0.10;
    const maxP = m.price * (1 + lim), minP = m.price * (1 - lim);
    m.price = clamp(clamp(desired, minP, maxP), 0.18, 60);
    m.supply = sup; m.demand = dem;
    m.hist.push(r3(m.price));
    if (m.hist.length > 60) m.hist.shift();
  }
}

/* ---------- ۱۱) ارتش ---------- */
function countryPop(c) {
  let p = 0;
  for (const sid of c.owned) p += W.states[sid - 1].pop;
  for (const sid of c.ctrl) p += W.states[sid - 1].pop * 0.35;
  return p;
}
function maxManpower(c) {
  const pop = countryPop(c);
  const law = c.conscript || 0.03;
  const satF = 0.60 + 0.40 * (avgSat(c) / 100);
  const techF = 0.85 + 0.25 * (c.tech / 100);
  const govF = 0.85 + 0.40 * GOVS[c.gov].army;
  return Math.max(10, pop * law * satF * techF * govF);
}
function avgSat(c) {
  if (!c.owned.length) return 40;
  let s = 0;
  for (const sid of c.owned) s += W.states[sid - 1].sat;
  return s / c.owned.length;
}
function committedOf(c) {
  let f = 0;
  for (const op of W.ops) if (op.att === c.id) f += op.force;
  return f;
}
function unitQuality(c) { return 1 + c.tech / 17; }
function resourceNeedFor(c, kind, amount) {
  /* کمبود منابع هزینه را بالا می‌برد (واردات) */
  let extra = 0;
  const need = kind === 'ship' ? { iron: amount * 6, wood: amount * 9, oil: c.tech > 45 ? amount * 5 : 0 }
    : kind === 'air' ? { iron: amount * 5, oil: amount * 8 }
      : { iron: amount * 0.05 * (0.4 + c.tech / 60), food: amount * 0.25 };
  for (const k in need) {
    const want = need[k];
    if (want <= 0) continue;
    const have = c.stock[k] || 0;
    const use = Math.min(have, want);
    c.stock[k] = have - use;
    const missing = want - use;
    if (missing > 0) extra += missing * W.market[k].price * 1.35;
  }
  return extra;
}
function spendArmyFund(c) {
  let fund = c.pendingArmyFund || 0;
  c.pendingArmyFund = 0;
  if (fund <= 0) { c.army.readiness = clamp(c.army.readiness - 3, 10, 100); return; }
  const maxMan = maxManpower(c);
  const cur = c.army.troops + pendingTrain(c);
  /* بخشی برای آمادگی و روحیه، بخشی برای نیروی جدید */
  const targetShare = c.isPlayer ? (c.armyTarget != null ? c.armyTarget : 0.9) : (0.35 + 0.6 * c.bias.militarism);
  const wantGrow = cur < maxMan * targetShare;
  const readyShare = wantGrow ? 0.35 : 0.7;
  const readyMoney = fund * readyShare;
  const growMoney = fund - readyMoney;
  const scale = Math.max(6, avgStateRevenue(c)) * Math.max(1, c.owned.length);
  c.army.readiness = clamp(c.army.readiness + (readyMoney / scale) * 55 - 2, 5, 100);
  c.army.morale = clamp(c.army.morale + (readyMoney / scale) * 22 - 1, 5, 100);
  if (growMoney > 0 && cur < maxMan * (c.isPlayer ? targetShare : 1)) {
    const base = BAL.RECRUIT_COST * (1 + c.tech / 12);
    let n = Math.floor(growMoney / Math.max(0.2, base));
    n = Math.min(n, Math.max(0, Math.floor(maxMan - cur)));
    if (n > 0) {
      const extra = resourceNeedFor(c, 'troops', n);

  } else {

  }

  c.army.morale = clamp(c.army.morale + 4, 5, 100);
  if (dc) {

    dc.stability = clamp(dc.stability - 3, 0, 100);
    addCountryMemory(dc, { t: 'lostState', other: c.id, w: 0.8 });
    const lead = W.agents[dc.leader];
    if (lead) addMemory(lead, { y: W.year, t: 'lostState', w: 0.75, other: c.id });

}
function transferState(st, newOwner, mode) {

  }

    oc.legitimacy = clamp(oc.legitimacy - 14, 0, 100);
    oc.army.morale = clamp(oc.army.morale - 12, 5, 100);
    if (oc.owned.length) {
      const nc = oc.owned.slice().sort((a, b) => W.states[b - 1].pop - W.states[a - 1].pop)[0];
      oc.capital = nc; W.states[nc - 1].capital = true;
      news('سقوط پایتخت', 'پایتخت ' + oc.name + ' سقوط کرد؛ ایالت ' + faNum(nc) + ' پایتخت جدید شد.', 'gov', { c: oc.id, s: nc });

function rebuildLists() {

    if (st.controller && st.controller !== st.owner) {

}
function destroyCountry(c) {

  for (const cid in W.countries) {
    const o = W.countries[cid];
    if (o.vassalOf === c.id) o.vassalOf = 0;
    const i = o.vassals.indexOf(c.id); if (i >= 0) o.vassals.splice(i, 1);

function checkEnd() {

  for (const cid in counts) {
    if (counts[cid] >= BAL.MAX_STATES) {
      const c = W.countries[cid];
      if (c && c.isPlayer) endGame(true, 'پیروزی — جهان متحد شد.');
      else if (c) endGame(false, 'شکست — کشور ' + c.name + ' تمام جهان را تصرف کرد.');

  }
  if (W.observer) return;
  const pc = W.countries[W.player];
  if (!pc || !pc.alive || pc.owned.length === 0) endGame(false, 'شکست — کشور شما تمام قلمرو خود را از دست داد.');
}
function endGame(win, msg) {

/* ---------- ۱۴) حافظه تاریخی کشورها و دیپلماسی ---------- */
function addCountryMemory(c, m) {
  c.mem.push({ y: W.year, t: m.t, other: m.other || 0, w: m.w || 0.5 });
  if (c.mem.length > 40) c.mem.shift();
}
function memoryWeight(c, otherId, type) {
  let s = 0;
  for (const m of c.mem) {
    if (m.other !== otherId) continue;
    if (type && m.t !== type) continue;
    const age = W.year - m.y;
    s += m.w * Math.exp(-age / 90);
  }
  return s;
}
function relOf(a, b) {
  if (!a.rel[b]) a.rel[b] = { trust: 45, fear: 15, tension: 10, trade: 0, grudge: 0, status: 'neutral', truce: 0, ally: false, defPact: false, nonAgg: false, guarantee: false, embargo: false };
  return a.rel[b];
}
function militaryPower(c) {
  return Math.pow(Math.max(c.army.troops, 1), 0.92) * unitQuality(c) * (0.5 + 0.5 * c.army.morale / 100) * (0.6 + 0.4 * c.army.readiness / 100) + c.army.navy * 25 + c.army.air * 40;
}
function estimatePower(c, o) {
  /* AI تقلب نمی‌کند: تخمین بر پایه اطلاعات، تجارت و مرز مشترک */
  const r = relOf(c, o.id);
  const info = clamp(0.25 + (c.intelLevel || 0) / 160 + r.trade / 2200 + (bordersCountry(c, o) ? 0.22 : 0) + (r.ally ? 0.3 : 0), 0.2, 1);
  const real = militaryPower(o);
  const noise = 1 + (1 - info) * (RNGX.f() * 1.5 - 0.7);
  return { est: Math.max(1, real * noise), info };
}
function updateRelations(c) {
  for (const oid in c.rel) {
    const o = W.countries[oid];
    const r = c.rel[oid];
    if (!o || !o.alive) { delete c.rel[oid]; continue; }
    if (r.status === 'war') { r.tension = clamp(r.tension + 0.6, 0, 100); continue; }
    if (r.truce > 0) r.truce = Math.max(0, r.truce - 1);
    const grud = memoryWeight(c, o.id, 'lostState') + memoryWeight(c, o.id, 'betray');
    const help = memoryWeight(c, o.id, 'help') + memoryWeight(c, o.id, 'aid');
    r.grudge = clamp(grud * 26 - help * 10, 0, 100);
    const mine = militaryPower(c), theirs = estimatePower(c, o).est;
    r.fear = clamp(r.fear * 0.85 + 100 * clamp(theirs / (mine + theirs), 0, 1) * 0.30, 0, 100);
    const govSim = 1 - Math.abs(GOVS[c.gov].central - GOVS[o.gov].central);
    const cultural = ethAffinity(c, o);
    const bt = borderTension(c, o);
    /* اعتماد به سمت یک تعادل حرکت می‌کند، نه رشد بی‌پایان */
    const trustTarget = clamp(34 + govSim * 14 + cultural * 14 + clamp(r.trade / 45, 0, 14) +
      (r.ally ? 14 : 0) + (r.nonAgg ? 5 : 0) - r.grudge * 0.45 - bt * 13 - r.fear * 0.12, 0, 100);
    r.trust = clamp(r.trust + (trustTarget - r.trust) * 0.07, 0, 100);
    r.tension = clamp(r.tension * 0.93 + bt * 3.0 + resourceRivalry(c, o) * 1.6 + r.grudge * 0.05, 0, 100);
    const score = r.trust - r.tension * 0.75 - r.grudge * 0.55 + (r.ally ? 28 : 0) + (r.nonAgg ? 8 : 0);
    r.status = r.ally ? 'ally' : (score > 62 ? 'friendly' : score > 36 ? 'neutral' : score > 18 ? 'tense' : 'hostile');
  }
}
function ethAffinity(a, b) {
  const ea = W.states[a.capital - 1], eb = W.states[b.capital - 1];
  if (!ea || !eb) return 0;
  return ea.eth === eb.eth ? 1 : (Math.abs(ea.eth - eb.eth) === 1 ? 0.4 : 0);
}
function borderTension(a, b) {

  return clamp(n / 9, 0, 1.4);
}
function resourceRivalry(a, b) {
  let s = 0;
  for (const k of ['oil', 'iron', 'gold']) {
    const na = resNeed(a, k), nb = resNeed(b, k);
    if (na > 0.4 && nb > 0.4) s += 0.25;

}
function resNeed(c, k) {

  return clamp(1 - have / Math.max(want, 1), 0, 1);
}
function declareWar(a, b, reason) {

  ra.status = 'war'; rb.status = 'war';
  ra.ally = rb.ally = false; ra.nonAgg = rb.nonAgg = false; ra.defPact = rb.defPact = false;
  ra.tension = rb.tension = 100;

  addCountryMemory(a, { t: 'war', other: b.id, w: 0.6 });

        else {

          news('پیمان شکسته شد', o.name + ' از تعهد دفاعی خود در قبال ' + b.name + ' سر باز زد.', 'diplo', { c: o.id, c2: b.id });

function makePeace(a, b) {

  a.warWeariness = clamp(a.warWeariness - 25, 0, 100);

      (op.att === b.id && W.states[op.target - 1].controller === a.id)) {

/* ---------- ۱۵) شخصیت‌ها، مرگ و جانشینی ---------- */
function killAgent(a, cause) {
  if (!a || !a.alive) return;
  a.alive = false; a.death = Math.floor(W.year); a.cause = cause || 'طبیعی';
  const c = W.countries[a.country];
  if (c && c.alive) {
    for (const kidId of a.children) {
      const kid = W.agents[kidId];
      if (kid && kid.alive) {
        addMemory(kid, { y: W.year, t: cause === 'جنگ' ? 'warDeath' : 'parentDeath', w: cause === 'جنگ' ? 0.95 : 0.6, other: a.lastEnemy || 0 });
        if (cause === 'جنگ' && a.lastEnemy) kid.her.grudge[a.lastEnemy] = clamp((kid.her.grudge[a.lastEnemy] || 0) + 0.5, 0, 1);
      }
    }
    if (c.leader === a.id) succession(c, cause);
    else if (c.heir === a.id) pickHeir(c);
  }
}
function succession(c, cause) {
  const g = GOVS[c.gov];
  const old = W.agents[c.leader];
  let next = c.heir ? W.agents[c.heir] : null;
  if (!next || !next.alive) {
    pickHeir(c);
    next = c.heir ? W.agents[c.heir] : null;
  }
  if (!next || !next.alive) {
    /* بحران جانشینی */
    const pool = Object.values(W.agents).filter(a => a.alive && a.country === c.id && (W.year - a.birth) > 25);
    if (pool.length) next = pool[Math.floor(RNGX.f() * pool.length)];
    else next = newAgent({ country: c.id, role: 'leader', birth: W.year - 35, eth: W.states[c.capital - 1].eth });
    c.stability = clamp(c.stability - 12, 0, 100);
    c.legitimacy = clamp(c.legitimacy - 14, 0, 100);
    news('بحران جانشینی', 'در ' + c.name + ' بر سر جانشینی اختلاف افتاد.', 'gov', { c: c.id });
  }
  next.role = 'leader';
  c.leader = next.id;
  addMemory(next, { y: W.year, t: 'crown', w: 0.9, other: 0 });
  pickHeir(c);
  /* تغییر جهت‌گیری کشور با رهبر تازه */
  applyLeaderBias(c);
  c.legitimacy = clamp(c.legitimacy - (g.succ === 'heir' ? 3 : 8) + next.prestige * 10, 0, 100);
  news('رهبر تازه', (old ? old.name + ' ' + (old.sur || '') + ' در ' + faNum(Math.floor(W.year - old.birth)) + ' سالگی درگذشت؛ ' : '') + next.name + ' ' + (next.sur || '') + ' رهبر ' + c.name + ' شد.', 'gov', { c: c.id });
  logHistory(W.year, 'رهبر تازه در ' + c.name + ': ' + next.name);
  if (c.isPlayer) pause('حاکم شما درگذشت؛ ' + next.name + ' جانشین شد', 'leaderDeath');
}
function applyLeaderBias(c) {
  const a = W.agents[c.leader];
  if (!a) return;
  const t = a.tr;
  c.bias.militarism = clamp(0.25 + t[TI.aggression] * 0.5 + t[TI.courage] * 0.25, 0.05, 0.98);
  c.bias.expansion = clamp(0.20 + t[TI.ambition] * 0.55 + t[TI.risk] * 0.25, 0.05, 0.98);
  c.bias.science = clamp(0.20 + t[TI.curiosity] * 0.45 + t[TI.intel] * 0.35, 0.05, 0.98);
  c.bias.trade = clamp(0.20 + t[TI.enterprise] * 0.5 + t[TI.negotiation] * 0.3, 0.05, 0.98);
  c.bias.welfare = clamp(0.20 + t[TI.empathy] * 0.5 + t[TI.justice] * 0.3, 0.05, 0.98);
  c.bias.diplomacy = clamp(0.20 + t[TI.negotiation] * 0.45 + t[TI.social] * 0.3, 0.05, 0.98);
  c.bias.authoritarian = clamp(0.15 + t[TI.authoritarian] * 0.6 + GOVS[c.gov].central * 0.3, 0.05, 0.98);
  c.bias.risk = clamp(0.15 + t[TI.risk] * 0.6 + t[TI.ambition] * 0.2, 0.05, 0.98);
}
function agentsYear() {
  const ids = Object.keys(W.agents);
  const dead = [];
  for (const id of ids) {
    const a = W.agents[id];
    if (!a.alive) { if (a.death && W.year - a.death > 25 && a.role !== 'leader') dead.push(id); continue; }
    const age = W.year - a.birth;
    let risk = 0;
    if (age > a.lifespan) risk = 0.55;
    else if (age > a.lifespan - 8) risk = 0.08;
    else risk = 0.004 + (age < 5 ? 0.02 : 0);
    const c = W.countries[a.country];
    if (c && c.alive) {
      risk += (1 - c.healthIdx / 130) * 0.004;
      if (c.famineYears > 0) risk += 0.02;
      const w = Object.values(c.rel).some(r => r.status === 'war');
      if (w && a.role === 'general') risk += 0.012;
    }
    if (RNGX.chance(risk)) { killAgent(a, age > a.lifespan - 10 ? 'طبیعی' : RNGX.pick(['بیماری', 'حادثه', 'جنگ', 'ترور'])); continue; }
    /* ازدواج و فرزند */
    if (a.alive && age > 18 && age < 48 && !a.spouse && RNGX.chance(0.06) && c && c.alive) {
      const pool = Object.values(W.agents).filter(x => x.alive && x.country === a.country && x.sex !== a.sex && !x.spouse && (W.year - x.birth) > 17 && (W.year - x.birth) < 45);
      if (pool.length) {
        const s = pool[Math.floor(RNGX.f() * pool.length)];
        a.spouse = s.id; s.spouse = a.id;
      }
    }
    if (a.alive && a.spouse && a.sex === 'f' && age > 17 && age < 44 && RNGX.chance(0.16)) {
      const father = W.agents[a.spouse];
      if (father && father.alive) {
        const kid = newAgent({ country: a.country, role: (father.role === 'leader' || father.role === 'royal') ? 'royal' : 'noble', sur: father.sur, father: father.id, mother: a.id, eth: a.eth, birth: W.year, her: mergeHeritage(father, a) });
        a.children.push(kid.id); father.children.push(kid.id);
        W.stats.born++;
      }
    }
  }
  /* پاک‌سازی برای کارایی و کوچک ماندن فایل ذخیره */
  if (Object.keys(W.agents).length > 1400) {
    for (const id of dead) {
      const a = W.agents[id];
      if (a && a.role !== 'leader') delete W.agents[id];
    }
  }
}
function mergeHeritage(f, m) {
  const her = { grudge: {}, famine: 0, respect: {} };
  const keys = new Set(Object.keys(f.her.grudge).concat(Object.keys(m.her.grudge)));
  keys.forEach(k => {
    const v = ((f.her.grudge[k] || 0) + (m.her.grudge[k] || 0)) / 2 * 0.75;
    if (v > 0.05) her.grudge[k] = v;
  });
  her.famine = ((f.her.famine || 0) + (m.her.famine || 0)) / 2 * 0.75;
  const rk = new Set(Object.keys(f.her.respect).concat(Object.keys(m.her.respect)));
  rk.forEach(k => {
    const v = ((f.her.respect[k] || 0) + (m.her.respect[k] || 0)) / 2 * 0.75;
    if (v > 0.05) her.respect[k] = v;
  });
  return her;
}

/* ---------- ۱۶) حکومت، انقلاب و کودتا ---------- */
function govAttrs(c) {
