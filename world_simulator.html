  const threat = clamp(Object.values(c.rel).reduce((s, r) => s + (r.status === 'war' ? 1.4 : r.status === 'hostile' ? 0.5 : 0), 0), 0, 4);
  const w = {
    army: 0.10 + c.bias.militarism * 0.28 + threat * 0.08 + g.army * 0.12,
    science: 0.05 + c.bias.science * 0.14,
    tech: 0.05 + c.bias.science * 0.16,
    education: 0.04 + c.bias.science * 0.10,
    health: 0.04 + c.bias.welfare * 0.10,
    agri: 0.07 + (c.foodShort || 0) * 0.22,
    food: 0.03 + (c.foodShort || 0) * 0.16,
    industry: 0.05 + c.bias.trade * 0.10,
    trade: 0.04 + c.bias.trade * 0.12,
    housing: 0.03 + c.bias.welfare * 0.08,
    infra: 0.07 + c.bias.trade * 0.06,
    culture: 0.02 + c.bias.welfare * 0.05,
    diplomacy: 0.02 + c.bias.diplomacy * 0.08,
    intel: 0.02 + c.bias.authoritarian * 0.05,
    security: 0.03 + clamp(c.unrestAvg / 130, 0, 0.16) + g.repress * 0.06
  };
  let tot = 0; for (const k in w) tot += w[k];
  for (const k in w) b[k] = w[k] / tot;
  c.budget = b;
  /* مالیات بر پایه تراز واقعی بودجه */
  const lc = c.lastCycle;
  const margin = lc ? lc.net / Math.max(1, lc.revenue) : 0;
  const satPressure = avgSat(c) < 44 || c.unrestAvg > 55;
  let t = c.taxRate;
  if (margin < 0.08) t += 0.03 + (threat > 0 ? 0.01 : 0);
  else if (margin > 0.45) t -= 0.02;
  else if (satPressure && margin > 0.2) t -= 0.015;
  if (satPressure && margin < 0.08) t += 0.005;
  if (c.treasury < 0) t += 0.02;
  c.taxRate = clamp(t, 0.08, GOVS[c.gov].taxMax);
  c.spendRatio = clamp(0.72 + c.bias.expansion * 0.12 + (threat > 0 ? 0.08 : 0), 0.6, 0.95);
  c.conscript = clamp(0.012 + c.bias.militarism * 0.05 + threat * 0.012 + GOVS[c.gov].army * 0.02, 0.008, 0.09);
}

/* ---------- ۲۰) رویدادهای جهان ---------- */
function worldEvents() {
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    /* قحطی: وابسته به شرایط */
    const short = c.foodShort || 0;
    if (short > 0.18 && RNGX.chance(clamp(short * 0.35, 0, 0.3))) {
      c.famineYears = 3;
      for (const sid of c.owned) {
        const st = W.states[sid - 1];
        st.pop = Math.max(8, st.pop * (1 - RNGX.range(0.02, 0.07)));
        st.sat = clamp(st.sat - RNGX.range(6, 16), 0, 100);
        st.unrest = clamp(st.unrest + RNGX.range(5, 14), 0, 100);
      }
      const lead = W.agents[c.leader];
      if (lead) { addMemory(lead, { y: W.year, t: 'famine', w: 0.8, other: 0 }); lead.her.famine = clamp(lead.her.famine + 0.3, 0, 1); }
      news('قحطی', 'قحطی گسترده در ' + c.name + ' جان بسیاری را گرفت.', 'crisis', { c: c.id });
      logHistory(W.year, 'قحطی در ' + c.name);
    } else if (c.famineYears > 0) c.famineYears--;
    /* بیماری */
    if (RNGX.chance(clamp(0.012 - c.healthIdx / 4000, 0.002, 0.02))) {
      const affected = c.owned.slice(0, Math.max(1, Math.floor(c.owned.length * RNGX.range(0.2, 0.7))));
      for (const sid of affected) {
        const st = W.states[sid - 1];
        st.pop = Math.max(8, st.pop * (1 - RNGX.range(0.03, 0.11) * (1 - c.healthIdx / 150)));
        st.sat = clamp(st.sat - 6, 0, 100);
      }
      news('بیماری', 'بیماری واگیردار در ' + c.name + ' شیوع یافت.', 'crisis', { c: c.id });
    }
    /* رونق و رکود */
    if (RNGX.chance(0.02)) {
      const boom = RNGX.chance(clamp(0.35 + c.stability / 220 + c.tech / 300, 0.2, 0.7));
      const f = boom ? RNGX.range(1.04, 1.12) : RNGX.range(0.90, 0.97);
      for (const sid of c.owned) {
        const st = W.states[sid - 1];
        st.industry = clamp(st.industry * f, 0, 100);
        st.trade = clamp(st.trade * f, 0, 100);
      }
      news(boom ? 'رونق اقتصادی' : 'رکود اقتصادی', (boom ? 'اقتصاد ' : 'رکود در اقتصاد ') + c.name + (boom ? ' شکوفا شد.' : ' سایه انداخت.'), boom ? 'econ' : 'crisis', { c: c.id });
    }
    /* نابغه علمی */
    if (RNGX.chance(clamp(0.006 + c.education / 2600, 0, 0.02))) {
      const s = newAgent({ country: c.id, role: 'scientist', birth: W.year - RNGX.int(24, 40), eth: W.states[c.capital - 1].eth });
      s.tr[TI.intel] = clamp(s.tr[TI.intel] + 0.35, 0, 1);
      c.knowledge = clamp(c.knowledge + RNGX.range(1.2, 3.5), 0, 100);
      news('نابغه علمی', 'دانشمندی برجسته در ' + c.name + ' ظهور کرد.', 'discovery', { c: c.id });
    }
    /* رنسانس فرهنگی */
    if (RNGX.chance(clamp(0.004 + c.stability / 5000, 0, 0.012))) {
      for (const sid of c.owned) W.states[sid - 1].sat = clamp(W.states[sid - 1].sat + RNGX.range(3, 9), 0, 100);
      c.legitimacy = clamp(c.legitimacy + 5, 0, 100);
      news('شکوفایی فرهنگی', 'دوران درخشان هنر و ادب در ' + c.name + ' آغاز شد.', 'culture', { c: c.id });
    }
  }
  /* خشکسالی منطقه‌ای */
  if (RNGX.chance(0.06)) {
    const center = W.states[RNGX.int(0, W.states.length - 1)];
    const affected = [center.id].concat(GEO.neighbors[center.id - 1].map(i => i + 1));
    for (const sid of affected) {
      const st = W.states[sid - 1];
      st.droughtYears = RNGX.int(2, 6);
    }
    news('خشکسالی', 'خشکسالی در پیرامون ایالت ' + faNum(center.id) + ' آغاز شد.', 'crisis', { s: center.id });
  }
  for (const st of W.states) {
    if (st.droughtYears > 0) {
      st.droughtYears--;
      st.agri = clamp(st.agri - 0.6, 0, 100);
      st.sat = clamp(st.sat - 0.6, 0, 100);
    }
  }
  /* مهاجرت به سرزمین‌های آزاد و مرفه */
  if (RNGX.chance(0.25)) {
    const from = W.states[RNGX.int(0, W.states.length - 1)];
    if (from.pop > 60 && (from.sat < 40 || from.unrest > 55)) {
      const nbs = GEO.neighbors[from.id - 1].map(i => W.states[i]).filter(s => s.sat > from.sat + 12);
      if (nbs.length) {
        const to = nbs[Math.floor(RNGX.f() * nbs.length)];
        const move = from.pop * RNGX.range(0.01, 0.05);
        from.pop -= move; to.pop += move;
      }
    }
  }
}

/* ---------- ۳۱) احزاب، جناح‌ها و جنبش‌ها ---------- */
const FACTION_KINDS = [
  { k: 'party', n: 'حزب سیاسی', govs: [4, 5, 3, 10] },
  { k: 'faction', n: 'جناح درباری', govs: [2, 6, 3] },
  { k: 'movement', n: 'جنبش مردمی', govs: [4, 11, 5] },
  { k: 'union', n: 'اتحادیه صنفی', govs: [6, 5, 4] },
  { k: 'rebels', n: 'گروه شورشی', govs: [11, 9, 8] },
  { k: 'military', n: 'جناح نظامی', govs: [8, 9] },
  { k: 'independence', n: 'جنبش استقلال', govs: [1, 2, 11] },
  { k: 'dynasty', n: 'خاندان سیاسی', govs: [2, 3, 6] },
  { k: 'tech', n: 'انجمن دانشوران', govs: [7, 4] }
];
function createFaction(c) {
  const g = GOVS[c.gov];
  const pool = [];
  if (c.education > 25 && g.polFree > 0.3) pool.push('party', 'movement');
  if (c.unrestAvg > 40) pool.push('rebels', 'movement');
  if (g.army > 0.5 || c.army.pay < 70) pool.push('military');
  if (c.knowledge > 40) pool.push('tech');
  if (g.rich > 0.5 || c.bias.trade > 0.6) pool.push('union');
  if (g.central > 0.6) pool.push('faction', 'dynasty');
  const minority = c.owned.map(s => W.states[s - 1]).filter(s => s.eth !== stateEthOwner(s));
  if (minority.length > 1) pool.push('independence');
  if (!pool.length) pool.push('faction');
  const kind = RNGX.pick(pool);
  const def = FACTION_KINDS.find(f => f.k === kind) || FACTION_KINDS[1];
  const cands = Object.values(W.agents).filter(a => a.alive && a.country === c.id && a.id !== c.leader);
  let leader = null, bv = -1;
  for (const a of cands) {
    const v = a.tr[TI.charisma] * 1.2 + a.tr[TI.ambition] + a.tr[TI.organize] * 0.6 + RNGX.f() * 0.5;
    if (v > bv) { bv = v; leader = a; }
  }
  const eth = kind === 'independence' && minority.length ? minority[0].eth : (W.states[c.capital - 1] ? W.states[c.capital - 1].eth : 0);
  const f = {
    id: (W.facId = (W.facId || 0) + 1), kind: kind, name: def.n + ' ' + (leader ? leader.sur || leader.name : faNum(W.facId)),
    leader: leader ? leader.id : 0, strength: RNGX.range(0.08, 0.22), eth: eth,
    wantGov: RNGX.pick(def.govs), born: Math.floor(W.year)
  };
  if (leader) leader.role = (kind === 'rebels' || kind === 'independence') ? 'rebel' : (kind === 'military' ? 'general' : 'party');
  c.factions.push(f);
  if (c.isPlayer) news('گروه تازه', 'در ' + c.name + ' «' + f.name + '» شکل گرفت.', 'gov', { c: c.id });
}
function factionsYear(c) {
  const g = GOVS[c.gov];
  for (const f of c.factions) {
    let d = 0;
    const lead = W.agents[f.leader];
    if (!lead || !lead.alive) {
      const cands = Object.values(W.agents).filter(a => a.alive && a.country === c.id && a.id !== c.leader);
      f.leader = cands.length ? RNGX.pick(cands).id : 0;
      d -= 0.03;
    } else d += (lead.tr[TI.charisma] - 0.45) * 0.02 + (lead.tr[TI.organize] - 0.45) * 0.012;
    if (f.kind === 'rebels' || f.kind === 'independence') d += c.unrestAvg / 2600 - g.repress * 0.012;
    if (f.kind === 'military') d += (100 - (c.army.pay || 100)) / 2400 + g.army * 0.006 - c.stability / 9000;
    if (f.kind === 'party' || f.kind === 'movement') d += g.polFree * 0.010 + g.party * 0.008 + c.education / 9000 - c.stability / 12000;
    if (f.kind === 'union' || f.kind === 'tech') d += c.knowledge / 12000 + g.ecoFree * 0.006;
    if (f.kind === 'faction' || f.kind === 'dynasty') d += g.central * 0.008 + c.corruption / 9000;
    if (f.wantGov === c.gov) d -= 0.012;
    d -= 0.004;
    f.strength = clamp(f.strength + d, 0, 1);
  }
  c.factions = c.factions.filter(f => f.strength > 0.04);
  if (c.factions.length < 6 && RNGX.chance(0.035 + c.unrestAvg / 2200 + GOVS[c.gov].polFree * 0.03)) createFaction(c);
}
function strongestFaction(c) {
  let best = null;
  for (const f of c.factions) if (!best || f.strength > best.strength) best = f;
  return best;
}

/* ---------- ۳۲) قراردادهای بلندمدت منابع ---------- */
function contractValue(c, other, res, amount, price, asSeller) {
  const m = W.market[res].price;
  const need = resNeed(c, res);
  const r = relOf(c, other.id);
  let u = 0;
  if (asSeller) {
    u += (price / Math.max(m, 0.05) - 1) * 3.2;
    u -= need * 2.2;
    u += (c.stock[res] > amount * 4 ? 0.8 : -0.6);
  } else {
    u += (1 - price / Math.max(m, 0.05)) * 3.2;
    u += need * 2.0;
  }
  u += r.trust / 90 - r.tension / 80 + (r.ally ? 0.6 : 0);
  if (r.status === 'war' || r.embargo) u = -10;
  return u;
}
function proposeContract(from, to, res, amount, price, cycles, fromIsSeller) {
  const seller = fromIsSeller ? from : to, buyer = fromIsSeller ? to : from;
  const other = fromIsSeller ? to : from;
  if (relOf(from, to.id).status === 'war') return { ok: false, why: 'در وضعیت جنگ قرارداد ممکن نیست.' };
  if (to.isPlayer) {
    W.requests = W.requests || [];
    W.requests.push({ id: (W.reqId = (W.reqId || 0) + 1), type: 'contract', from: from.id, y: W.year, payload: { res, amount, price, cycles, sellerId: seller.id } });
    return { ok: true, pending: true };
  }
  const u = contractValue(to, from, res, amount, price, to.id === seller.id);
  if (noisy(u, aiError(to)) < 0.55) return { ok: true, rejected: true, msg: to.name + ' قرارداد را نپذیرفت.' };
  signContract(seller, buyer, res, amount, price, cycles);
  return { ok: true, msg: to.name + ' قرارداد را پذیرفت.' };
}
function signContract(seller, buyer, res, amount, price, cycles) {
  W.contracts = W.contracts || [];
  W.contracts.push({
    id: (W.ctrId = (W.ctrId || 0) + 1), seller: seller.id, buyer: buyer.id,
    res: res, amount: amount, price: price, left: cycles, started: Math.floor(W.year)
  });
  relOf(seller, buyer.id).trade += amount * price * 0.4;
  relOf(buyer, seller.id).trade += amount * price * 0.4;
  news('قرارداد بلندمدت', seller.name + ' تأمین ' + faNum(amount) + ' واحد ' + RES_NAMES[res] + ' در هر چرخه را به ' + buyer.name + ' تعهد کرد.', 'econ', { c: seller.id, c2: buyer.id });
}
function contractsCycle() {
  if (!W.contracts) W.contracts = [];
  for (const k of W.contracts.slice()) {
    const s = W.countries[k.seller], b = W.countries[k.buyer];
    const idx = W.contracts.indexOf(k);
    if (!s || !b || !s.alive || !b.alive) { W.contracts.splice(idx, 1); continue; }
    if (relOf(s, b.id).status === 'war') {
      W.contracts.splice(idx, 1);
      news('لغو قرارداد', 'جنگ، قرارداد ' + RES_NAMES[k.res] + ' میان ' + s.name + ' و ' + b.name + ' را لغو کرد.', 'econ', { c: s.id, c2: b.id });
      continue;
    }
    const cost = k.amount * k.price;
    if (s.stock[k.res] >= k.amount && b.treasury >= cost) {
      s.stock[k.res] -= k.amount; b.stock[k.res] += k.amount;
      s.treasury += cost; b.treasury -= cost;
      relOf(s, b.id).trust = clamp(relOf(s, b.id).trust + 0.6, 0, 100);
      relOf(b, s.id).trust = clamp(relOf(b, s.id).trust + 0.6, 0, 100);
      k.left--;
      if (k.left <= 0) W.contracts.splice(idx, 1);
    } else {
      /* نقض تعهد */
      W.contracts.splice(idx, 1);
      const breaker = s.stock[k.res] < k.amount ? s : b;
      const other = breaker === s ? b : s;
      relOf(other, breaker.id).trust = clamp(relOf(other, breaker.id).trust - 14, 0, 100);
      addCountryMemory(other, { t: 'betray', other: breaker.id, w: 0.5 });
      news('نقض قرارداد', breaker.name + ' نتوانست به تعهد خود در برابر ' + other.name + ' عمل کند.', 'econ', { c: breaker.id, c2: other.id });
    }
  }
}
function aiContracts(c) {
  if (!RNGX.chance(0.10)) return;
  const partners = Object.keys(c.rel).map(Number).filter(id => {
    const o = W.countries[id], r = c.rel[id];
    return o && o.alive && r.status !== 'war' && !r.embargo && r.trust > 40;
  });
  if (!partners.length) return;
  const o = W.countries[RNGX.pick(partners)];
  const res = RNGX.pick(RES_KEYS);
  const myNeed = resNeed(c, res), theirNeed = resNeed(o, res);
  if (myNeed > 0.4 && theirNeed < 0.25 && o.stock[res] > 60) {
    const amount = Math.round(Math.min(o.stock[res] * 0.15, 60) + 10);
    const price = W.market[res].price * RNGX.range(0.95, 1.15);
    proposeContract(c, o, res, amount, price, RNGX.int(4, 12), false);
  } else if (theirNeed > 0.4 && myNeed < 0.25 && c.stock[res] > 60) {
    const amount = Math.round(Math.min(c.stock[res] * 0.15, 60) + 10);
    const price = W.market[res].price * RNGX.range(0.9, 1.1);
    proposeContract(c, o, res, amount, price, RNGX.int(4, 12), true);
  }
}
/* ---------- ۳۳) درخواست کمک کشورهای AI از بازیکن ---------- */
function aiAskPlayer(c) {
  const pl = W.countries[W.player];
  if (!pl || !pl.alive || c.isPlayer) return;
  const r = relOf(c, pl.id);
  if (r.status === 'war' || r.trust < 45) return;
  const atWar = Object.values(c.rel).some(x => x.status === 'war');
  const broke = c.treasury < avgStateRevenue(c) * c.owned.length * 0.2;
  const hungry = (c.foodShort || 0) > 0.25;
  if (!(atWar || broke || hungry)) return;
  if (!RNGX.chance(0.12)) return;
  W.requests = W.requests || [];
  for (const q of W.requests) if (q.from === c.id && q.type === 'askAid') return;
  const kind = hungry ? 'food' : (broke ? 'money' : 'join');
  const amount = kind === 'money' ? Math.round(Math.max(80, avgStateRevenue(pl) * 2)) : (kind === 'food' ? 120 : 0);
  W.requests.push({ id: (W.reqId = (W.reqId || 0) + 1), type: 'askAid', from: c.id, y: W.year, payload: { kind: kind, amount: amount } });
  pause('درخواست کمک از ' + c.name, 'diploReq');
}

/* ---------- ۲۱) چرخه مالی ۵ ساله ---------- */
function cycleStep() {
  W.cycle++;
  const y1 = Math.floor(W.year);
  const y0 = Math.max(W.startYear, y1 - BAL.CYCLE_YEARS);
  const wp = { food: 0, wood: 0, iron: 0, oil: 0, gold: 0 };
  const wd = { food: 0, wood: 0, iron: 0, oil: 0, gold: 0 };
  const alive = [];
  for (const cid in W.countries) if (W.countries[cid].alive) alive.push(W.countries[cid]);
  for (const c of alive) {
    const prod = resourceCycle(c);
    for (const k of RES_KEYS) { c.stock[k] += prod[k]; wp[k] += prod[k]; }
    const pop = countryPop(c);
    wd.food += pop * 0.5;
    wd.wood += c.owned.length * 12 + c.army.troops * 0.05;
    wd.iron += c.owned.length * 8 + c.army.troops * 0.08;
    wd.oil += c.tech >= 40 ? (c.owned.length * 10 + c.army.air * 12) : c.owned.length * 0.5;
    wd.gold += c.owned.length * 2;
  }
  marketCycle(wp, wd);
  contractsCycle();
  for (const c of alive) {
    tradeCycle(c);
    const rev = countryRevenue(c);
    const costs = countryCosts(c, rev);
    const net = rev.revenue - costs.total;
    c.treasury += net;
    /* کسری بودجه */
    if (c.treasury < 0) {
      c.deficitYears++;
      c.army.pay = clamp(100 + (c.treasury / Math.max(costs.army, 1)) * 60, 0, 100);
      c.army.morale = clamp(c.army.morale - 7, 5, 100);
      c.army.readiness = clamp(c.army.readiness - 6, 5, 100);
      c.stability = clamp(c.stability - 3, 0, 100);
      for (const sid of c.owned) W.states[sid - 1].unrest = clamp(W.states[sid - 1].unrest + 2.2, 0, 100);
      if (c.deficitYears > 2) {
        const cut = Math.floor(c.army.troops * 0.12);
        c.army.troops = Math.max(0, c.army.troops - cut);
        c.treasury += cut * 0.3 * (1 + c.tech / 10);
        if (c.isPlayer) news('کسری بودجه', 'بخشی از ارتش به دلیل ناتوانی در پرداخت حقوق منحل شد.', 'crisis', { c: c.id });
      }
    } else {
      c.deficitYears = 0;
      c.army.pay = clamp(c.army.pay + 12, 0, 100);
    }
    if (!c.isPlayer) aiBudget(c);
    /* سرمایه‌گذاری از محل مازاد و ذخیره اضافی خزانه */
    let pool = c.spendRatio * Math.max(0, net);
    const buffer = rev.revenue * 1.4;
    if (c.treasury - pool > buffer) pool += (c.treasury - pool - buffer) * 0.35;
    pool = clamp(pool, 0, Math.max(0, c.treasury));
    c.treasury -= pool;
    const spend = investBudget(c, pool);
    spendArmyFund(c);
    trainingTick(c);
    redistributeGarrison(c);
    /* سربازگیری بیش از حد: کمبود نیروی کار */
    const mm = maxManpower(c);
    if (c.army.troops > mm) {
      const over = (c.army.troops - mm) / Math.max(mm, 1);
      for (const sid of c.owned) {
        const st = W.states[sid - 1];
        st.sat = clamp(st.sat - over * 4, 0, 100);
        st.industry = clamp(st.industry - over * 0.6, 0, 100);
      }
      c.army.troops = Math.max(0, c.army.troops - c.army.troops * clamp(over * 0.25, 0, 0.2));
    }
    c.warWeariness = clamp(c.warWeariness - (Object.values(c.rel).some(r => r.status === 'war') ? 0 : 6), 0, 100);
    c.stability = clamp(c.stability + (avgSat(c) - 50) * 0.06 + GOVS[c.gov].stab * 3 - c.unrestAvg * 0.05 - 1.2 + (c.owned.indexOf(c.capital) >= 0 ? 0.6 : 0), 0, 100);
    c.legitimacy = clamp(c.legitimacy * 0.985 + GOVS[c.gov].legitBase * 1.5 + (avgSat(c) - 50) * 0.03, 0, 100);
    c.corruption = clamp(c.corruption * 0.97 + GOVS[c.gov].corrupt * 3.2 - (c.education / 900) - (c.budget.security || 0) * 4, 2, 92);
    c.lastCycle = {
      y0, y1, revenue: rev.revenue, gross: rev.gross, trade: rev.trade, tribute: rev.tribute,
      costs, net, treasury: c.treasury, pool, spend, tax: c.taxRate
    };
    if (c.isPlayer) {
      news('گزارش مالی ' + faNum(y0) + '–' + faNum(y1),
        'درآمد ' + faNum(rev.revenue) + '، هزینه ' + faNum(costs.total) + '، تغییر خزانه ' +
        (net >= 0 ? '+' : '−') + faNum(Math.abs(net)) + ' میلیون.', 'econ', { c: c.id });
    }
  }
  for (const c of alive) if (!c.owned.length) rebuildLists();
  checkEnd();
}

/* ---------- ۲۲) گام سالانه ---------- */
function yearStep() {
  const y = Math.floor(W.year);
  for (const st of W.states) {
    popYear(st);
    unrestYear(st);
    discoverCheck(st);
    if (st.status === 'tribal' && !st.owner) {
      st.defense = Math.max(st.defense, st.pop * 0.02);
      st.sat = clamp(st.sat + 0.2, 0, 100);
    }
  }
  agentsYear();
  rebuildLists();
  checkEnd();
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    updateRelations(c);
    factionsYear(c);
    revolutionYear(c);
    coupYear(c);
    civilianReturn(c);
    aiAskPlayer(c);
    if (!c.isPlayer) aiContracts(c);
    if (c.credibility == null) c.credibility = 70;
    c.credibility = clamp(c.credibility + 0.6, 0, 100);
    if ((y + c.aiOffset) % 2 === 0) aiDecide(c);
  }
  worldEvents();
  if (y % 25 === 0) {
    const alive = Object.values(W.countries).filter(c => c.alive).length;
    logHistory(y, 'سال ' + faNum(y) + ': ' + faNum(alive) + ' کشور فعال در جهان.');
  }
}

/* ---------- ۲۳) تیک شبیه‌سازی ---------- */
function stepTick() {
  if (W.over) return false;
  const dt = 1 / BAL.TICKS_PER_YEAR;
  const before = Math.floor(W.year);
  W.year = Math.round((W.year + dt) * 1000) / 1000;
  const after = Math.floor(W.year);
  for (const op of W.ops.slice()) {
    if (!opTick(op)) {
      const i = W.ops.indexOf(op);
      if (i >= 0) W.ops.splice(i, 1);
    }
  }
  if (after > before) {
    yearStep();
    if (after % BAL.CYCLE_YEARS === 0) cycleStep();
  }
  return true;
}

/* ---------- ۲۴) اعتبارسنجی ---------- */
function validate() {
  const errs = [];
  if (W.states.length !== BAL.MAX_STATES) errs.push('تعداد ایالت‌ها ' + W.states.length + ' است.');
  const ids = new Set();
  for (const st of W.states) {
    if (ids.has(st.id)) errs.push('شناسه تکراری: ' + st.id);
    ids.add(st.id);
    if (st.owner && (!W.countries[st.owner] || !W.countries[st.owner].alive)) errs.push('مالک نامعتبر در ایالت ' + st.id);
    if (st.controller && (!W.countries[st.controller] || !W.countries[st.controller].alive)) errs.push('کنترل‌کننده نامعتبر در ایالت ' + st.id);
    if (!(st.pop >= 0) || !isFinite(st.pop)) errs.push('جمعیت نامعتبر در ایالت ' + st.id);
    for (const k of ['infra', 'industry', 'agri', 'health', 'security', 'trade', 'sat', 'unrest', 'devast']) {
      if (!isFinite(st[k])) errs.push('مقدار نامعتبر ' + k + ' در ایالت ' + st.id);
    }
    if (st.iron < 0 || st.oil < 0 || st.gold < 0) errs.push('ذخیره منفی در ایالت ' + st.id);
  }
  let owned = 0;
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;
    if (!isFinite(c.treasury)) errs.push('خزانه نامعتبر در ' + c.name);
    if (!isFinite(c.tech) || c.tech < 0 || c.tech > 100) errs.push('فناوری نامعتبر در ' + c.name);
    if (!isFinite(c.army.troops) || c.army.troops < 0) errs.push('ارتش نامعتبر در ' + c.name);
    if (!c.owned.length) errs.push('کشور بدون ایالت هنوز زنده است: ' + c.name);
    owned += c.owned.length;
    for (const sid of c.owned) if (W.states[sid - 1].owner !== c.id) errs.push('ناسازگاری مالکیت ایالت ' + sid);
  }
  if (!W.countries[W.player] || !W.countries[W.player].alive) {
    if (!W.over) errs.push('کشور بازیکن نامعتبر است.');
  }
  return errs;
}

/* ---------- ۲۵) ذخیره و بارگذاری ---------- */
function safeReplacer(k, v) {
  /* هیچ گردکردنی انجام نمی‌شود تا بازیابی دقیقاً یکسان باشد */
  if (typeof v === 'number' && !isFinite(v)) return 0;
  return v;
}
function saveGame() {
  rebuildLists();
  const data = {
    v: 3, seed: W.seed, rng: RNGX.save(), world: W
  };
  return JSON.stringify(data, safeReplacer);
}
function loadGame(json) {
  const data = typeof json === 'string' ? JSON.parse(json) : json;
  if (!data || !data.world) throw new Error('فایل ذخیره نامعتبر است.');
  GEO = buildGeo(data.seed);
  W = data.world;
  RNGX = new RNG(data.rng && data.rng.length === 4 ? data.rng : (data.seed + '|sim'));
  W.seed = data.seed;
  if (!W.settings) W.settings = { autoPause: {} };
  linkGeo();
  rebuildLists();
  return validate();
}
function linkGeo() {
  for (const st of W.states) {
    st.coastalB = !!GEO.coastal[st.id - 1];
    if (!st.known) st.known = { food: true, wood: true, gold: true, iron: st.iron > 0, oil: false };
  }
}

/* ---------- ۲۶) بسته‌های داده برای رابط ---------- */
function geoPayload() {
  const polys = [];
  for (let i = 0; i < GEO.N; i++) {
    let d = 'M';
    const p = GEO.polys[i];
    for (let j = 0; j < p.length; j++) d += (j ? 'L' : '') + p[j][0] + ' ' + p[j][1];
    polys.push(d + 'Z');
  }
  const edges = GEO.edges.map(e => {
    let d = 'M' + e.p[0][0] + ' ' + e.p[0][1];
    for (let j = 1; j < e.p.length; j++) d += 'L' + e.p[j][0] + ' ' + e.p[j][1];
    return { a: e.a, b: e.b, d };
  });
  return {
    W: GEO.W, H: GEO.H, N: GEO.N, polys, edges,
    centers: GEO.centers, neighbors: GEO.neighbors,
    coastal: Array.from(GEO.coastal), terrain: Array.from(GEO.terrain), comp: Array.from(GEO.comp)

}

    income: st.lastInc, output: st.lastOut || stateOutput(st),

    health: st.health, security: st.security, trade: st.trade, devast: st.devast, integ: st.integ,
    defense: st.defense, fort: st.fort, tech: ctrl ? ctrl.tech : 0,
    res: {

      iron: st.known.iron ? Math.round(st.iron) : -1,

    },

      oil: st.known.oil && st.oil > 0 && ctrl && ctrl.tech >= 40 ? Math.round(st.oil * 0.020 * (0.3 + ctrl.tech / 60) + 3) : 0,
      gold: st.known.gold && st.gold > 0 ? Math.round(st.gold * 0.013 * (0.5 + (ctrl ? ctrl.tech : 1) / 80) + 0.8) : 0,

}

function worldRanking() {
  const list = [];
  for (const cid in W.countries) {
    const c = W.countries[cid];
    if (!c.alive) continue;

/* ---------- ۲۸) فرمان‌های بازیکن ---------- */
function command(cmd, a) {
  const pc = W.countries[W.player];
  if (!pc || !pc.alive) return { ok: false, why: 'کشور شما دیگر وجود ندارد.' };
  if (W.over && cmd !== 'validate') return { ok: false, why: 'بازی پایان یافته است.' };
  const st = a && a.state ? W.states[a.state - 1] : null;
  switch (cmd) {
    case 'tax':
      pc.taxRate = clamp(+a.value, 0, GOVS[pc.gov].taxMax);
      return { ok: true, value: pc.taxRate, max: GOVS[pc.gov].taxMax };
    case 'spendRatio': pc.spendRatio = clamp(+a.value, 0.1, 0.95); return { ok: true };
    case 'conscript': pc.conscript = clamp(+a.value, 0.005, 0.09); return { ok: true };
    case 'armyTarget': pc.armyTarget = clamp(+a.value, 0, 1); return { ok: true };
    case 'budget': {
      let tot = 0;
      for (const k of BUDGET_KEYS) tot += Math.max(0, +a.value[k] || 0);
      if (tot <= 0) return { ok: false, why: 'مقادیر بودجه نامعتبر است.' };
      for (const k of BUDGET_KEYS) pc.budget[k] = Math.max(0, +a.value[k] || 0) / tot;
      return { ok: true, budget: pc.budget };
    }
    case 'recruit': {
      const n = Math.max(1, Math.floor(+a.n));
      const mm = maxManpower(pc);
      const cur = pc.army.troops + pendingTrain(pc);
      if (cur + n > mm) return { ok: false, why: 'سقف نیروی انسانی ' + faNum(Math.floor(mm)) + ' سرباز است.' };
      const base = BAL.RECRUIT_COST * (1 + pc.tech / 12);
      const extra = resourceNeedFor(pc, 'troops', n);
      const cost = n * base + extra;

var useWorker = false, worker = null, local = null, pingOK = false;

function engineSend(msg) {

}
function initEngine() {
  var src = '(' + KV_ENGINE_MAIN.toString() + ')()';

    var url = URL.createObjectURL(blob);
    worker = new Worker(url);
    worker.onmessage = function (e) { onMsg(e.data); };
    worker.onerror = function () { fallbackLocal(); };
    useWorker = true;
    engineSend({ type: 'ping' });

  } catch (e) { fallbackLocal(); }

}
function fallbackLocal() {
  if (local) return;

  useWorker = false;
  local = KV_ENGINE_MAIN();
  local.setPost(onMsg);
  pingOK = true;
  $('#engmode').textContent = 'اجرا در نخ اصلی (سازگار با باز کردن مستقیم فایل)';
}
function onMsg(m) {
  switch (m.type) {
    case 'pong':
      pingOK = true;
      if (useWorker) $('#engmode').textContent = 'اجرای شبیه‌سازی در Web Worker';
      break;
    case 'ready':
      G.geo = m.geo; G.meta = m.meta; G.ready = true;
      buildMap();
      applySnap(m.snap);
      startGameUI();
      if (m.errs && m.errs.length) toast('هشدار اعتبارسنجی: ' + m.errs[0], 'bad');
      break;
    case 'snap':
      G.waiting = false;
      applySnap(m.snap);
      break;
    case 'cmdResult':
      G.waiting = false;
      if (m.res && m.res.ok === false) toast(m.res.why || 'انجام نشد', 'bad');
      else if (m.res && m.res.msg) toast(m.res.msg, m.res.rejected ? '' : 'good');
      applySnap(m.snap);
      if (G.sel) refreshState();
      if (G.modalKind) refreshModal();
      break;
    case 'inspect':
      G.inspectCache[m.kind + ':' + (m.id || 0)] = m.data;
      if (m.rid && pending[m.rid]) { pending[m.rid](m.data); delete pending[m.rid]; }
      break;
    case 'saveData': doSaveFile(m.json); break;
    case 'validation':
      toast(m.errs.length ? ('خطاها: ' + m.errs.slice(0, 3).join(' | ')) : 'اعتبارسنجی موفق: بدون خطا', m.errs.length ? 'bad' : 'good');

function bindStateActions(d) {

          (t === 'colonize'

            : 'در تصرف کامل، مالکیت ایالت به شما می‌رسد ولی مردم تا مدت‌ها ناراضی‌اند و درآمد کامل نخواهد بود.') +
          '</div>' +

          kv('نیروی آزاد شما', fa(Math.floor(free))) +
          '<div class="slider"><label>نیروی اعزامی</label><input type="range" id="dForce" min="5" max="' + Math.max(6, Math.floor(free)) + '" value="' + Math.min(Math.floor(free), Math.ceil(def * 1.2)) + '"><b id="dForceV"></b></div>',
          function () {

function refreshModal() {
  var k = G.modalKind;
  if (!k) return;
  if (k === 'help') { renderHelp(); return; }
  if (k === 'save') { renderSave(); return; }
  if (k === 'history') { ask('history', 0, renderHistory); return; }
  if (k === 'people') { ask('people', 0, renderPeople); return; }
  if (k === 'diplo') { ask('country', 0, function (d) { ask('ranking', 0, function (r) { renderDiplo(d, r); }); }); return; }
  ask('country', 0, function (d) {
    if (!d) return;
    if (k === 'country') renderCountry(d);
    else if (k === 'economy') renderEconomy(d);
    else if (k === 'invest') renderInvest(d);
    else if (k === 'army') renderArmy(d);

/* ---------- ذخیره‌سازی ---------- */
var IDB = null, idbTried = false;
function idb(cb) {
  if (IDB) { cb(IDB); return; }
  if (idbTried) { cb(null); return; }
  idbTried = true;
  try {
    var rq = indexedDB.open('worldDynasty', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
    rq.onsuccess = function () { IDB = rq.result; cb(IDB); };
    rq.onerror = function () { cb(null); };
    setTimeout(function () { if (!IDB) cb(null); }, 900);
  } catch (e) { cb(null); }
}
function storeSet(key, val, cb) {
  idb(function (db) {
    if (db) {
      try {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function () { if (cb) cb(true); };
        tx.onerror = function () { lsSet(key, val, cb); };
        return;
      } catch (e) {}
    }
    lsSet(key, val, cb);
  });
}
function lsSet(key, val, cb) {
  try { localStorage.setItem('wd_' + key, val); if (cb) cb(true); }
  catch (e) { if (cb) cb(false); }
}
function storeGet(key, cb) {
  idb(function (db) {
    if (db) {
      try {
        var tx = db.transaction('kv', 'readonly');
        var rq = tx.objectStore('kv').get(key);
        rq.onsuccess = function () {
          if (rq.result) cb(rq.result);
          else { try { cb(localStorage.getItem('wd_' + key)); } catch (e) { cb(null); } }
        };
        rq.onerror = function () { try { cb(localStorage.getItem('wd_' + key)); } catch (e) { cb(null); } };
        return;
      } catch (e) {}
    }
    try { cb(localStorage.getItem('wd_' + key)); } catch (e) { cb(null); }
  });
}
function doSaveFile(json) {
  if (G.savePurpose === 'auto') {
    storeSet('autosave', json, function (ok) {
      if (ok && G.savePurpose === 'auto' && G.showAutoToast) toast('ذخیره خودکار انجام شد', 'good');
      G.showAutoToast = false;
    });
    G.savePurpose = null;
    return;
  }
  try {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'world-dynasty-' + (G.snap ? Math.floor(G.snap.year) : 0) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
    toast('فایل ذخیره ساخته شد', 'good');
  } catch (e) { toast('خروجی گرفتن ممکن نشد: ' + e.message, 'bad'); }
  G.savePurpose = null;
  storeSet('autosave', json);
}
function renderSave() {
  var ap = G.snap.settings.autoPause;
  var AP = { leaderDeath: 'مرگ حاکم', govChange: 'تغییر حکومت', warDec: 'اعلان جنگ علیه شما', stateLost: 'نبرد یا سقوط ایالت', revolution: 'انقلاب و قیام', coup: 'کودتا', diploReq: 'درخواست دیپلماتیک', peace: 'پیشنهاد صلح', newCountry: 'پیدایش کشور تازه' };
  var h = '<div class="card"><h4>ذخیره و بارگذاری</h4>' +
    '<div class="row"><button class="btn primary" id="svExport">خروجی ذخیره بازی</button>' +
    '<button class="btn" id="svImport">بارگذاری ذخیره</button></div>' +
    '<div class="row" style="margin-top:8px"><button class="btn" id="svAuto">ذخیره خودکار همین حالا</button>' +
    '<button class="btn" id="svLoadAuto">بازیابی ذخیره خودکار</button></div>' +
    '<div class="hint">ذخیره خودکار هر ۹۰ ثانیه در حافظه مرورگر انجام می‌شود. فایل خروجی JSON کل جهان را با همان وضعیت بازمی‌گرداند. هنگام بسته بودن بازی زمان متوقف است و پیشرفت آفلاین وجود ندارد.</div></div>';
  h += '<div class="card"><h4>توقف خودکار</h4>';
  for (var k in AP) {
    h += '<div class="kv"><span>' + AP[k] + '</span><b><input type="checkbox" data-ap="' + k + '"' + (ap[k] ? ' checked' : '') + '></b></div>';
  }
  h += '</div>';
  h += '<div class="card"><h4>بررسی سلامت شبیه‌سازی</h4>' +
    '<button class="btn" id="svVal">اجرای اعتبارسنجی</button>' +
    '<div class="hint">بررسی می‌کند که دقیقاً ۳۰۰ ایالت با شناسه یکتا، مالک و کنترل‌کننده معتبر، جمعیت و خزانه معتبر و بدون NaN وجود دارد.</div></div>';
  h += '<div class="card"><h4>اطلاعات بازی</h4>' + kv('Seed', esc(G.meta.seed)) +
    kv('سال', fa(Math.floor(G.snap.year))) + kv('چرخه مالی', fa(G.snap.cycle)) +
    kv('کشورهای فعال', fa(G.snap.nCountries)) +
    kv('موتور', useWorker ? 'Web Worker' : 'نخ اصلی') + '</div>';
  h += '<div class="card"><button class="btn" id="svNew">شروع بازی تازه</button></div>';
  setModal('ذخیره بازی', h);
  $('#svExport').onclick = function () { G.savePurpose = 'file'; engineSend({ type: 'save' }); };
  $('#svImport').onclick = function () { $('#fileIn').click(); };
  $('#svAuto').onclick = function () { G.savePurpose = 'auto'; G.showAutoToast = true; engineSend({ type: 'save' }); };
  $('#svLoadAuto').onclick = function () {
    storeGet('autosave', function (v) {
      if (!v) { toast('ذخیره خودکاری یافت نشد', 'bad'); return; }
      closeModal();
      engineSend({ type: 'load', data: v });
    });
  };
  $('#svVal').onclick = function () { engineSend({ type: 'validate' }); };
  $('#svNew').onclick = function () {
    confirmDialog('بازی تازه', '<div style="font-size:12.5px;color:var(--dim)">بازی کنونی رها می‌شود. پیش از آن می‌توانید خروجی ذخیره بگیرید.</div>',
      function () { location.reload(); });
  };
  $$('#mbody [data-ap]').forEach(function (b) {
    b.onchange = function () {
      var o = {};
      o[b.getAttribute('data-ap')] = b.checked;
      cmd('autoPause', { value: o });
    };
  });
}

    'جهان از ۳۰۰ ایالت ساخته شده است. هدف نهایی این است که یک کشور مالک کامل هر ۳۰۰ ایالت شود.<br>' +
    '<b>پیروزی:</b> کشور شما مالک هر ۳۰۰ ایالت شود.<br>' +
    '<b>شکست:</b> کشور شما هیچ ایالتی نداشته باشد. تا زمانی که دست‌کم یک ایالت دارید — حتی پس از انقلاب، کودتا، تغییر حکومت یا سقوط پایتخت — بازی ادامه دارد.' +
    '</div></div>';
  h += '<div class="card"><h4>زمان</h4><div style="font-size:13px;line-height:2">' +
    'هر ۶ ثانیه واقعی برابر ۱ سال بازی است (سرعت ×۱). هر ۵ سال یک چرخه مالی رخ می‌دهد و گزارش آن نمایش داده می‌شود. ' +
    'با دکمه‌های ⏸ ×۱ ×۲ ×۵ ×۱۰ سرعت را تغییر دهید. در رویدادهای مهم بازی خودکار متوقف می‌شود (قابل تنظیم در بخش ذخیره).' +

  h += '<div class="card"><h4>اقتصاد</h4><div style="font-size:13px;line-height:2">' +

    'هزینه‌های دائمی شامل اداره قلمرو (غیرخطی: هرچه ایالت بیشتر، هزینه هر ایالت بیشتر)، ارتش، زیرساخت، دستگاه حکومت، جنگ و مستعمرات است. ' +
    'مالیات بالا درآمد بیشتر ولی رضایت و رشد کمتر می‌آورد.' +
    '</div></div>';
  h += '<div class="card"><h4>فناوری</h4><div style="font-size:13px;line-height:2">' +
    'فناوری یک شاخص واحد ۰ تا ۱۰۰ است و با سال باز نمی‌شود. مسیر آن: پول ← آموزش و دانش ← تحقیق ← فناوری. ' +
    'کشوری متوسط و باثبات حدود ۱۰۰۰ سال زمان می‌برد تا از تمدن اولیه به فناوری نزدیک امروز برسد. پنج دوره نظامی بر پایه فناوری فعال می‌شوند.' +
    '</div></div>';
  h += '<div class="card"><h4>جنگ</h4><div style="font-size:13px;line-height:2">' +
    'برای حمله زمینی باید مرز زمینی مستقیم داشته باشید (مرز قطری کافی نیست). ایالت ساحلی را می‌توان با ناو و فناوری کافی از دریا هدف گرفت. ' +
    'هر عملیات زمان‌بر است و خط تدارکات، فاصله، زمین، استحکامات، روحیه و فناوری بر نتیجه اثر می‌گذارند. نسبت قدرت ۱ یعنی نبرد برابر و ۲ یعنی احتمال پیروزی بسیار بالا — اما هیچ برتری‌ای پیروزی تضمین‌شده نیست.' +
    '</div></div>';
  h += '<div class="card"><h4>استعمار و شورش</h4><div style="font-size:13px;line-height:2">' +
    'استعمار آسان‌تر از تصرف کامل است (حدود ۶۰٪ توان لازم) ولی مالکیت رسمی را تغییر نمی‌دهد: حداکثر ۵۰٪ درآمد و منابع را می‌گیرید و هزینه پادگان، امنیت و اداره می‌پردازید؛ سود خالص معمولاً ۲۰ تا ۳۵٪ ارزش ایالت است. ' +
    'حمایت از شورشیان به‌طور خودکار خاک را به شما نمی‌دهد؛ نتیجه می‌تواند استقلال، کشور تازه یا حکومتی همسو باشد.' +
    '</div></div>';
  h += '<div class="card"><h4>راهنمای نقشه</h4><div style="font-size:13px;line-height:2">' +
    'با کشیدن، نقشه را جابه‌جا کنید؛ با چرخ ماوس یا دو انگشت بزرگ‌نمایی کنید. با کلیک یا لمس هر ایالت پنل اطلاعات باز می‌شود. ' +
    'نماهای نقشه (سیاسی، منابع، درآمد، فناوری، رضایت، جنگ، جمعیت) از گوشه بالا قابل تغییر است. ایالت‌های هاشورخورده تحت استعمارند.' +
    '</div></div>';
  if (G.started) setModal('راهنما', h);
  else {
    var m = $('#modal');
    m.classList.remove('hidden');
    m.innerHTML = '<div class="mbox"><div class="mhead"><h3>راهنما</h3><button class="btn sm" id="mclose">بستن</button></div><div class="mbody">' + h + '</div></div>';
    $('#mclose').onclick = closeModal;
    m.onclick = function (e) { if (e.target === m) closeModal(); };
    G.modalKind = null;
  }
}

/* ---------- به‌روزرسانی وضعیت ---------- */
function applySnap(snap) {
  G.snap = snap;
  if (!G.started) return;
  paintMap();
  buildTopbar();
  renderNews();
  renderRequests();
  if (!G.sel) renderOverview();
  if (snap.pause && !snap.over) showPause(snap.pause.r);
  if (snap.over && !G.over) { G.over = true; showEnd(snap.over); }
}
function showEnd(over) {
  setSpeed(0);
  var e = $('#end');
  e.classList.remove('hidden');
  var s = G.snap;
  e.innerHTML = '<div class="endbox ' + (over.win ? '' : 'lose') + '">' +
    '<h2>' + (over.win ? '🏆 پیروزی' : '🏳 پایان بازی') + '</h2>' +
    '<div style="font-size:15px;margin-bottom:10px">' + esc(over.msg) + '</div>' +
    '<div style="color:var(--dim);font-size:13px">سال ' + fa(over.year) + ' — ' +
    (s.player ? 'ایالت‌های شما: ' + fa(s.player.owned) + ' — فناوری: ' + faf(s.player.tech, 1) : 'کشور شما از میان رفت') + '</div>' +
    '<div class="row" style="margin-top:16px">' +
    '<button class="btn primary" id="endNew">بازی تازه</button>' +
    '<button class="btn" id="endSave">خروجی ذخیره</button>' +
    '<button class="btn ghost" id="endWatch">بستن و مرور نقشه</button></div></div>';
  $('#endNew').onclick = function () { location.reload(); };
  $('#endSave').onclick = function () { G.savePurpose = 'file'; engineSend({ type: 'save' }); };
  $('#endWatch').onclick = function () { e.classList.add('hidden'); };
}

/* ---------- حلقه اصلی ---------- */
var accum = 0, lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  var dt = Math.min(0.25, (t - lastT) / 1000);
  lastT = t;
  if (!G.ready || !G.started || G.speed === 0 || G.waiting || (G.snap && G.snap.over)) return;
  accum += dt * G.speed * TICKS_PER_SEC_X1;
  if (accum >= 1) {
    var n = Math.min(Math.floor(accum), 6);
    accum -= n;
    G.waiting = true;
    engineSend({ type: 'step', n: n });
  }
  if (accum > 8) accum = 8;
}
setInterval(function () {
  if (!G.started || !G.ready || (G.snap && G.snap.over)) return;
  G.savePurpose = 'auto';
  engineSend({ type: 'save' });
}, 90000);

/* ---------- کلیدها و راه‌اندازی ---------- */
document.addEventListener('keydown', function (e) {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === 'Escape') { if (G.modalKind || $('#modal').innerHTML) closeModal(); else closeSide(); }
  if (!G.started) return;
  if (e.code === 'Space') { e.preventDefault(); setSpeed(G.speed ? 0 : (G.prevSpeed || 1)); }
  if (e.key >= '1' && e.key <= '5') setSpeed(SPEEDS[+e.key - 1] != null ? SPEEDS[+e.key - 1] : 1);
});
window.addEventListener('resize', function () { applyView(); });
$('#sideclose').onclick = closeSide;
$('#sidebody').innerHTML = emptySide();
$('#sidetitle').textContent = 'کشور من';
initEngine();
initStart();
initMapEvents();
requestAnimationFrame(loop);
})();
</script>
