    'هر بخشی که به دولت واگذار شود، از باقی‌مانده بودجه و بر پایه اولویت‌های کشور تقسیم می‌شود.</div>';
  var manual = 0;
  for (var i = 0; i < keys.length; i++) if (!auto[keys[i]]) manual += (d.budget[keys[i]] || 0);
  for (var j = 0; j < keys.length; j++) {
    var k = keys[j], isAuto = !!auto[k];
    if (k === 'factory' && !d.hasEnergy) {
      h += '<div style="border-bottom:1px solid var(--line);padding:6px 0;opacity:.55">' +
        '<b style="font-size:12.5px">' + names[k] + '</b>' +
        '<div class="hint">تا زمانی که کشور به سوخت و انرژی نرسد این بخش باز نمی‌شود.</div></div>';
      continue;
    }
    var val = Math.round((d.budget[k] || 0) * 100);
    h += '<div style="border-bottom:1px solid var(--line);padding:6px 0">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<b style="flex:1;font-size:12.5px">' + names[k] + '</b>' +
      '<label style="font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:4px">' +
      '<input type="checkbox" data-auto="' + k + '"' + (isAuto ? ' checked' : '') + '> واگذاری به دولت</label>' +
      '<span class="tag" id="ef_' + k + '">' + pc((eff[k] || 0) * 100) + '</span></div>' +

/* ---------- ذخیره‌سازی ---------- */
var IDB = null, idbTried = false;
function idb(cb) {
  if (IDB) { cb(IDB); return; }
  if (idbTried) { cb(null); return; }
  idbTried = true;
  try {
    var rq = indexedDB.open('worldDynasty', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
    rq.onsuccess = function () { IDB = rq.result; cb(IDB); };
    rq.onerror = function () { cb(null); };
    setTimeout(function () { if (!IDB) cb(null); }, 900);
  } catch (e) { cb(null); }
}
function storeSet(key, val, cb) {
  idb(function (db) {
    if (db) {
      try {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function () { if (cb) cb(true); };
        tx.onerror = function () { lsSet(key, val, cb); };
        return;
      } catch (e) {}
    }
    lsSet(key, val, cb);
  });
}
function lsSet(key, val, cb) {
  try { localStorage.setItem('wd_' + key, val); if (cb) cb(true); }
  catch (e) { if (cb) cb(false); }
}
function storeGet(key, cb) {
  idb(function (db) {
    if (db) {
      try {
        var tx = db.transaction('kv', 'readonly');
        var rq = tx.objectStore('kv').get(key);
        rq.onsuccess = function () {
          if (rq.result) cb(rq.result);
          else { try { cb(localStorage.getItem('wd_' + key)); } catch (e) { cb(null); } }
        };
        rq.onerror = function () { try { cb(localStorage.getItem('wd_' + key)); } catch (e) { cb(null); } };
        return;
      } catch (e) {}
    }
    try { cb(localStorage.getItem('wd_' + key)); } catch (e) { cb(null); }
  });
}
function doSaveFile(json) {
  if (G.savePurpose === 'auto') {
    storeSet('autosave', json, function (ok) {
      if (ok && G.savePurpose === 'auto' && G.showAutoToast) toast('ذخیره خودکار انجام شد', 'good');
      G.showAutoToast = false;
    });
    G.savePurpose = null;
    return;
  }
  try {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'world-dynasty-' + (G.snap ? Math.floor(G.snap.year) : 0) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
    toast('فایل ذخیره ساخته شد', 'good');
  } catch (e) { toast('خروجی گرفتن ممکن نشد: ' + e.message, 'bad'); }
  G.savePurpose = null;
  storeSet('autosave', json);
}

    'نظام متمرکزتر مالیات و سرکوب بیشتری دارد. هر تغییر هزینه دارد، ثبات را موقتاً کم می‌کند و تا ۲۵ سال تکرارشدنی نیست.' +
    '</div></div>';
  h += '<div class="card"><h4>اقتصاد</h4><div style="font-size:13px;line-height:2">' +
    'هر ایالت بر پایه جمعیت، فناوری، زیرساخت، صنعت، تجارت، ثبات، سلامت، امنیت و منابع خود تولید می‌کند. درآمد دولت = مالیات بر این تولید. ' +
    'هزینه‌های دائمی شامل اداره قلمرو (غیرخطی: هرچه ایالت بیشتر، هزینه هر ایالت بیشتر)، ارتش، زیرساخت، دستگاه حکومت، جنگ و مستعمرات است. ' +
    'مالیات بالا درآمد بیشتر ولی رضایت و رشد کمتر می‌آورد.' +
    '</div></div>';
  h += '<div class="card"><h4>منابع، سوخت و بورس</h4><div style="font-size:13px;line-height:2">' +
    'هر ذخیره معدنی یا <b>سرشار</b> است یا <b>معمولی</b>: سرشار دست‌کم ۵۰۰ سال بهره‌برداری می‌دهد و در نقشه منابع پررنگ‌تر دیده می‌شود. ' +
    'منابع تمام‌شدنی‌اند ولی هرگز به‌کلی از جهان پایان نمی‌گیرند: در ایالت‌های مستعد پیوسته ذخایر تازه کشف می‌شود و هرچه ذخایر جهانی کمتر شود، اکتشاف شتاب می‌گیرد.<br>' +
    'ترتیب کشف با فناوری است: چوب و غذا از آغاز، آهن از فناوری ۱۲، طلا از ۲۲ و نفت از ۴۰. کشوری که منبعی ندارد باید آن را از دیگران بخرد.<br>' +
    'در بخش <b>منابع</b> می‌بینید کدام منبع کم است و کدام مازاد دارد، و با نوار تعیین می‌کنید چند درصد برای مصرف داخلی بماند و چه مقدار برای فروش برود. هر منبع تیک واگذاری به دولت دارد.<br>' +
    '<b>سوخت و انرژی</b> از نفتِ مصرف داخلی ساخته می‌شود؛ هرچه نفت بیشتر، سوخت بیشتر. کشورهایی که به سوخت رسیده‌اند در نمای فناوری نماد ⚡ می‌گیرند. ' +
    'کشوری که فناوری‌اش کافی است ولی نفت ندارد می‌تواند سوخت بخرد؛ این خرید مصرفی است و دائمی نیست.<br>' +
    'دو کشور در حال جنگ با هم تجارت نمی‌کنند و کشورهای دشمن رابطه تجاری بسیار کمی دارند؛ پس اگر به منابع کشوری نیاز دارید، دوستی با او به سود شماست.<br>' +
    'کشورهای دارای سوخت بخش <b>کارخانه، کمپانی و تأسیسات</b> را در سرمایه‌گذاری باز می‌کنند. رشد آن عمداً کند است، رضایت مردم را بالا می‌برد و ' +
    'با رسیدن به ۱۵٪ کشور وارد <b>بورس بین‌المللی</b> می‌شود. ارزش سهام از پیشرفت کارخانه، منابع در اختیار، حجم تجارت و جمعیت می‌آید.' +
    '</div></div>';
  h += '<div class="card"><h4>فناوری</h4><div style="font-size:13px;line-height:2">' +
    'فناوری یک شاخص واحد ۰ تا ۱۰۰ است و با سال باز نمی‌شود. مسیر آن: پول ← آموزش و دانش ← تحقیق ← فناوری. ' +
    'کشوری متوسط و باثبات حدود ۱۰۰۰ سال زمان می‌برد تا از تمدن اولیه به فناوری نزدیک امروز برسد. پنج دوره نظامی بر پایه فناوری فعال می‌شوند و ' +
    'توان رزمی هر دوره به‌روشنی از دوره پیش بالاتر است: صد سرباز دوره سلاح هوشمند چند برابر صد سرباز دوره سلاح پیشرفته می‌ارزد.' +
    '</div></div>';
  h += '<div class="card"><h4>جنگ</h4><div style="font-size:13px;line-height:2">' +
    'در دوره سلاح پیشرفته و سلاح هوشمند، حمله و پدافند <b>سوخت و انرژی</b> می‌خورند و درصد سوخت در نوار بالا دیده می‌شود. ' +
    'مصرف پدافند ۸۰٪ کمتر از آفند است. با تمام‌شدن سوخت، پدافند همچنان انجام می‌شود ولی ضعیف‌تر و حمله بسیار کم‌اثر می‌شود؛ ' +
    'در جنگ‌های فرسایشی باید حواستان به ذخیره سوخت باشد.<br>' +
    'برای حمله زمینی باید مرز زمینی مستقیم داشته باشید (مرز قطری کافی نیست). ایالت ساحلی را می‌توان با ناو و فناوری کافی از دریا هدف گرفت. ' +
    'هر عملیات زمان‌بر است و خط تدارکات، فاصله، زمین، استحکامات، روحیه و فناوری بر نتیجه اثر می‌گذارند. نسبت قدرت ۱ یعنی نبرد برابر و ۲ یعنی احتمال پیروزی بسیار بالا — اما هیچ برتری‌ای پیروزی تضمین‌شده نیست.' +
    '</div></div>';
  h += '<div class="card"><h4>جنگ راهبردی (دوره سلاح پیشرفته و هوشمند)</h4><div style="font-size:13px;line-height:2">' +
    'از فناوری ۶۰ به بالا دو توان تازه باز می‌شود: <b>آفند</b> و <b>پدافند</b>، هرکدام تا سطح ۵۰ (سقف هر لحظه به فناوری شما بسته است). ' +
    'با آفند می‌توانید به‌جای گرفتن ایالت، به تأسیسات یک کشور حمله کنید: فناوری، دانش، آموزش، سلامت، صنعت، کشاورزی، تجارت، زیرساخت و آمادگی ارتش آن عقب می‌رود ' +
    'ولی هیچ خاکی جابه‌جا نمی‌شود. پدافند برابر با آفند دشمن تا ۸۰٪ اثر حمله را خنثی می‌کند؛ برای نمونه آفند ۲۰ در برابر پدافند ۲۰ تنها حدود یک‌پنجم اثر را می‌گذارد. ' +
    'هر عملیات هزینه دارد، تجهیزات دو طرف فرسوده می‌شود و اعتماد جهانی مهاجم کاهش می‌یابد.' +
    '</div></div>';
  h += '<div class="card"><h4>گزارش‌ها و هشدارها</h4><div style="font-size:13px;line-height:2">' +
    'هر تغییر مالکیت یا کنترل در «تاریخ ایالت» ثبت می‌شود: چه کسی، چگونه و به چه علت. ' +
    'اگر ایالتی از کشور شما جدا شود، پیام کاملی با نحوه جدایی (تصرف نظامی، شورش، جدایی، پایان استعمار…)، علت‌های زمینه‌ای، ' +
    'جمعیت و درآمد از دست رفته نمایش داده می‌شود. اخبار هم به دو دسته <b>داخلی</b> و <b>خارجی</b> تقسیم شده است.' +
    '</div></div>';
  h += '<div class="card"><h4>استعمار و شورش</h4><div style="font-size:13px;line-height:2">' +
    'استعمار آسان‌تر از تصرف کامل است (حدود ۶۰٪ توان لازم) ولی مالکیت رسمی را تغییر نمی‌دهد: حداکثر ۵۰٪ درآمد و منابع را می‌گیرید و هزینه پادگان، امنیت و اداره می‌پردازید؛ سود خالص معمولاً ۲۰ تا ۳۵٪ ارزش ایالت است. ' +
    'حمایت از شورشیان به‌طور خودکار خاک را به شما نمی‌دهد؛ نتیجه می‌تواند استقلال، کشور تازه یا حکومتی همسو باشد.' +
    '</div></div>';
  h += '<div class="card"><h4>راهنمای نقشه</h4><div style="font-size:13px;line-height:2">' +
    'با کشیدن، نقشه را جابه‌جا کنید؛ با چرخ ماوس یا دو انگشت بزرگ‌نمایی کنید. با کلیک یا لمس هر ایالت پنل اطلاعات باز می‌شود. ' +
    'نماهای نقشه (سیاسی، منابع، درآمد، فناوری، رضایت، جنگ، جمعیت) از گوشه بالا قابل تغییر است. ایالت‌های هاشورخورده تحت استعمارند.' +
    '</div></div>';
  if (G.started) setModal('راهنما', h);
  else {
    var m = $('#modal');
    m.classList.remove('hidden');
    m.innerHTML = '<div class="mbox"><div class="mhead"><h3>راهنما</h3><button class="btn sm" id="mclose">بستن</button></div><div class="mbody">' + h + '</div></div>';
    $('#mclose').onclick = closeModal;
    m.onclick = function (e) { if (e.target === m) closeModal(); };
    G.modalKind = null;
  }
}

/* ---------- هشدارهای مهم بازیکن ---------- */
function queueAlerts(list) {
  G.alertQueue = (G.alertQueue || []).concat(list);
  if (G.alertQueue.length > 8) G.alertQueue = G.alertQueue.slice(-8);
  if (!G.alertShown) showNextAlert();
}
function showNextAlert() {
  var q = G.alertQueue || [];
  if (!q.length) { G.alertShown = false; return; }
  var a = q.shift();
  G.alertShown = true;
  var box = $('#alertbox');
  var isLoss = a.type === 'stateLost';
  var isHit = a.type === 'strategicHit';
  var title = isLoss ? ('ایالت ' + fa(a.state) + ' از کشور شما جدا شد')
    : (isHit ? ('حمله راهبردی ' + esc(a.other) + ' به کشور شما')
      : ('ایالت ' + fa(a.state) + ' به قلمرو شما افزوده شد'));
  var h = '<div class="alertcard ' + (isLoss || isHit ? 'bad' : 'good') + '">' +
    '<div class="ahead">' + (isLoss ? '⚑ ' : (isHit ? '✸ ' : '★ ')) + esc(title) + '</div>' +
    '<div class="abody">';
  h += '<div class="kv"><span>سال</span><b>' + fa(a.y) + '</b></div>';
  h += '<div class="kv"><span>نحوه</span><b>' + esc(a.kindName || '') + '</b></div>';
  if (a.other) h += '<div class="kv"><span>' + (isLoss ? 'به سود' : (isHit ? 'مهاجم' : 'از')) + '</span><b>' + esc(a.other) + '</b></div>';
  if (a.reason) h += '<div class="kv"><span>علت</span><b>' + esc(a.reason) + '</b></div>';
  if (a.detail) h += '<div class="kv"><span>جزئیات</span><b>' + esc(a.detail) + '</b></div>';
  if (a.pop) h += '<div class="kv"><span>جمعیت از دست رفته</span><b>' + ppl(a.pop) + '</b></div>';
  if (a.income) h += '<div class="kv"><span>درآمد چرخه‌ای</span><b>' + money(a.income) + '</b></div>';
  if (isLoss && a.unrest != null) h += '<div class="kv"><span>نارضایتی هنگام جدایی</span><b>' + pc(a.unrest) + '</b></div>';
  if (a.wasCapital) h += '<div style="color:var(--bad);margin-top:4px">این ایالت پایتخت شما بود؛ پایتخت تازه تعیین شد.</div>';
  if (a.states && a.states.length) h += '<div class="kv"><span>ایالت‌های آسیب‌دیده</span><b>' + a.states.map(fa).join('، ') + '</b></div>';
  h += '</div><div class="row" style="margin-top:10px">';
  if (a.state) h += '<button class="btn sm" id="alShow">نمایش روی نقشه</button>';
  h += '<button class="btn sm primary" id="alOk">باشد</button>' +
    (q.length ? '<span style="align-self:center;color:var(--dim2);font-size:11px">' + fa(q.length) + ' پیام دیگر</span>' : '') +
    '</div></div>';
  box.innerHTML = h;
  box.classList.remove('hidden');
  $('#alOk').onclick = function () { box.classList.add('hidden'); showNextAlert(); };
  if ($('#alShow')) $('#alShow').onclick = function () {
    box.classList.add('hidden');
    selectState(a.state);
    focusState(a.state);
    showNextAlert();
  };
}
function focusState(id) {
  if (!G.geo || !id) return;
  var c = G.geo.centers[id - 1];
  G.view.s = Math.max(G.view.s, 2.6);
  G.view.x = 800 - c[0] * G.view.s;
  G.view.y = 500 - c[1] * G.view.s;
  clampView(); applyView();
}

/* ---------- به‌روزرسانی وضعیت ---------- */
function applySnap(snap) {
  G.snap = snap;
  if (!G.started) return;
  paintMap();
  buildTopbar();
  buildNewsTabs();
  renderNews();
  renderRequests();
  if (!G.sel) renderOverview();
  if (snap.alerts && snap.alerts.length) queueAlerts(snap.alerts);
  if (snap.pause && !snap.over) showPause(snap.pause.r);
  if (snap.over && !G.over) { G.over = true; showEnd(snap.over); }
}
function showEnd(over) {
  setSpeed(0);
  var e = $('#end');
  e.classList.remove('hidden');
  var s = G.snap;
  e.innerHTML = '<div class="endbox ' + (over.win ? '' : 'lose') + '">' +
    '<h2>' + (over.win ? '🏆 پیروزی' : '🏳 پایان بازی') + '</h2>' +
    '<div style="font-size:15px;margin-bottom:10px">' + esc(over.msg) + '</div>' +
    '<div style="color:var(--dim);font-size:13px">سال ' + fa(over.year) + ' — ' +
    (s.player ? 'ایالت‌های شما: ' + fa(s.player.owned) + ' — فناوری: ' + faf(s.player.tech, 1) : 'کشور شما از میان رفت') + '</div>' +
    '<div class="row" style="margin-top:16px">' +
    '<button class="btn primary" id="endNew">بازی تازه</button>' +
    '<button class="btn" id="endSave">خروجی ذخیره</button>' +
    '<button class="btn ghost" id="endWatch">بستن و مرور نقشه</button></div></div>';
  $('#endNew').onclick = function () { location.reload(); };
  $('#endSave').onclick = function () { G.savePurpose = 'file'; engineSend({ type: 'save' }); };
  $('#endWatch').onclick = function () { e.classList.add('hidden'); };
}

/* ---------- حلقه اصلی ---------- */
var accum = 0, lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  var dt = Math.min(0.25, (t - lastT) / 1000);
  lastT = t;
  if (!G.ready || !G.started || G.speed === 0 || G.waiting || (G.snap && G.snap.over)) return;
  accum += dt * G.speed * TICKS_PER_SEC_X1;
  if (accum >= 1) {
    var n = Math.min(Math.floor(accum), 6);
    accum -= n;
    G.waiting = true;
    engineSend({ type: 'step', n: n });
  }
  if (accum > 8) accum = 8;
}
setInterval(function () {
  if (!G.started || !G.ready || (G.snap && G.snap.over)) return;
  G.savePurpose = 'auto';
  engineSend({ type: 'save' });
}, 90000);

/* ---------- کلیدها و راه‌اندازی ---------- */
document.addEventListener('keydown', function (e) {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === 'Escape') { if (G.modalKind || $('#modal').innerHTML) closeModal(); else closeSide(); }
  if (!G.started) return;
  if (e.code === 'Space') { e.preventDefault(); setSpeed(G.speed ? 0 : (G.prevSpeed || 1)); }
  if (e.key >= '1' && e.key <= '5') setSpeed(SPEEDS[+e.key - 1] != null ? SPEEDS[+e.key - 1] : 1);
});
window.addEventListener('resize', function () { applyView(); });
$('#sideclose').onclick = closeSide;
$('#sidebody').innerHTML = emptySide();
$('#sidetitle').textContent = 'کشور من';
initEngine();
initStart();
initMapEvents();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
